<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — Cazo Market</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><rect x='4' y='4' width='120' height='120' rx='30' fill='%230b1220'/><circle cx='64' cy='70' r='50' fill='%234f46e5' opacity='.28'/><g transform='rotate(-5 64 66)'><path d='M48 52V42Q48 26 64 26Q80 26 80 42V52' fill='none' stroke='%23a5b4fc' stroke-width='6' stroke-linecap='round'/><path d='M35 48H93L98 99Q99 106 92 106H36Q29 106 30 99Z' fill='%2334d399' stroke='%2334d399' stroke-width='2' stroke-linejoin='round'/><path d='M35 48H93L93.7 57H34.3Z' fill='%2310b981'/><circle cx='50' cy='52.5' r='3' fill='%230b1220'/><circle cx='78' cy='52.5' r='3' fill='%230b1220'/><g fill='none' stroke='%230b1220' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'><path d='M53 69L43 80L53 91'/><path d='M75 69L85 80L75 91'/><path d='M68 67L60 93'/></g></g></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#4f46e5;--bg-body:#f8fafc;--text-main:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--font:'Inter',system-ui,sans-serif;--c1:#4c1d95;--c2:#7c3aed;--c3:#db2777;--c4:#2563eb;--ink:#1e1b4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:var(--bg-body);color:var(--text-main);padding-bottom:120px;overflow-x:hidden}
a{text-decoration:none;color:inherit}img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
[hidden]{display:none!important}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-3px) rotate(-3deg)}}

#page-loader{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#page-loader.hidden{opacity:0;visibility:hidden}
.ld{display:grid;justify-items:center;gap:12px;font-weight:900;font-size:20px;color:var(--primary)}
.ld svg{width:84px;height:64px;animation:bob 1.4s ease-in-out infinite}
.ld i{width:140px;height:6px;border-radius:9px;background:#e0e7ff;position:relative;overflow:hidden}
.ld i::after{content:"";position:absolute;inset:0;width:40%;border-radius:9px;background:var(--primary);animation:ldb 1s ease-in-out infinite alternate}
@keyframes ldb{to{transform:translateX(150%)}}

/* HEADER */
.cz-header{position:relative;color:#fff;isolation:isolate;background:linear-gradient(120deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));overflow:hidden;border-radius:0 0 30px 30px;margin-bottom:20px}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.cz-bg{position:absolute;inset:0;overflow:hidden;z-index:-1}
.cz-bg::before{content:"";position:absolute;inset:0;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.3) 2.5px,transparent 2.5px),linear-gradient(90deg,rgba(255,255,255,.3) 2.5px,transparent 2.5px);background-size:34px 34px}
@keyframes grid{to{background-position:34px 34px}}

@keyframes shine{0%,30%{left:-60%}70%,100%{left:130%}}
.blob{position:absolute;border-radius:50%;opacity:.5}
.b1{width:220px;height:220px;background:radial-gradient(circle,#f472b6,transparent 70%);left:-60px;top:-50px}
.b2{width:260px;height:260px;background:radial-gradient(circle,#22d3ee,transparent 70%);right:-80px;top:20px}
.b3{width:180px;height:180px;background:radial-gradient(circle,#fde047,transparent 70%);left:40%;bottom:-70px}
@keyframes m1{50%{transform:translate(90px,60px) scale(1.25)}}
@keyframes m2{50%{transform:translate(-110px,40px) scale(.85)}}
@keyframes m3{50%{transform:translate(-90px,-40px) scale(1.3)}}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:56px;overflow:hidden;pointer-events:none;z-index:3}
.wave svg{position:absolute;left:0;bottom:0;width:200%;height:100%}
.w2{opacity:.5}
@keyframes slide{to{transform:translateX(-50%)}}
.bar{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;z-index:20}
.logo{position:relative;z-index:0;width:38px;height:38px;flex:none}
.logo svg{width:100%;height:100%;display:block;overflow:visible}
.name{font-weight:900;font-size:19px;letter-spacing:-.3px;line-height:1.05;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.shim{background:linear-gradient(90deg,var(--c2),var(--c3),var(--c4),var(--c2));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes sh{to{background-position:-200% 0}}
.brandpill{display:flex;align-items:center;gap:9px;flex:0 1 auto;min-width:0;margin-right:auto;overflow:hidden;padding:4px 18px 4px 4px;border-radius:999px;background:rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(30,27,75,.25);transition:transform .2s}
.brandpill:active{transform:scale(.96)}
@media(max-width:380px){.brandpill{padding-right:12px}.name{font-size:16px}}
.back{position:relative;display:inline-flex;padding:2.5px;border-radius:999px;overflow:hidden;z-index:20;transition:transform .2s}
.back:active{transform:scale(.95)}
.back::before{content:"";position:absolute;left:50%;top:50%;width:300%;aspect-ratio:1;translate:-50% -50%;background:conic-gradient(#fde047,#f472b6,#22d3ee,#4ade80,#fde047)}
.back span{position:relative;display:flex;align-items:center;gap:7px;background:#fff;color:#1f2937;font-weight:800;font-size:14px;padding:8px 16px 8px 10px;border-radius:999px;box-shadow:0 3px 0 rgba(30,27,75,.25)}
.back svg{width:20px;height:20px}
.hero{text-align:center;padding:14px 20px 0;position:relative;z-index:12}
.hero h1{margin:0;font-size:clamp(34px,9.5vw,54px);font-weight:900;letter-spacing:-1.5px;line-height:1;text-shadow:0 4px 0 rgba(30,27,75,.35)}
.hero h1 .shim{background:none;color:#fde047}
.hero p{margin:8px auto 0;max-width:420px;font-size:15.5px;font-weight:500;opacity:.94}

/* maskot (tanpa mata mengikuti kursor & tanpa efek love) */
.stage{position:relative;height:335px;max-width:560px;margin:4px auto 0;z-index:10;display:flex;justify-content:center}
.bubble{position:absolute;top:0;left:50%;translate:-50% 0;width:min(300px,calc(100vw - 48px));min-height:58px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font-weight:800;font-size:14.5px;line-height:1.35;text-align:center;box-shadow:0 4px 0 rgba(30,27,75,.35);display:flex;align-items:center;justify-content:center;z-index:30}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;margin-left:-8px;background:#fff;border:3px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg)}
.caret{display:inline-block;width:2.5px;height:1.05em;margin-left:2px;vertical-align:-3px;border-radius:2px;background:#db2777;animation:cr .9s steps(1) infinite}
@keyframes cr{50%{opacity:0}}
.world{position:absolute;left:50%;bottom:8px;width:200px;height:232px;margin-left:-100px;perspective:800px;perspective-origin:50% 35%}
.plat{position:absolute;left:50%;top:78px;width:200px;height:200px;margin-left:-100px;transform:rotateX(78deg);pointer-events:none}
.plat i{position:absolute;border-radius:50%}
.plat .p1{inset:0;background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,.1) 60%,transparent 71%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.plat .p2{inset:16px;border:3px dashed rgba(255,255,255,.75)}
.shd{position:absolute;left:50%;top:172px;width:120px;height:22px;margin-left:-60px;border-radius:50%;background:radial-gradient(ellipse,rgba(30,27,75,.5),transparent 70%);pointer-events:none}
.m3{position:absolute;left:25px;top:12px;width:150px;height:175px}
.mb{position:absolute;inset:0;cursor:pointer;animation:hop 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hop{50%{transform:translateY(-8px) scale(.985,1.02)}}
.msvg{width:100%;height:100%;overflow:visible;display:block}
.msvg.poke{animation:squish .45s ease}
@keyframes squish{30%{transform:scale(1.14,.8)}60%{transform:scale(.92,1.1)}}
.eb{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.mo-th{transform-box:fill-box;transform-origin:50% 0}
.talk .mo-th{animation:yap .24s ease-in-out infinite alternate}
@keyframes yap{to{transform:scaleY(1.5)}}
.al{transform-origin:44px 164px;animation:armL 2.6s ease-in-out infinite}
.ar{transform-origin:196px 164px;animation:wave 1.6s ease-in-out infinite}
@keyframes armL{50%{transform:rotate(6deg)}}
@keyframes wave{0%,100%{transform:rotate(-45deg)}50%{transform:rotate(-80deg)}}

/* NAV */
.nav{position:fixed;left:12px;right:12px;bottom:16px;background:#fff;border-radius:34px;padding:10px 8px;display:flex;justify-content:space-around;box-shadow:0 10px 30px rgba(76,29,149,.2),inset 0 -3px 0 rgba(30,27,75,.05);z-index:100}
.item{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:11px;color:#94a3b8}
.iw{position:relative;width:42px;height:42px;display:grid;place-items:center}
.iw::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--glow) 0%,transparent 70%);opacity:0;transform:scale(.5);transition:.3s}
.icon{position:relative;width:38px;height:38px;overflow:visible;filter:grayscale(1) opacity(.5);transition:transform .35s cubic-bezier(.34,1.8,.64,1),filter .3s}
.item.active{color:#4f46e5}
.item.active .iw::before{opacity:.55;transform:scale(1.15)}
.item.active .icon{transform:translateY(-4px) scale(1.15);filter:drop-shadow(0 4px 3px rgba(30,27,75,.28))}
.mascot{position:absolute;top:-30px;width:42px;height:32px;overflow:visible;opacity:0;transform:translateY(14px) scale(.7);transition:.35s cubic-bezier(.34,1.8,.64,1);pointer-events:none}
.item.active .mascot{opacity:1;transform:none;animation:bob 1.8s ease-in-out infinite}
.item.active .tw{animation:tw 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{transform:scale(.4) rotate(45deg);opacity:.5}}

/* PROFIL */
.rw{max-width:760px;margin:0 auto;padding:6px 16px 0}
.sh{text-align:center;margin:4px 0 18px}
.sh h2{margin:0;font-size:23px;font-weight:900;letter-spacing:-.5px;color:var(--ink)}
.sh p{margin:6px 0 0;font-size:14px;color:var(--text-muted);font-weight:500}
.box{position:relative;margin-bottom:18px;padding:14px;border:3px solid transparent;border-radius:22px;background:linear-gradient(180deg,#fff 55%,#f4efff) padding-box,linear-gradient(135deg,var(--c2),var(--c3),var(--c4)) border-box;box-shadow:0 5px 0 rgba(30,27,75,.3),0 18px 26px -12px rgba(124,58,237,.45)}
.who{display:flex;gap:14px;align-items:center}
.av{width:76px;height:76px;flex:none;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 2px rgba(124,58,237,.45);background:linear-gradient(135deg,var(--c2),var(--c3));color:#fff;display:grid;place-items:center;font-size:32px;font-weight:900}
.who div{min-width:0}
.who h3{margin:0 0 3px;font-size:19px;font-weight:900;color:var(--ink);word-break:break-word}
.who small{display:block;font-size:12.5px;color:var(--text-muted);font-weight:600;word-break:break-all}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{padding:4px 11px;border-radius:99px;font-size:11px;font-weight:900;border:1.5px solid;white-space:nowrap}
.pill.ok{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
.pill.wait{background:#fffbeb;color:#92400e;border-color:#fde68a}
.pill.no{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.pill.in{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{padding:11px 6px;text-align:center;background:#fff;border:1px solid #e0e7ff;border-radius:18px;box-shadow:0 4px 0 #e0e7ff}
.stat small{display:block;margin-bottom:2px;font-size:11px;font-weight:700;color:var(--text-muted)}
.stat b{font-size:15px;font-weight:900;color:var(--ink);word-break:break-word}
.box h4{margin:0 0 6px;font-size:14px;font-weight:900;color:var(--ink)}
.rows div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px}
.rows div:last-child{border-bottom:0}
.rows span{color:var(--text-muted);font-weight:600;flex:none}.rows b{text-align:right;word-break:break-all}
.acts{display:grid;gap:10px;margin-bottom:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:800;font-size:14px;width:100%;text-align:center;transition:.2s}
.btn:active{transform:translateY(3px)}
.btn-primary{background:linear-gradient(120deg,var(--c2),var(--c3));color:#fff;box-shadow:0 4px 0 rgba(30,27,75,.35)}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid #e0e7ff;box-shadow:0 4px 0 #e0e7ff}
.btn-out{background:#fff;color:#991b1b;border:1.5px solid #fecaca;box-shadow:0 4px 0 #fecaca}
.empty{text-align:center;padding:36px 20px;color:var(--text-muted);font-weight:700}
.empty svg{width:90px;height:68px;display:block;margin:0 auto 10px}
.empty .btn{max-width:260px;margin:14px auto 0}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:rot 1s linear infinite;margin:40px auto}
.toast{position:fixed;left:50%;bottom:98px;translate:-50% 0;max-width:90vw;text-align:center;background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:11px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(30,27,75,.35);z-index:1100}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

  <defs>

    <linearGradient id="gViolet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>

  </defs>
  <symbol id="spark" viewBox="0 0 10 10"><path d="M5 0.3 6.2 3.8 9.7 5 6.2 6.2 5 9.7 3.8 6.2 0.3 5 3.8 3.8z" fill="#fff" stroke="#1e1b4b" stroke-width=".9" stroke-linejoin="round"/></symbol>

    <path d="M7.5 13.5Q8 11 10 11H34Q36 11 36.5 13.5L37 17H7Z" fill="#E85D04"/>
    <ellipse cx="16" cy="24" rx="3.4" ry="4" fill="#fff"/><ellipse cx="28" cy="24" rx="3.4" ry="4" fill="#fff"/>
    <circle cx="16.4" cy="24.8" r="1.9" fill="#2b1a3a"/><circle cx="28.4" cy="24.8" r="1.9" fill="#2b1a3a"/>
    <circle cx="17" cy="23.6" r=".7" fill="#fff"/><circle cx="29" cy="23.6" r=".7" fill="#fff"/>
    <path d="M19.5 29q2.5 2.4 5 0" stroke="#5a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>

</svg>

<header class="cz-header">
  <div class="cz-bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
  <div class="bar">
    <a class="brandpill" href="index.html" aria-label="Cazo Market — ke beranda">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <rect x="4" y="9" width="56" height="56" rx="18" fill="#1e1b4b"/>
          <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#lgBg)" stroke="#1e1b4b" stroke-width="3"/>
          <path d="M22 24v-3a10 10 0 0 1 20 0v3" fill="none" stroke="#1e1b4b" stroke-width="3.6" stroke-linecap="round"/>
          <path d="M14 25h36l-3 28a4 4 0 0 1-4 3.5H21a4 4 0 0 1-4-3.5z" fill="url(#lgBag)" stroke="#1e1b4b" stroke-width="3" stroke-linejoin="round"/>
          <path d="M27 35l-6 6 6 6M37 35l6 6-6 6M34 33l-4 16" fill="none" stroke="url(#lgCode)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="name">Cazo <span class="shim">Market</span></div>
    </a>
    <a class="back" href="index.html" aria-label="Kembali ke beranda"><span><svg><use href="#i-left"/></svg>Kembali</span></a>
  </div>

  <div class="hero">
    <h1>Profil <span class="shim">Akun</span></h1>
    <p>Data akun, peran, dan aktivitas belanjamu di Cazo Market.</p>
  </div>

  <div class="stage">
    <div class="bubble" id="bubble" aria-live="polite"><span id="typed"></span><i class="caret"></i></div>
    <div class="world">
      <div class="plat"><i class="p1"></i><i class="p2"></i></div>
      <div class="shd"></div>
      <div class="m3">
        <div class="mb" id="mb" role="button" tabindex="0" aria-label="Colek maskot Cazo">

<!-- MASKOT: hanya teks ketik + colek (tanpa mata mengikuti kursor, tanpa love) -->
<script>
(()=>{
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const typed=document.getElementById('typed'),mb=document.getElementById('mb'),svg=document.getElementById('msvg');
let tm,busy=0,i0=0,pi=0;
const MSG=['Halo! Ini data akunmu di Cazo Market.','Data di halaman ini diambil langsung dari akunmu.','Cek riwayat pesananmu lewat tombol di bawah ya.'];
const POKES=['Eh, kaget! Jangan colek-colek~','Hai hai! Ada yang bisa dibantu?','Datamu aman, kok.'];
function say(t){
  clearInterval(tm);
  if(reduce){typed.textContent=t;return}
  typed.textContent='';let i=0;mb.classList.add('talk');
  tm=setInterval(()=>{typed.textContent=t.slice(0,++i);if(i>=t.length){clearInterval(tm);mb.classList.remove('talk')}},30);
}
window.mascotSay=say;
setTimeout(()=>say(MSG[0]),500);i0=1;
setInterval(()=>{if(performance.now()<busy)return;say(MSG[i0++%MSG.length])},7200);
function poke(){
  busy=performance.now()+4800;
  svg.classList.remove('poke');void svg.offsetWidth;svg.classList.add('poke');
  say(POKES[pi++%POKES.length]);
}
mb.addEventListener('click',poke);
mb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();poke()}});
svg.addEventListener('animationend',e=>{if(e.animationName==='squish')svg.classList.remove('poke')});
})();
</script>

<!-- DATA PROFIL (Firebase: Auth + Realtime Database, sumber sama dengan Admin Panel) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8", authDomain: "mybro-9ba5f.firebaseapp.com", databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com", projectId: "mybro-9ba5f", storageBucket: "mybro-9ba5f.firebasestorage.app", messagingSenderId: "820948893264", appId: "1:820948893264:web:e564509a8fdc4c56335b55" };
const app = initializeApp(firebaseConfig), db = getDatabase(app), auth = getAuth(app), provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rupiah = n => "Rp" + Number(n || 0).toLocaleString("id-ID");
const fmt = t => { const d = new Date(t); return t && !isNaN(d) ? d.toLocaleString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : ""; };
const PROV = { "google.com": "Google", "password": "Email & Kata Sandi", "phone": "Nomor Telepon", "facebook.com": "Facebook", "github.com": "GitHub" };
const DONE = ["paid", "verified", "success", "confirmed", "completed", "done", "delivered"];
const SHOP = { approved: ["Aktif", "ok"], pending: ["Menunggu Persetujuan", "wait"], rejected: ["Ditolak", "no"], suspended: ["Disuspend", "no"] };

const toast = m => { document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); };
const hide = () => $("page-loader").classList.add("hidden");
setTimeout(hide, 6000);

/* ambil data; kalau ditolak aturan database / gagal, kembalikan null (tidak menampilkan apa pun) */
const safe = async fn => { try { return await fn(); } catch (e) { console.warn(e); return null; } };
const byChild = async (path, child, val) => (await get(query(ref(db, path), orderByChild(child), equalTo(val)))).val() || {};

window.login = async () => {
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/web-storage-unsupported"].includes(e.code)) return signInWithRedirect(auth, provider);
    if (!["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(e.code)) toast("Gagal masuk: " + e.message);
  }
};
window.logout = async () => { try { await signOut(auth); toast("Kamu sudah keluar"); } catch (e) { toast("Gagal keluar: " + e.message); } };
window.copyId = id => navigator.clipboard.writeText(id).then(() => toast("ID disalin"), () => toast("Gagal menyalin"));

const row = (a, b) => b ? `<div><span>${a}</span><b>${esc(b)}</b></div>` : "";

function loggedOut() {
  $("view").innerHTML = `<div class="empty"><svg><use href="#mascot"/></svg><p>Masuk dulu untuk melihat profilmu.</p><button class="btn btn-primary" onclick="login()">Masuk dengan Google</button></div>`;
  hide();
}

async function show(u) {
  paint(u, {}, false, null, null, null); hide();
  const r = await Promise.all([
    safe(async () => (await get(ref(db, `users/${u.uid}`))).val()),
    safe(async () => (await get(ref(db, `admins/${u.uid}`))).val() === true),
    safe(() => byChild("orders", "buyerId", u.uid)),
    safe(() => byChild("shops", "ownerId", u.uid)),
    safe(() => byChild("sellerApplications", "userId", u.uid))
  ]);
  paint(u, r[0] || {}, r[1], r[2], r[3], r[4]);
}

function paint(u, rec, adm, ords, shops, apps) {
  rec = rec && typeof rec === "object" ? rec : {};
  const name = u.displayName || rec.displayName || rec.name || "";
  const email = u.email || rec.email || "";
  const phone = u.phoneNumber || rec.phone || rec.phoneNumber || "";
  const prov = (u.providerData || []).map(p => PROV[p.providerId] || p.providerId).join(", ");
  const photo = u.photoURL || rec.photoURL || rec.photo || "";
  const initial = (name || email || "?").trim().charAt(0).toUpperCase();
  const shopList = Object.entries(shops || {}), appList = Object.entries(apps || {}).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

  const tags = [];
  if (adm) tags.push('<span class="pill in">Admin</span>');
  if (shopList.length) tags.push('<span class="pill ok">Penjual</span>');
  if (u.emailVerified) tags.push('<span class="pill ok">Email terverifikasi</span>');

  let stats = "";
  if (ords) {
    const all = Object.values(ords), done = all.filter(o => [o.paymentStatus, o.orderStatus].some(x => DONE.includes(x)));
    const sum = done.reduce((a, o) => a + (Number(o.priceSnapshot) || 0), 0);
    stats = `<div class="stats">${[["Pesanan", all.length], ["Selesai", done.length], ["Total Belanja", rupiah(sum)]].map(([a, b]) => `<div class="stat"><small>${a}</small><b>${b}</b></div>`).join("")}</div>`;
  }

  const acct = [
    row("Nama akun", name), row("Email", email), row("Nomor telepon", phone), row("Masuk dengan", prov),
    row("Terdaftar", fmt(u.metadata && u.metadata.creationTime)), row("Terakhir masuk", fmt(u.metadata && u.metadata.lastSignInTime))
  ].join("") + `<div><span>ID Akun</span><b><a href="#" onclick="copyId('${esc(u.uid)}');return false" style="color:var(--primary)">${esc(u.uid.slice(0, 8))}… (salin)</a></b></div>`;

  let shopBox = "";
  if (shopList.length) {
    shopBox = `<div class="box"><h4>Toko Saya</h4><div class="rows">${shopList.map(([id, s]) => {
      const st = SHOP[s.status || s.verificationStatus] || [s.status || "-", "in"];
      return `<div><span>${esc(s.name || "Toko")}</span><b><span class="pill ${st[1]}">${st[0]}</span></b></div>` +
        row("Rating", s.ratingCount ? `${Number(s.ratingAverage || 0).toFixed(1)} (${s.ratingCount} ulasan)` : "") +
        row("Transaksi", s.transactionCount ? String(s.transactionCount) : "");
    }).join("")}</div></div>`;
  } else if (appList.length) {
    const [, a] = appList[0], st = SHOP[a.status] || [a.status || "-", "in"];
    shopBox = `<div class="box"><h4>Pengajuan Toko</h4><div class="rows"><div><span>${esc(a.shopName || "Toko")}</span><b><span class="pill ${st[1]}">${st[0]}</span></b></div>${a.status === "rejected" ? row("Alasan", a.rejectionReason) : ""}</div></div>`;
  }

  $("view").innerHTML = `
    <div class="box"><div class="who">
      ${photo ? `<img class="av" src="${esc(photo)}" alt="" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;av&quot;>${esc(initial)}</div>'">` : `<div class="av">${esc(initial)}</div>`}
      <div><h3>${esc(name || email || "Akun")}</h3>${email ? `<small>${esc(email)}</small>` : ""}<div class="tags">${tags.join("")}</div></div>
    </div></div>
    ${stats}
    <div class="box"><h4>Informasi Akun</h4><div class="rows">${acct}</div></div>
    ${shopBox}
    <div class="acts">
      <a class="btn btn-primary" href="riwayat.html">Riwayat Pesanan</a>
      <a class="btn btn-outline" href="katalog.html">Belanja di Katalog</a>
      ${adm ? '<a class="btn btn-outline" href="admin.html">Buka Panel Admin</a>' : ""}
      <button class="btn btn-out" onclick="logout()">Keluar</button>
    </div>`;
  if (!window._g && window.mascotSay) { window._g = 1; window.mascotSay("Halo, " + (name.split(" ")[0] || "kamu") + "! Ini data akunmu."); }
}

onAuthStateChanged(auth, u => { u ? show(u) : loggedOut(); });
</script>
