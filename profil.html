<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil — Cazo Market</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><rect x='4' y='4' width='120' height='120' rx='30' fill='%230b1220'/><circle cx='64' cy='70' r='50' fill='%234f46e5' opacity='.28'/><g transform='rotate(-5 64 66)'><path d='M48 52V42Q48 26 64 26Q80 26 80 42V52' fill='none' stroke='%23a5b4fc' stroke-width='6' stroke-linecap='round'/><path d='M35 48H93L98 99Q99 106 92 106H36Q29 106 30 99Z' fill='%2334d399' stroke='%2334d399' stroke-width='2' stroke-linejoin='round'/><path d='M35 48H93L93.7 57H34.3Z' fill='%2310b981'/><circle cx='50' cy='52.5' r='3' fill='%230b1220'/><circle cx='78' cy='52.5' r='3' fill='%230b1220'/><g fill='none' stroke='%230b1220' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'><path d='M53 69L43 80L53 91'/><path d='M75 69L85 80L75 91'/><path d='M68 67L60 93'/></g></g><path transform='translate(99 33) scale(.8)' fill='%23ffe14d' d='M0-12L3.5-3.5L12 0L3.5 3.5L0 12L-3.5 3.5L-12 0L-3.5-3.5Z'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#4f46e5;--bg-body:#f8fafc;--text-main:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--font:'Inter',system-ui,sans-serif;--c1:#4c1d95;--c2:#7c3aed;--c3:#db2777;--c4:#2563eb;--ink:#1e1b4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg-body);color:var(--text-main);padding-bottom:120px;overflow-x:hidden}
a{text-decoration:none;color:inherit}img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
[hidden]{display:none!important}
@keyframes rot{to{transform:rotate(360deg)}}

/* ===== LOADER (dari detail.html) ===== */
#page-loader{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#page-loader.hidden{opacity:0;visibility:hidden}
.ld{display:grid;justify-items:center;gap:12px;font-weight:900;font-size:20px;color:var(--primary)}
.ld svg{width:84px;height:64px;animation:bob 1.4s ease-in-out infinite}
.ld i{width:140px;height:6px;border-radius:9px;background:#e0e7ff;position:relative;overflow:hidden}
.ld i::after{content:"";position:absolute;inset:0;width:40%;border-radius:9px;background:var(--primary);animation:ldb 1s ease-in-out infinite alternate}
@keyframes ldb{to{transform:translateX(150%)}}

/* ===== HEADER (dari kontak.html) ===== */
.cz-header{position:relative;color:#fff;isolation:isolate;background:linear-gradient(120deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));background-size:300% 300%;animation:flow 14s ease-in-out infinite;overflow:hidden;border-radius:0 0 30px 30px;margin-bottom:20px}
.cz-bg{position:absolute;inset:0;overflow:hidden;z-index:-1}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.cz-bg::before{content:"";position:absolute;inset:0;opacity:.6;background-image:linear-gradient(rgba(255,255,255,.3) 2.5px,transparent 2.5px),linear-gradient(90deg,rgba(255,255,255,.3) 2.5px,transparent 2.5px);background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);animation:grid 6s linear infinite}
@keyframes grid{to{background-position:34px 34px}}
.cz-bg::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,30%{left:-60%}70%,100%{left:130%}}
.blob{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;mix-blend-mode:screen}
.b1{width:220px;height:220px;background:#f472b6;left:-60px;top:-50px;animation:m1 11s ease-in-out infinite}
.b2{width:260px;height:260px;background:#22d3ee;right:-80px;top:20px;animation:m2 13s ease-in-out infinite}
.b3{width:180px;height:180px;background:#fde047;left:40%;bottom:-70px;animation:m3 9s ease-in-out infinite}
@keyframes m1{50%{transform:translate(90px,60px) scale(1.25)}}
@keyframes m2{50%{transform:translate(-110px,40px) scale(.85)}}
@keyframes m3{50%{transform:translate(-90px,-40px) scale(1.3)}}
.fl{position:absolute;bottom:-30px;left:var(--x);font-weight:800;font-size:var(--s);color:rgba(255,255,255,.55);text-shadow:0 2px 10px rgba(30,27,75,.35);animation:rise var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}85%{opacity:.8}100%{transform:translateY(-440px) rotate(var(--r));opacity:0}}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:56px;overflow:hidden;pointer-events:none;z-index:3}
.wave svg{position:absolute;left:0;bottom:0;width:200%;height:100%}
.w1{animation:slide 12s linear infinite}.w2{animation:slide 8s linear infinite reverse;opacity:.5}
@keyframes slide{to{transform:translateX(-50%)}}
.bar{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;z-index:20}
.logo{position:relative;z-index:0;width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 2px rgba(30,27,75,.3))}
.logo::before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:18px;background:conic-gradient(#fde047,#f472b6,#22d3ee,#4ade80,#fde047);filter:blur(7px);opacity:.45;animation:rot 4s linear infinite}
.logo svg{width:100%;height:100%;display:block;overflow:visible}
.lshine{animation:ls 3.4s ease-in-out infinite}
@keyframes ls{0%,55%{transform:translateX(0)}100%{transform:translateX(110px)}}
.name{font-weight:900;font-size:19px;letter-spacing:-.3px;line-height:1.05;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.shim{background:linear-gradient(90deg,var(--c2),var(--c3),var(--c4),var(--c2));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.brandpill{display:flex;align-items:center;gap:9px;flex:0 1 auto;min-width:0;margin-right:auto;overflow:hidden;padding:4px 18px 4px 4px;border-radius:999px;background:rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(30,27,75,.25);transition:transform .2s}
.brandpill:active{transform:scale(.96)}
@media(max-width:380px){.brandpill{padding-right:12px}.name{font-size:16px}}
.back{position:relative;display:inline-flex;padding:2.5px;border-radius:999px;overflow:hidden;z-index:20;transition:transform .2s}
.back:active{transform:scale(.95)}
.back::before{content:"";position:absolute;left:50%;top:50%;width:300%;aspect-ratio:1;translate:-50% -50%;background:conic-gradient(#fde047,#f472b6,#22d3ee,#4ade80,#fde047);animation:rot 3s linear infinite}
.back span{position:relative;display:flex;align-items:center;gap:7px;background:#fff;color:#1f2937;font-weight:800;font-size:14px;padding:8px 16px 8px 10px;border-radius:999px;box-shadow:0 3px 0 rgba(30,27,75,.25)}
.back svg{width:20px;height:20px;transition:transform .25s}.back:hover svg{transform:translateX(-3px)}
.hero{text-align:center;padding:14px 20px 0;position:relative;z-index:12}
.hero h1{margin:0;font-size:clamp(34px,9.5vw,54px);font-weight:900;letter-spacing:-1.5px;line-height:1;text-shadow:0 4px 0 rgba(30,27,75,.35)}
.hero h1 .shim{background:linear-gradient(90deg,#fde047,#f9a8d4,#a5f3fc,#fde047);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(30,27,75,.45))}
.hero p{margin:8px auto 0;max-width:420px;font-size:15.5px;font-weight:500;opacity:.94}

/* ===== MASKOT 3D (dari kontak.html) ===== */
.stage{position:relative;height:350px;max-width:560px;margin:4px auto 0;z-index:10;display:flex;justify-content:center}
.bubble{position:absolute;top:0;left:50%;translate:-50% 0;width:min(300px,calc(100vw - 48px));min-height:58px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font-weight:800;font-size:14.5px;line-height:1.35;text-align:center;box-shadow:0 4px 0 rgba(30,27,75,.35);display:flex;align-items:center;justify-content:center;z-index:30;transform-origin:50% 100%}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;margin-left:-8px;background:#fff;border:3px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg)}
.bubble.pop{animation:bpop .5s cubic-bezier(.34,1.6,.64,1)}
@keyframes bpop{0%{transform:scale(.8) rotate(-2deg);opacity:0}60%{opacity:1}100%{transform:none}}
.caret{display:inline-block;width:2.5px;height:1.05em;margin-left:2px;vertical-align:-3px;border-radius:2px;background:#db2777;animation:cr .9s steps(1) infinite}
@keyframes cr{50%{opacity:0}}
.world{position:absolute;left:50%;bottom:8px;width:240px;height:262px;margin-left:-120px;perspective:900px;perspective-origin:50% 35%;transform:scale(var(--ws,1));transform-origin:50% 100%;touch-action:manipulation}
.scene{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.fg{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 92%;will-change:transform}
.plat{position:absolute;left:50%;top:125px;width:230px;height:230px;margin-left:-115px;transform:rotateX(78deg);pointer-events:none}
.plat i{position:absolute;border-radius:50%}
.plat .p1{inset:0;background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,.1) 60%,transparent 71%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.plat .p2{inset:16px;border:3px dashed rgba(255,255,255,.75);animation:rot 22s linear infinite}
.plat .p3{inset:44px;border:3px solid #fde047;border-top-color:transparent;border-bottom-color:transparent;animation:rot 9s linear infinite reverse;filter:drop-shadow(0 0 6px rgba(253,224,71,.9))}
.shd{position:absolute;left:50%;top:236px;width:150px;height:26px;margin-left:-75px;border-radius:50%;background:rgba(30,27,75,.5);filter:blur(7px);pointer-events:none}
.bag{position:absolute;left:45px;top:70px;width:150px;height:162px;transform-style:preserve-3d;cursor:pointer}
.sl{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.hdl{position:absolute;left:67px;top:12px;width:106px;height:70px;transform-style:preserve-3d;pointer-events:none}
.prop{position:absolute;transform-style:preserve-3d;pointer-events:none}
.apple{left:88px;top:44px;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#ff9aae,#ff4d6d 50%,#b3173a);transform:translateZ(-4px);animation:peek 2.6s ease-in-out infinite}
.apple::before{content:"";position:absolute;left:15px;top:-12px;width:4px;height:13px;border-radius:3px;background:#2ec27e;transform:rotate(14deg)}
.apple::after{content:"";position:absolute;left:19px;top:-10px;width:15px;height:8px;border-radius:50%;background:#2ec27e;transform:rotate(-22deg)}
.book{left:126px;top:40px;width:30px;height:38px;transform:translateZ(-5px) rotate(12deg);animation:peek 2.6s ease-in-out -1.3s infinite}
@keyframes peek{50%{margin-top:-4px}}
.arm{position:absolute;top:128px;width:20px;height:62px;margin-left:-10px;transform-origin:50% 9px;will-change:transform}
.arm.l{left:44px}.arm.r{left:196px}
.arm .lm{position:absolute;inset:0;border-radius:10px;background:linear-gradient(90deg,#b8420c,#ff8a2b 42%,#e0560a)}
.hand{position:absolute;left:50%;bottom:-12px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff6c4,#ffd166 52%,#e0a000)}
.foot{position:absolute;top:224px;width:46px;height:24px;border-radius:50%;background:radial-gradient(ellipse at 40% 25%,#ff8a2b,#e85d04 60%,#a83a00);transform:translateZ(14px)}
.foot.l{left:66px}.foot.r{left:128px}
.face{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;transform:translateZ(38px)}
.front{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;transform:translateZ(35.5px)}
.face .v{display:none}
.face .pup{transform:translate(var(--px,0px),var(--py,0px));transition:transform .12s ease-out}
.face .eb{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.face .brow{fill:none;stroke:#8a3200;stroke-width:5;stroke-linecap:round;transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.34,1.5,.64,1)}
.face .cheek{fill:#ff5e7e;opacity:.78;transition:opacity .3s}
.face[data-mood=happy] .cheek,.face[data-mood=excited] .cheek{opacity:1}
.face[data-mood=idle] .e-open,.face[data-mood=idle] .mo-smile,
.face[data-mood=happy] .e-happy,.face[data-mood=happy] .mo-grin,
.face[data-mood=wink] .e-wink,.face[data-mood=wink] .mo-tongue,
.face[data-mood=surprised] .e-wide,.face[data-mood=surprised] .mo-o,
.face[data-mood=sleepy] .e-sleep,.face[data-mood=sleepy] .mo-flat,.face[data-mood=sleepy] .zzz,
.face[data-mood=excited] .e-happy,.face[data-mood=excited] .mo-big,.face[data-mood=excited] .stars,
.face[data-mood=thinking] .e-open,.face[data-mood=thinking] .mo-think,.face[data-mood=thinking] .think,
.face[data-mood=cool] .e-shades,.face[data-mood=cool] .mo-smirk{display:inline}
.face[data-mood=surprised] .brow{transform:translateY(-9px)}
.face[data-mood=happy] .brow,.face[data-mood=excited] .brow{transform:translateY(-4px)}
.face[data-mood=sleepy] .brow{transform:translateY(5px)}
.face[data-mood=thinking] .brow.bl{transform:translateY(-8px) rotate(-6deg)}
.face[data-mood=thinking] .brow.br{transform:translateY(2px)}
.face[data-mood=cool] .brow{transform:translateY(-6px)}
.face .mouthg{transform-box:fill-box;transform-origin:50% 0}
.face.talk .mouthg{animation:yap .24s ease-in-out infinite alternate}
@keyframes yap{to{transform:scaleY(1.4)}}
.face .zz{font:900 20px 'Baloo 2',sans-serif;fill:#fff;stroke:#1e1b4b;stroke-width:3;paint-order:stroke;animation:zup 2.4s ease-in infinite}
.face .zz:nth-child(2){animation-delay:.8s}.face .zz:nth-child(3){animation-delay:1.6s}
@keyframes zup{0%{transform:translate(0,12px) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(14px,-26px) scale(1.2);opacity:0}}
.face .tw{transform-box:fill-box;transform-origin:center;animation:twk .7s ease-in-out infinite alternate}
.face .tw:nth-child(2){animation-delay:.25s}.face .tw:nth-child(3){animation-delay:.5s}
@keyframes twk{from{transform:scale(.4) rotate(0);opacity:.5}to{transform:scale(1.2) rotate(45deg);opacity:1}}
.face .dot{animation:dotp 1.4s ease-in-out infinite}
.face .dot:nth-child(2){animation-delay:.2s}.face .dot:nth-child(3){animation-delay:.4s}
@keyframes dotp{50%{transform:translateY(-3px)}}
.glint{animation:glt 3.2s ease-in-out infinite}
@keyframes glt{0%,60%{transform:translateX(-30px)}100%{transform:translateX(60px)}}
.orb{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:grid;place-items:center;color:#fff;border:2.5px solid #fff;box-shadow:0 5px 0 rgba(30,27,75,.35),inset 0 2px 0 rgba(255,255,255,.5),0 10px 18px -4px rgba(0,0,0,.35);will-change:transform;z-index:5}
.orb svg{width:24px;height:24px}
.orb.wa{background:linear-gradient(135deg,#4ade80,#16a34a)}
.orb.mail{background:linear-gradient(135deg,#60a5fa,#4f46e5)}
.orb.tt{background:linear-gradient(135deg,#334155,#020617)}
.orb:hover{filter:brightness(1.15)}
.sp{position:absolute;color:#fff;font-size:var(--s);text-shadow:0 0 10px rgba(255,255,255,.9);animation:twinkle 2.6s ease-in-out infinite;animation-delay:var(--dl);pointer-events:none}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(30deg)}}
@media(max-width:360px){.stage{height:330px}}

/* ===== NAV BAWAH (dari index.html) ===== */
.nav{position:fixed;left:12px;right:12px;bottom:16px;background:#fff;border-radius:34px;padding:10px 8px;display:flex;justify-content:space-around;box-shadow:0 10px 30px rgba(76,29,149,.2),inset 0 -3px 0 rgba(30,27,75,.05);z-index:100}
.item{position:relative;flex:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:11px;color:#94a3b8;padding:0;text-decoration:none;outline:none}
.iw{position:relative;width:42px;height:42px;display:grid;place-items:center}
.iw::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--glow) 0%,transparent 70%);opacity:0;transform:scale(.5);transition:.3s}
.icon{position:relative;width:38px;height:38px;overflow:visible;filter:grayscale(1) opacity(.5);transition:transform .35s cubic-bezier(.34,1.8,.64,1),filter .3s}
.item.active{color:#4f46e5}
.item.active .iw::before{opacity:.55;transform:scale(1.15)}
.item.active .icon{transform:translateY(-4px) scale(1.15);filter:drop-shadow(0 4px 3px rgba(30,27,75,.28))}
.mascot{position:absolute;top:-30px;width:42px;height:32px;overflow:visible;opacity:0;transform:translateY(14px) scale(.7);transition:.35s cubic-bezier(.34,1.8,.64,1);pointer-events:none}
.item.active .mascot{opacity:1;transform:none;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-3deg)}}
.item.active .tw{animation:tw 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{transform:scale(.4) rotate(45deg);opacity:.5}}

/* ===== HALAMAN RIWAYAT ===== */
.rw{max-width:760px;margin:0 auto;padding:6px 16px 0}
.sh{text-align:center;margin:4px 0 18px}
.sh h2{margin:0;font-size:23px;font-weight:900;letter-spacing:-.5px;color:var(--ink)}
.sh p{margin:6px 0 0;font-size:14px;color:var(--text-muted);font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:10px;margin-bottom:14px}
.stat{padding:11px 6px;text-align:center;background:#fff;border:1px solid #e0e7ff;border-radius:18px;box-shadow:0 4px 0 #e0e7ff}
.stat small{display:block;margin-bottom:2px;font-size:11px;font-weight:700;color:var(--text-muted)}
.stat b{font-size:14px;font-weight:900;color:var(--ink);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.chips button{flex:none;padding:8px 15px;border-radius:99px;background:#fff;border:1.5px solid #e0e7ff;box-shadow:0 3px 0 #e0e7ff;font-weight:800;font-size:12.5px;color:var(--ink)}
.chips button.on{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--c2),var(--c3));box-shadow:0 3px 0 rgba(30,27,75,.3)}
.chips em{font-style:normal;opacity:.7;margin-left:5px}
.oc{position:relative;margin-bottom:18px;padding:12px;border:3px solid transparent;border-radius:22px;background:linear-gradient(180deg,#fff 55%,#f4efff) padding-box,linear-gradient(135deg,var(--c2),var(--c3),var(--c4)) border-box;box-shadow:0 5px 0 rgba(30,27,75,.3),0 18px 26px -12px rgba(124,58,237,.45);animation:cin .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i,0)*60ms)}
@keyframes cin{from{opacity:0;transform:translateY(22px) scale(.94)}}
.oh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:11.5px;font-weight:700;color:var(--text-muted)}
.pill{padding:4px 11px;border-radius:99px;font-size:11px;font-weight:900;border:1.5px solid;box-shadow:0 2px 0 rgba(30,27,75,.15);white-space:nowrap}
.pill.ok{background:#f0fdf4;color:#166534;border-color:#bbf7d0}
.pill.wait{background:#fffbeb;color:#92400e;border-color:#fde68a}
.pill.no{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.om{display:flex;gap:12px;align-items:center}
.om img{width:76px;height:76px;flex:none;object-fit:cover;border-radius:16px;border:2.5px solid #fff;background:#ede9fe;box-shadow:0 0 0 1.5px rgba(124,58,237,.45)}
.om div{min-width:0}
.om h3{margin:0 0 3px;font-size:14.5px;font-weight:800;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.om small{display:block;font-size:11.5px;color:var(--text-muted);font-weight:600;word-break:break-all}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:800;font-size:14px;width:100%;transition:.2s;text-align:center}

.btn-primary{background:linear-gradient(120deg,var(--c2),var(--c3));color:#fff;box-shadow:0 4px 0 rgba(30,27,75,.35)}

<!-- MASKOT 3D (dari kontak.html): badan bertumpuk, ekspresi, mata mengikuti kursor, orbit, colek -->
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const mix=(c1,c2,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),a=p(c1),b=p(c2);return '#'+a.map((v,i)=>Math.round(lerp(v,b[i],t)).toString(16).padStart(2,'0')).join('')};
const bag=$('#bag'),hdl=$('#hdl'),face=$('#face'),scene=$('#scene'),fgEl=$('#fg'),armL=$('#armL'),armR=$('#armR'),shd=$('#shd'),sheen=$('#sheen'),world=$('#world');
(function(){
  const N=21,D=70;let h='';
  for(let i=0;i<N;i++){const t=i/(N-1),z=-D/2+t*(D-3);h+='<svg class="sl" viewBox="0 0 150 162" style="transform:translateZ('+z.toFixed(1)+'px);color:'+mix('#8f3300','#f26a10',Math.pow(t,.8))+'"><use href="#bagPath" fill="currentColor"/></svg>'}
  bag.insertAdjacentHTML('afterbegin',h);
  let hh='';
  for(let i=0;i<7;i++){const t=i/6,z=-9+t*18;hh+='<svg class="sl" viewBox="0 0 106 70" style="transform:translateZ('+z.toFixed(1)+'px);color:'+mix('#a87408','#ffd166',t)+'"><path d="M8 70C4 4 102 4 98 70" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"/></svg>'}
  hdl.innerHTML=hh;
  bag.setAttribute('role','button');bag.setAttribute('tabindex','0');bag.setAttribute('aria-label','Colek maskot Cazo');
})();
function fit(){world.style.setProperty('--ws',clamp((innerWidth-16)/272,.72,1).toFixed(3))}
fit();addEventListener('resize',fit);

const typed=$('#typed'),bubble=$('#bubble');
let typeTimer=null,mood='idle',busyUntil=0,backT=null;
function say(text){
  clearInterval(typeTimer);
  bubble.classList.remove('pop');void bubble.offsetWidth;bubble.classList.add('pop');
  if(reduce){typed.textContent=text;return}
  typed.textContent='';let i=0;face.classList.add('talk');
  typeTimer=setInterval(()=>{typed.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(typeTimer);face.classList.remove('talk')}},30);
}
function setMood(m){if(m===mood)return;mood=m;face.dataset.mood=m}
function hold(m,text,ms){busyUntil=performance.now()+(ms||4200);setMood(m);if(text)say(text);clearTimeout(backT);backT=setTimeout(()=>setMood('idle'),ms||4200)}
const IDLE=[
  ['happy','Halo! Ini halaman profilmu ♥'],
  ['wink','Datamu diambil dari akun Google-mu, apa adanya.'],
  ['thinking','Mau ganti nama akun? Ada di menu bawah!'],
  ['cool','Ringkasan belanjamu ada di bagian statistik.'],
  ['surprised','Eh! Jangan bagikan ID akunmu sembarangan ya!'],
  ['sleepy','Zzz... colek aku dong, aku bosan nih!']
];
let idleI=0;
setTimeout(()=>{const q=IDLE[idleI++];setMood(q[0]);say(q[1])},500);
setInterval(()=>{if(performance.now()<busyUntil)return;const q=IDLE[idleI++%IDLE.length];setMood(q[0]);say(q[1])},7200);

function burst(x,y,n,glyphs){
  if(reduce)return;
  const cols=['#fde047','#f472b6','#22d3ee','#4ade80','#fb923c','#a78bfa'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='cf';
    s.textContent=glyphs[i%glyphs.length];s.style.color=cols[(Math.random()*cols.length)|0];
    s.style.fontSize=(12+Math.random()*14)+'px';s.style.left=x+'px';s.style.top=y+'px';
    document.body.appendChild(s);
    const a=Math.random()*Math.PI*2,v=60+Math.random()*110,dx=Math.cos(a)*v,dy=Math.sin(a)*v-50;
    s.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},
      {transform:'translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px)) rotate('+Math.random()*360+'deg) scale(1)',opacity:1,offset:.55},
      {transform:'translate(calc(-50% + '+dx*1.15+'px),calc(-50% + '+(dy+90)+'px)) rotate('+Math.random()*540+'deg) scale(.6)',opacity:0}],
      {duration:900+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();
  }
}

const POSE={
  idle:{L:12,R:-12,bob:5,sp:1.6,wave:0},happy:{L:14,R:-148,bob:7,sp:2,wave:16},
  wink:{L:12,R:-140,bob:6,sp:1.8,wave:12},surprised:{L:125,R:-125,bob:4,sp:3,wave:5},
  sleepy:{L:5,R:-5,bob:2.5,sp:.8,wave:0},excited:{L:140,R:-140,bob:6,sp:5,wave:22},
  thinking:{L:10,R:-118,bob:4,sp:1.2,wave:3},cool:{L:16,R:-16,bob:5,sp:1.4,wave:0}
};
const S={rx:{x:0,v:0},ry:{x:0,v:0},pk:{x:0,v:0},sp:{x:0,v:0,tg:0},aL:12,aR:-12,gx:0,gy:0,hov:0};
const spring=(s,tg,k,d,dt)=>{s.v+=(-k*(s.x-tg)-d*s.v)*dt;s.x+=s.v*dt};
const ptr={cx:innerWidth/2,cy:innerHeight/2,t:-1e9};
addEventListener('pointermove',e=>{ptr.cx=e.clientX;ptr.cy=e.clientY;ptr.t=performance.now()},{passive:true});
const orbs=[$('#orbWa'),$('#orbMl'),$('#orbTk')];
orbs.forEach(o=>{o.addEventListener('pointerenter',()=>S.hov=1);o.addEventListener('pointerleave',()=>S.hov=0)});
let inView=true,last=performance.now(),orbA=0,lastGX=999,lastGY=999;
new IntersectionObserver(es=>{inView=es[0].isIntersecting},{threshold:0}).observe($('#stage'));

function frame(now){
  requestAnimationFrame(frame);
  if(!inView)return;
  const dt=Math.min(.033,(now-last)/1000);last=now;const t=now/1000,P=POSE[mood]||POSE.idle;
  const wr=world.getBoundingClientRect();let nx,ny,gX,gY;
  if(now-ptr.t<3500){nx=(ptr.cx/innerWidth-.5)*2;ny=(ptr.cy/innerHeight-.5)*2;gX=ptr.cx-(wr.left+wr.width/2);gY=ptr.cy-(wr.top+wr.height*.45)}
  else{nx=Math.sin(t*.5)*.55;ny=Math.sin(t*.7+1)*.3;gX=nx*220;gY=ny*120}
  spring(S.ry,clamp(nx,-1,1)*30,70,11,dt);spring(S.rx,-clamp(ny,-1,1)*12+3,70,11,dt);
  spring(S.pk,0,170,8,dt);spring(S.sp,S.sp.tg,40,7,dt);
  scene.style.transform='rotateX('+S.rx.x.toFixed(2)+'deg) rotateY('+(S.ry.x+S.sp.x).toFixed(2)+'deg)';
  sheen.setAttribute('transform','translate('+(60+S.ry.x*3.2).toFixed(1)+' 0)');
  let fy,sy;
  if(mood==='excited'){const a=Math.abs(Math.sin(t*4.2));fy=-a*20;sy=1+(a<.18?-(.18-a)*.7:a*.03)}
  else{fy=-(Math.sin(t*P.sp)*.5+.5)*P.bob;sy=1+Math.sin(t*1.8)*.012}
  sy-=S.pk.x*.2;const sx=1/Math.sqrt(sy)+S.pk.x*.06;
  fgEl.style.transform='translateY('+fy.toFixed(2)+'px) rotateZ('+(S.ry.x*.12+Math.sin(t*.9)*1.1).toFixed(2)+'deg) scale('+sx.toFixed(3)+','+sy.toFixed(3)+')';
  const sh=1+fy/60;shd.style.transform='scale('+sh.toFixed(3)+','+(sh*.9).toFixed(3)+')';shd.style.opacity=(.35+sh*.45).toFixed(2);
  const wL=Math.abs(P.L)>60?Math.sin(t*P.sp*2)*P.wave:Math.sin(t*1.3)*2;
  const wR=Math.abs(P.R)>60?Math.sin(t*P.sp*2+1)*P.wave:Math.sin(t*1.3+1)*2;
  S.aL=lerp(S.aL,P.L+wL,.14);S.aR=lerp(S.aR,P.R+wR,.14);
  armL.style.transform='rotate('+S.aL.toFixed(2)+'deg)';armR.style.transform='rotate('+S.aR.toFixed(2)+'deg)';
  let tx,ty;
  if(mood==='thinking'){tx=5;ty=-5}else{const d=Math.hypot(gX,gY)||1,k=Math.min(1,d/180);tx=gX/d*5*k;ty=gY/d*5*k}
  S.gx=lerp(S.gx,tx,.18);S.gy=lerp(S.gy,ty,.18);
  if(Math.abs(S.gx-lastGX)>.05||Math.abs(S.gy-lastGY)>.05){lastGX=S.gx;lastGY=S.gy;face.style.setProperty('--px',S.gx.toFixed(2)+'px');face.style.setProperty('--py',S.gy.toFixed(2)+'px')}
  orbA+=dt*(S.hov?.08:.5);
  orbs.forEach((o,i)=>{const a=orbA+i*Math.PI*2/3,s=Math.sin(a);const x=120+Math.cos(a)*108,y=214+s*28,z=s*90,sc=.8+.25*s;o.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,'+z.toFixed(1)+'px) scale('+sc.toFixed(3)+')';o.style.opacity=(.8+.2*s).toFixed(2)});
}
if(!reduce)requestAnimationFrame(frame);
else{orbs.forEach((o,i)=>{o.style.transform='translate3d('+(40+i*80)+'px,230px,40px)'})}

const POKES=[['surprised','Eh, kaget! Jangan colek-colek~'],['excited','Hehe, geli! Ayo colek lagi!'],['happy','Aww, makasih ya ♥'],['wink','Psst, datamu ada di bawah lho!'],['cool','Santai aja, aku temenin kamu ngecek.']];
let pokeI=0,pokes=[];
function poke(){
  S.pk.v+=9;const now=performance.now();pokes=pokes.filter(p=>now-p<2500);pokes.push(now);
  const r=bag.getBoundingClientRect();
  burst(r.left+r.width/2,r.top+r.height*.3,8,['♥','✦']);
  if(pokes.length>=5){pokes=[];S.sp.tg+=360;hold('excited','Wuuush! Aku muter-muter! ✦',4800);burst(r.left+r.width/2,r.top+r.height*.4,26,['★','♥','✦','♪']);return}
  const p=POKES[pokeI++%POKES.length];hold(p[0],p[1],3600);
}
bag.addEventListener('click',poke);
bag.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();poke()}});
})();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8", authDomain: "mybro-9ba5f.firebaseapp.com", databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com", projectId: "mybro-9ba5f", storageBucket: "mybro-9ba5f.firebasestorage.app", messagingSenderId: "820948893264", appId: "1:820948893264:web:e564509a8fdc4c56335b55" };
const app = initializeApp(firebaseConfig), db = getDatabase(app), auth = getAuth(app), provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rupiah = n => "Rp" + Number(n || 0).toLocaleString("id-ID");
const fmt = t => t ? new Date(t).toLocaleString("id-ID", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "-";
const mmss = r => String(r / 60000 | 0).padStart(2, "0") + ":" + String(r % 60000 / 1000 | 0).padStart(2, "0");

/* status: pay=menunggu bayar, verify=menunggu verifikasi admin, done=selesai */
const META = { pay: ["Menunggu Pembayaran", "wait"], verify: ["Menunggu Verifikasi", "wait"], done: ["Selesai", "ok"], cancel: ["Dibatalkan", "no"], expired: ["Kedaluwarsa", "no"], reject: ["Ditolak", "no"] };
const GRP = { all: null, proses: ["pay", "verify"], done: ["done"], batal: ["cancel", "expired", "reject"] };
const CHIPS = [["all", "Semua"], ["proses", "Diproses"], ["done", "Selesai"], ["batal", "Batal"]];
const kind = o => {
  const p = o.paymentStatus, a = [p, o.orderStatus];
  if (a.includes("cancelled")) return "cancel";
  if (a.includes("expired")) return "expired";
  if (a.some(x => ["rejected", "failed"].includes(x))) return "reject";
  if (a.some(x => ["paid", "verified", "success", "confirmed", "completed", "done", "delivered"].includes(x))) return "done";
  if (p === "pending") return (o.expiresAt || 0) > Date.now() ? "pay" : "expired";
  return "verify";
};

/* ---- helper UI ---- */
const mr = $("mr");
const close = () => { clearInterval(S.pt); mr.innerHTML = ""; };
window.closeM = close;
const modal = h => { mr.innerHTML = `<div class="mo"><div class="mbx"><div class="mm"><svg><use href="#mascotG"/></svg></div>${h}</div></div>`; mr.firstChild.onclick = e => { if (e.target === mr.firstChild) close(); }; };
const toast = m => { document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); };
const ask = (t, x, ok, no = "Batal") => new Promise(r => {
  modal(`<h3>${esc(t)}</h3><p class="dsc">${esc(x)}</p><button class="btn btn-primary" id="a1">${esc(ok)}</button><button class="btn btn-outline" id="a2" style="margin-top:10px">${esc(no)}</button>`);
  $("a1").onclick = () => { close(); r(true); }; $("a2").onclick = () => { close(); r(false); };
});

window.login = async () => {
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/web-storage-unsupported"].includes(e.code)) return signInWithRedirect(auth, provider);
    if (!["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(e.code)) toast("Gagal masuk: " + e.message);
  }
};

const PROV = { "google.com": "Google", "password": "Email & Kata Sandi", "facebook.com": "Facebook", "apple.com": "Apple", "github.com": "GitHub", "twitter.com": "Twitter", "phone": "Nomor Telepon" };
const row = (a, b, m) => `<div><span>${a}</span><b${m ? ' style="font-family:monospace;font-size:11.5px"' : ""}>${esc(b)}</b></div>`;
const when = s => { const t = Date.parse(s); return t ? fmt(t) : "-"; };

window.editName = () => {
  const u = S.user; if (!u) return;
  modal(`<h3>Ubah Nama Akun</h3><p class="dsc">Nama ini tampil di akunmu di Cazo Market.</p><input class="inp" id="nm" maxlength="60" value="${esc(u.displayName || "")}" placeholder="Nama lengkap"><button class="btn btn-primary" id="nsv" style="margin-top:14px">Simpan</button><button class="btn btn-outline" onclick="closeM()">Batal</button>`);
  $("nm").focus();
  $("nsv").onclick = async () => {
    const v = $("nm").value.trim(); if (v.length < 2) return toast("Nama minimal 2 karakter");
    $("nsv").disabled = true;
    try { await updateProfile(auth.currentUser, { displayName: v }); S.user = auth.currentUser; close(); render(); toast("Nama diperbarui"); }
    catch (e) { $("nsv").disabled = false; toast("Gagal menyimpan: " + e.message); }
  };
};
window.copyUid = () => navigator.clipboard.writeText(S.user.uid).then(() => toast("ID akun disalin"), () => toast("Gagal menyalin"));
window.logout = async () => { if (await ask("Keluar dari akun?", "Kamu perlu masuk lagi untuk melihat riwayat dan membeli produk.", "Ya, keluar", "Batal")) { await signOut(auth); toast("Sampai jumpa lagi!"); } };

function render() {
  const el = $("pf"), u = S.user;
  if (!u) { el.innerHTML = `<div class="empty"><svg><use href="#mascot"/></svg><p>Masuk dulu untuk melihat profilmu.</p><button class="btn btn-primary" onclick="login()">Masuk dengan Google</button></div>`; return; }
  const name = u.displayName || "", ini = (name || u.email || "U")[0].toUpperCase();
  const prs = [...new Set((u.providerData || []).map(p => PROV[p.providerId] || p.providerId))].join(", ") || "-";
  const ok = S.got.o === 1, ks = S.orders.map(kind), n = x => ok ? x : "-";
  const done = S.orders.filter((o, i) => ks[i] === "done");
  const stats = [["Total Pesanan", n(S.orders.length)], ["Selesai", n(done.length)], ["Diproses", n(ks.filter(k => k === "pay" || k === "verify").length)], ["Total Belanja", ok ? rupiah(done.reduce((a, o) => a + (Number(o.priceSnapshot) || 0), 0)) : "-"]];
  el.innerHTML = `
    <section class="pcard"><div class="pav">${u.photoURL ? `<img src="${esc(u.photoURL)}" referrerpolicy="no-referrer" alt="">` : `<span>${esc(ini)}</span>`}</div>
      <h2>${esc(name || "Nama belum diatur")}</h2><p>${esc(u.email || "-")}</p>
      ${u.email ? `<span class="pill ${u.emailVerified ? "ok" : "wait"}">${u.emailVerified ? "Email terverifikasi" : "Email belum terverifikasi"}</span>` : ""}</section>
    <h3 class="ph">Informasi Akun</h3>
    <div class="card2"><div class="rows">${row("Nama akun", name || "Belum diatur")}${row("Email", u.email || "-")}${row("Metode masuk", prs)}${row("Bergabung", when(u.metadata && u.metadata.creationTime))}${row("Terakhir masuk", when(u.metadata && u.metadata.lastSignInTime))}${row("ID akun", u.uid, 1)}</div></div>
    <h3 class="ph">Ringkasan Belanja</h3>
    <div class="stats" style="grid-template-columns:repeat(2,1fr)">${stats.map(([a, b]) => `<div class="stat"><small>${a}</small><b>${b}</b></div>`).join("")}</div>
    <h3 class="ph">Menu</h3>
    <div class="menu"><a class="mi" href="riwayat.html"><span class="mc" style="--a:#2dd4bf;--b:#0d9488"><svg><use href="#i-bill"/></svg></span><span class="mt"><b>Riwayat Pesanan</b><small>Lihat semua pembelianmu</small></span><i>›</i></a><button class="mi" onclick="editName()"><span class="mc" style="--a:#a78bfa;--b:#7c3aed"><svg><use href="#i-edit"/></svg></span><span class="mt"><b>Ubah Nama Akun</b><small>Perbarui nama tampilanmu</small></span><i>›</i></button><button class="mi" onclick="copyUid()"><span class="mc" style="--a:#60a5fa;--b:#2563eb"><svg><use href="#i-copy"/></svg></span><span class="mt"><b>Salin ID Akun</b><small>Salin ID akunmu ke papan klip</small></span><i>›</i></button><a class="mi" href="kontak.html"><span class="mc" style="--a:#4ade80;--b:#16a34a"><svg><use href="#i-mail"/></svg></span><span class="mt"><b>Hubungi Kami</b><small>WhatsApp, email, dan TikTok</small></span><i>›</i></a><button class="mi out" onclick="logout()"><span class="mc" style="--a:#fb7185;--b:#e11d48"><svg><use href="#i-out"/></svg></span><span class="mt"><b>Keluar</b><small>Keluar dari akun ini</small></span><i>›</i></button></div>`;
}

const ready = () => { if (S.got.a && (S.got.o || !S.user)) $("page-loader").classList.add("hidden"); };
function sub() {
  if (S.unsub) S.unsub(); S.unsub = null; S.orders = []; S.got.o = 0; render();
  if (!S.user) return;
  S.unsub = onValue(query(ref(db, "orders"), orderByChild("buyerId"), equalTo(S.user.uid)), s => { S.orders = Object.values(s.val() || {}); S.got.o = 1; render(); ready(); }, () => { S.got.o = -1; render(); ready(); });
}
onAuthStateChanged(auth, u => { S.user = u; S.got.a = 1; sub(); ready(); });
setTimeout(() => $("page-loader").classList.add("hidden"), 6000);
</script>
</body>
</html>
