<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Profil — KodinganKita</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><rect x='4' y='4' width='120' height='120' rx='30' fill='%230b1220'/><circle cx='64' cy='70' r='50' fill='%234f46e5' opacity='.28'/><g transform='rotate(-5 64 66)'><path d='M48 52V42Q48 26 64 26Q80 26 80 42V52' fill='none' stroke='%23a5b4fc' stroke-width='6' stroke-linecap='round'/><path d='M35 48H93L98 99Q99 106 92 106H36Q29 106 30 99Z' fill='%2334d399' stroke='%2334d399' stroke-width='2' stroke-linejoin='round'/><path d='M35 48H93L93.7 57H34.3Z' fill='%2310b981'/><circle cx='50' cy='52.5' r='3' fill='%230b1220'/><circle cx='78' cy='52.5' r='3' fill='%230b1220'/><g fill='none' stroke='%230b1220' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'><path d='M53 69L43 80L53 91'/><path d='M75 69L85 80L75 91'/><path d='M68 67L60 93'/></g></g><path transform='translate(99 33) scale(.8)' fill='%23ffe14d' d='M0-12L3.5-3.5L12 0L3.5 3.5L0 12L-3.5 3.5L-12 0L-3.5-3.5Z'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#4f46e5;--primary-hover:#4338ca;--primary-light:#eef2ff;--bg-body:#f8fafc;--text-main:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--success:#10b981;--warning:#f59e0b;--radius-sm:8px;--radius-md:14px;--radius-lg:24px;--radius-full:999px;--shadow-sm:0 1px 3px rgba(0,0,0,0.05);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--font);background:var(--bg-body);color:var(--text-main);padding-bottom:110px;opacity:0;transition:opacity 0.3s ease;}
body.loaded{opacity:1;}
a{text-decoration:none;color:inherit}img{max-width:100%;display:block}button{font-family:inherit;cursor:pointer;border:none;background:none}
#page-loader{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease, visibility 0.5s;}
#page-loader.hidden{opacity:0;visibility:hidden;}
header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.9);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.brand svg{width:34px;height:34px;border-radius:8px}
.btn-login{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius-full);font-weight:600;font-size:14px}
.container{max-width:500px;margin:0 auto;padding:20px}
.section-title{font-size:20px;font-weight:800;margin:0 0 16px}
.card{background:#fff;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border);padding:20px;margin-bottom:16px}
.input-field{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:14px;outline:none;background:#fff;margin-bottom:16px;font-family:inherit}.input-field:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:var(--radius-md);font-weight:700;font-size:15px;transition:0.2s;width:100%;cursor:pointer;text-decoration:none}.btn-primary{background:var(--primary);color:#fff}.btn-outline{background:#fff;color:var(--text-main);border:1px solid var(--border)}
.loading-spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}@keyframes spin{to{transform:rotate(360deg)}}
/* === NAVIGASI 3D === */
:root { --ink:#1e1b4b; }
.nav { position:fixed; left:12px; right:12px; bottom:16px; background:#fff; border-radius:34px; padding:10px 8px 10px; display:flex; justify-content:space-around; box-shadow:0 10px 30px rgba(76,29,149,.2), inset 0 -3px 0 rgba(30,27,75,.05); z-index: 100; }
.item { position:relative; flex:1; border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; font:900 11px inherit; color:#94a3b8; padding:0; text-decoration: none; outline: none; }
.iw { position:relative; width:42px; height:42px; display:grid; place-items:center; }
.iw::before { content:""; position:absolute; inset:-2px; border-radius:50%; background:radial-gradient(circle at 50% 40%, var(--glow) 0%, transparent 70%); opacity:0; transform:scale(.5); transition:.3s; }
.icon { position:relative; width:38px; height:38px; overflow:visible; filter:grayscale(1) opacity(.5); transition:transform .35s cubic-bezier(.34,1.8,.64,1), filter .3s; }
.item.active { color:#4f46e5; }
.item.active .iw::before { opacity:.55; transform:scale(1.15); }
.item.active .icon { transform:translateY(-4px) scale(1.15); filter:drop-shadow(0 4px 3px rgba(30,27,75,.28)); }
.mascot { position:absolute; top:-30px; width:42px; height:32px; overflow:visible; opacity:0; transform:translateY(14px) scale(.7); transition:.35s cubic-bezier(.34,1.8,.64,1); pointer-events:none; }
.item.active .mascot { opacity:1; transform:none; animation:bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform:translateY(-3px) rotate(-3deg); } }
.item.active .tw { animation:tw 1.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes tw { 50% { transform:scale(.4) rotate(45deg); opacity:.5; } }
</style>
</head>
<body>

<div id="page-loader"><div id="custom-loader-content"></div></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gViolet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="gYellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef08a"/><stop offset="1" stop-color="#facc15"/></linearGradient>

    <linearGradient id="gOrange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#f97316"/></linearGradient>

  <symbol id="spark" viewBox="0 0 10 10"><path d="M5 0.3 6.2 3.8 9.7 5 6.2 6.2 5 9.7 3.8 6.2 0.3 5 3.8 3.8z" fill="#fff" stroke="#1e1b4b" stroke-width=".9" stroke-linejoin="round"/></symbol>
  <symbol id="mascot" viewBox="0 0 44 34"><g stroke="#1e1b4b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="7" cy="30" r="4" fill="#ffe8d6"/><circle cx="37" cy="30" r="4" fill="#ffe8d6"/><ellipse cx="22" cy="21.5" rx="14.5" ry="10.5" fill="#ffe8d6"/><path d="M7 21C6 12 9 9 10 5l5 6 4-9 4 8 5-8 3 9 5-6c1 4 2 8 1 16-4-7-9-9-15-9S11 14 7 21Z" fill="#3b82f6"/></g><path d="M12 12c3-3 7-4 10-4" stroke="#fff" stroke-opacity=".6" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="15.5" cy="22.5" r="3.5" fill="#fbbf24" stroke="#1e1b4b" stroke-width="1.2"/><circle cx="28.5" cy="22.5" r="3.5" fill="#fbbf24" stroke="#1e1b4b" stroke-width="1.2"/><circle cx="15.8" cy="22.8" r="1.7" fill="#1e1b4b"/><circle cx="28.2" cy="22.8" r="1.7" fill="#1e1b4b"/><circle cx="14.8" cy="21.6" r=".8" fill="#fff"/><circle cx="27.2" cy="21.6" r=".8" fill="#fff"/><circle cx="10" cy="26.5" r="2" fill="#fda4af" opacity=".75"/><circle cx="34" cy="26.5" r="2" fill="#fda4af" opacity=".75"/><path d="M19.5 27.5q2.5 2.2 5 0" stroke="#be123c" stroke-width="1.4" fill="none" stroke-linecap="round"/></symbol>
</svg>

<header class="site">
  <a href="index.html" class="brand" id="brandLogo">KodinganKita</a>
  <button id="authBtn" class="btn-login" onclick="handleAuth()">Masuk</button>
</header>

<main class="container" id="app" style="max-width:500px">
  <div class="loading-spin"></div>
</main>

<nav class="nav" id="nav">
  <a href="index.html" class="item" style="--glow:#c4b5fd"><svg class="mascot"><use href="#mascot"/></svg><div class="iw"><svg class="icon" viewBox="0 0 56 56"><ellipse cx="28" cy="52" rx="17" ry="3" fill="#1e1b4b" opacity=".18"/><g stroke="#1e1b4b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><rect x="36" y="10" width="7" height="14" rx="2" fill="url(#gPink)"/><rect x="10" y="26" width="36" height="24" rx="5" fill="url(#gYellow)"/><path d="M5 30 28 7 51 30Z" fill="url(#gViolet)"/><circle cx="28" cy="22" r="4.5" fill="#bae6fd"/><path d="M23 50V40a5 5 0 0 1 10 0v10Z" fill="url(#gPink)"/><circle cx="30.5" cy="44.5" r="1" fill="#1e1b4b" stroke="none"/></g><path d="M12 28 26 14" stroke="#fff" stroke-opacity=".65" stroke-width="3" stroke-linecap="round"/><path d="M14 34v8" stroke="#fff" stroke-opacity=".7" stroke-width="2.6" stroke-linecap="round"/><use class="tw" href="#spark" x="43" y="1" width="10" height="10"/></svg></div>Beranda</a>
  <a href="katalog.html" class="item" style="--glow:#93c5fd"><svg class="mascot"><use href="#mascot"/></svg><div class="iw"><svg class="icon" viewBox="0 0 56 56"><ellipse cx="28" cy="52.5" rx="18" ry="3" fill="#1e1b4b" opacity=".18"/><g stroke="#1e1b4b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><rect x="8" y="11" width="18" height="18" rx="6" fill="#1e1b4b"/><rect x="8" y="8" width="18" height="18" rx="6" fill="url(#gPink)"/><rect x="30" y="11" width="18" height="18" rx="6" fill="#1e1b4b"/><rect x="30" y="8" width="18" height="18" rx="6" fill="url(#gBlue)"/><rect x="8" y="33" width="18" height="18" rx="6" fill="#1e1b4b"/><rect x="8" y="30" width="18" height="18" rx="6" fill="url(#gYellow)"/><rect x="30" y="33" width="18" height="18" rx="6" fill="#1e1b4b"/><rect x="30" y="30" width="18" height="18" rx="6" fill="url(#gGreen)"/></g><g stroke="#fff" stroke-opacity=".75" stroke-width="2.4" fill="none" stroke-linecap="round"><path d="M12 17a5 5 0 0 1 5-5"/><path d="M34 17a5 5 0 0 1 5-5"/><path d="M12 39a5 5 0 0 1 5-5"/><path d="M34 39a5 5 0 0 1 5-5"/></g><use class="tw" href="#spark" x="42" y="1" width="10" height="10"/></svg></div>Katalog</a>
  <a href="riwayat.html" class="item" style="--glow:#5eead4"><svg class="mascot"><use href="#mascot"/></svg><div class="iw"><svg class="icon" viewBox="0 0 56 56"><ellipse cx="28" cy="53" rx="16" ry="2.8" fill="#1e1b4b" opacity=".18"/><g stroke="#1e1b4b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M14 47 10 52"/><path d="M42 47l4 5"/><circle cx="12" cy="13" r="6" fill="url(#gYellow)"/><circle cx="44" cy="13" r="6" fill="url(#gYellow)"/><circle cx="28" cy="31" r="19" fill="url(#gTeal)"/><circle cx="28" cy="31" r="13.5" fill="#f0fdfa"/><path d="M28 20.5v2.5M28 39v2.5M17.5 31H20M36 31h2.5" stroke-width="2"/><path d="M28 31v-8" stroke="#0f766e" stroke-width="3"/><path d="m28 31 5.5 3.5" stroke="#0f766e" stroke-width="3"/><circle cx="28" cy="31" r="2.2" fill="url(#gPink)" stroke-width="1.6"/></g><path d="M12 27a16 16 0 0 1 8-10" stroke="#fff" stroke-opacity=".7" stroke-width="3" fill="none" stroke-linecap="round"/><use class="tw" href="#spark" x="44" y="26" width="10" height="10"/></svg></div>Riwayat</a>
  <a href="profil.html" class="item active" style="--glow:#fdba74"><svg class="mascot"><use href="#mascot"/></svg><div class="iw"><svg class="icon" viewBox="0 0 56 56"><ellipse cx="28" cy="52.5" rx="17" ry="3" fill="#1e1b4b" opacity=".18"/><g stroke="#1e1b4b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M9 51C9 40 17 36 28 36S47 40 47 51Z" fill="url(#gOrange)"/><path d="M23 37l5 6 5-6Z" fill="#fff"/><circle cx="28" cy="22" r="13" fill="#ffe8d6"/><path d="M15 22C13 9 22 6 28 8c8-2 15 3 13 14-3-6-7-8-13-8s-10 2-13 8Z" fill="url(#gBlue)"/></g><path d="M18 14c2-3 5-4 8-4" stroke="#fff" stroke-opacity=".7" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="22.5" cy="25" r="2" fill="#1e1b4b"/><circle cx="33.5" cy="25" r="2" fill="#1e1b4b"/><circle cx="19" cy="28.5" r="2" fill="#fda4af" opacity=".8"/><circle cx="37" cy="28.5" r="2" fill="#fda4af" opacity=".8"/><path d="M25 29.5q3 3 6 0" stroke="#1e1b4b" stroke-width="1.8" fill="none" stroke-linecap="round"/><use class="tw" href="#spark" x="42" y="2" width="10" height="10"/></svg></div>Profil</a>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, onValue, set, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8", authDomain: "mybro-9ba5f.firebaseapp.com", databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com", projectId: "mybro-9ba5f", storageBucket: "mybro-9ba5f.firebasestorage.app", messagingSenderId: "820948893264", appId: "1:820948893264:web:e564509a8fdc4c56335b55" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app); const auth = getAuth(app); const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

const DEFAULT_LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%"><rect x="4" y="4" width="120" height="120" rx="30" fill="#0b1220"/><circle cx="64" cy="70" r="50" fill="#4f46e5" opacity=".28"/><g transform="rotate(-5 64 66)"><path d="M48 52V42Q48 26 64 26Q80 26 80 42V52" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/><path d="M35 48H93L98 99Q99 106 92 106H36Q29 106 30 99Z" fill="#34d399" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/><path d="M35 48H93L93.7 57H34.3Z" fill="#10b981"/><circle cx="50" cy="52.5" r="3" fill="#0b1220"/><circle cx="78" cy="52.5" r="3" fill="#0b1220"/><g fill="none" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M53 69L43 80L53 91"/><path d="M75 69L85 80L75 91"/><path d="M68 67L60 93"/></g></g><path transform="translate(99 33) scale(.8)" fill="#ffe14d" d="M0-12L3.5-3.5L12 0L3.5 3.5L0 12L-3.5 3.5L-12 0L-3.5-3.5Z"/></svg>`;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let state = { user: null, settings: {}, loaded: 0 };
function checkLoaded() { state.loaded++; if(state.loaded >= 2) { setTimeout(() => { document.getElementById('page-loader').classList.add('hidden'); document.body.classList.add('loaded'); renderPage(); }, 300); } }
window.handleAuth = async () => { if (state.user) { if(confirm("Keluar?")) await signOut(auth); } else { try { await signInWithPopup(auth, provider); } catch(e){ alert(e.message); } } };
onAuthStateChanged(auth, user => { state.user = user; const btn = document.getElementById('authBtn'); if(btn) btn.innerHTML = user ? `Keluar (${user.displayName.split(' ')[0]})` : 'Masuk'; renderPage(); });
onValue(ref(db, "settings/marketplace"), s => { state.settings = s.val() || {}; checkLoaded(); });

async function renderPage() {
  if(!state.settings) return;
  document.getElementById('brandLogo').innerHTML = `<div style="width:34px;height:34px;display:inline-block;vertical-align:middle;margin-right:8px;">${DEFAULT_LOGO}</div> ${esc(state.settings.name || "KodinganKita")}`;
  const appContainer = document.getElementById('app');
  
  if(!state.user) {
    appContainer.innerHTML = `<div style="text-align:center;padding-top:40px"><h2>Profil Anda</h2><p style="color:var(--text-muted);margin-bottom:24px">Masuk untuk mengelola profil.</p><button class="btn btn-primary" onclick="handleAuth()">Masuk Google</button></div>`;
    return;
  }
  
  const shopsSnap = await get(ref(db, 'shops'));
  const myShop = Object.entries(shopsSnap.val() || {}).find(([id, s]) => s.ownerId === state.user.uid);

  appContainer.innerHTML = `
    <div style="text-align:center;margin-bottom:30px">
      <img src="${state.user.photoURL}" style="width:80px;height:80px;border-radius:50%;margin:0 auto 16px;border:3px solid var(--primary)">
      <h2 style="margin:0">${esc(state.user.displayName)}</h2>
      <p style="color:var(--text-muted);margin:4px 0 0">${esc(state.user.email)}</p>
    </div>
    ${myShop ? `
      <div class="card" style="text-align:center">
        <h3 style="margin:0 0 10px">Toko Anda</h3>
        <p style="font-weight:700;font-size:18px;color:var(--primary);margin-bottom:16px">${esc(myShop[1].name)}</p>
      </div>
    ` : `
      <div class="card">
        <h3 style="margin-top:0;text-align:center">Buka Toko Baru</h3>
        <form id="formSeller">
          <input type="text" class="input-field" name="shopName" placeholder="Nama Toko" required>
          <input type="text" class="input-field" name="slug" placeholder="Slug (huruf kecil)" pattern="[a-z0-9-]+" required>
          <textarea class="input-field" name="description" placeholder="Deskripsi Toko" required></textarea>
          <input type="text" class="input-field" name="ownerName" placeholder="Nama Pemilik" required>
          <input type="text" class="input-field" name="contact" placeholder="Kontak (WA/Email)" required>
          <button type="submit" class="btn btn-primary">Ajukan Toko</button>
        </form>
      </div>
    `}
  `;

  if(!myShop) {
    document.getElementById("formSeller").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const appRef = push(ref(db, 'sellerApplications'));
      await set(appRef, {
        userId: state.user.uid, shopName: fd.get('shopName'), slug: fd.get('slug').toLowerCase(),
        description: fd.get('description'), ownerName: fd.get('ownerName'), contact: fd.get('contact'),
        email: state.user.email, status: 'pending', createdAt: Date.now()
      });
      alert("Pengajuan terkirim!"); renderPage();
    };
  }
}
</script>
</body>
</html>
