<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cazo Market — Marketplace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><rect x='4' y='4' width='120' height='120' rx='30' fill='%230b1220'/><circle cx='64' cy='70' r='50' fill='%234f46e5' opacity='.28'/><g transform='rotate(-5 64 66)'><path d='M48 52V42Q48 26 64 26Q80 26 80 42V52' fill='none' stroke='%23a5b4fc' stroke-width='6' stroke-linecap='round'/><path d='M35 48H93L98 99Q99 106 92 106H36Q29 106 30 99Z' fill='%2334d399' stroke='%2334d399' stroke-width='2' stroke-linejoin='round'/><path d='M35 48H93L93.7 57H34.3Z' fill='%2310b981'/><circle cx='50' cy='52.5' r='3' fill='%230b1220'/><circle cx='78' cy='52.5' r='3' fill='%230b1220'/><g fill='none' stroke='%230b1220' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'><path d='M53 69L43 80L53 91'/><path d='M75 69L85 80L75 91'/><path d='M68 67L60 93'/></g></g><path transform='translate(99 33) scale(.8)' fill='%23ffe14d' d='M0-12L3.5-3.5L12 0L3.5 3.5L0 12L-3.5 3.5L-12 0L-3.5-3.5Z'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#4f46e5;--primary-hover:#4338ca;--primary-light:#eef2ff;
  --bg-body:#f8fafc;--text-main:#0f172a;--text-muted:#64748b;--border:#e2e8f0;
  --danger:#ef4444;--success:#10b981;--radius-md:14px;--radius-full:999px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.05);--shadow-md:0 4px 12px rgba(0,0,0,0.08);
  --font:'Inter',system-ui,sans-serif;
  
  --page-bg:#f8fafc;--c1:#4c1d95;--c2:#7c3aed;--c3:#db2777;--c4:#2563eb;--speed:1;--ink:#1e1b4b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--font);background:var(--bg-body);color:var(--text-main);padding-bottom:110px;opacity:0;transition:opacity 0.3s ease;}
body.loaded{opacity:1;}
a{text-decoration:none;color:inherit}img{max-width:100%;display:block}button{font-family:inherit;cursor:pointer;border:none;background:none}
[hidden]{display:none!important}

/* === HEADER ANIMASI === */
.cz-header{position:relative;color:#fff;padding:0;isolation:isolate;background:linear-gradient(120deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c1));background-size:300% 300%;animation:flow calc(14s/var(--speed)) ease-in-out infinite;overflow:hidden;border-radius:0 0 30px 30px;margin-bottom:20px;}
.cz-bg{position:absolute;inset:0;overflow:hidden;z-index:-1}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.cz-bg::before{content:"";position:absolute;inset:0;opacity:.6;background-image:linear-gradient(rgba(255,255,255,.3) 2.5px,transparent 2.5px),linear-gradient(90deg,rgba(255,255,255,.3) 2.5px,transparent 2.5px);background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);animation:grid calc(6s/var(--speed)) linear infinite}
@keyframes grid{to{background-position:34px 34px}}
.cz-bg::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-20deg);animation:shine calc(7s/var(--speed)) ease-in-out infinite}
@keyframes shine{0%,30%{left:-60%}70%,100%{left:130%}}
.blob{position:absolute;border-radius:50%;filter:blur(38px);opacity:.55;mix-blend-mode:screen}
.b1{width:220px;height:220px;background:#f472b6;left:-60px;top:-50px;animation:m1 calc(11s/var(--speed)) ease-in-out infinite}
.b2{width:260px;height:260px;background:#22d3ee;right:-80px;top:20px;animation:m2 calc(13s/var(--speed)) ease-in-out infinite}
.b3{width:180px;height:180px;background:#fde047;left:40%;bottom:-70px;animation:m3 calc(9s/var(--speed)) ease-in-out infinite}
@keyframes m1{50%{transform:translate(90px,60px) scale(1.25)}}
@keyframes m2{50%{transform:translate(-110px,40px) scale(.85)}}
@keyframes m3{50%{transform:translate(-90px,-40px) scale(1.3)}}
.fl{position:absolute;bottom:-30px;left:var(--x);font-weight:800;font-size:var(--s);color:rgba(255,255,255,.55);text-shadow:0 2px 10px rgba(30,27,75,.35);animation:rise calc(var(--d)/var(--speed)) linear infinite;animation-delay:var(--dl)}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}85%{opacity:.8}100%{transform:translateY(-340px) rotate(var(--r));opacity:0}}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:56px;overflow:hidden;pointer-events:none;z-index:3}
.wave svg{position:absolute;left:0;bottom:0;width:200%;height:100%}
.w1{animation:slide calc(12s/var(--speed)) linear infinite}
.w2{animation:slide calc(8s/var(--speed)) linear infinite reverse;opacity:.5}
@keyframes slide{to{transform:translateX(-50%)}}

.bar{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;z-index:20;}
.logo{position:relative;z-index:0;width:50px;height:50px;flex:none;animation:flt 3s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(30,27,75,.4))}
.logo::before{content:"";position:absolute;inset:-3px;z-index:-1;border-radius:18px;background:conic-gradient(#fde047,#f472b6,#22d3ee,#4ade80,#fde047);filter:blur(9px);opacity:.75;animation:rot 4s linear infinite}
.logo svg{width:100%;height:100%;display:block;overflow:visible}
.lshine{animation:ls 3.4s ease-in-out infinite}
@keyframes ls{0%,55%{transform:translateX(0)}100%{transform:translateX(110px)}}
@keyframes flt{50%{transform:translateY(-3px) rotate(-3deg)}}
@keyframes rot{to{transform:rotate(360deg)}}
.name{flex:1;font-weight:900;font-size:21px;letter-spacing:-.3px;line-height:1.05;text-shadow:0 2px 0 rgba(30,27,75,.4)}
.shim{background:linear-gradient(90deg,#fde047,#f9a8d4,#a5f3fc,#fde047);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite;text-shadow:none;filter:drop-shadow(0 2px 0 rgba(30,27,75,.45))}
@keyframes sh{to{background-position:-200% 0}}

/* TOMBOL MASUK */
.login{position:relative;border:0;padding:2.5px;border-radius:999px;cursor:pointer;overflow:hidden;background:none;transition:transform .2s;z-index:20;}
.login:active{transform:scale(.95)}
.login::before{content:"";position:absolute;left:50%;top:50%;width:300%;aspect-ratio:1;translate:-50% -50%;background:conic-gradient(#fde047,#f472b6,#22d3ee,#4ade80,#fde047);animation:rot 3s linear infinite}
.login span{position:relative;display:flex;align-items:center;gap:9px;background:#fff;color:#1f2937;font-weight:800;font-size:15px;padding:8px 18px 8px 12px;border-radius:999px;box-shadow:0 3px 0 rgba(30,27,75,.25)}
.login .g{width:22px;height:22px;display:grid;place-items:center}
.login .g svg{width:22px;height:22px}
.login:hover span{background:#f1f5f9}

/* === CARD PROFIL RAPI (FOTO + NAMA) === */
.acct{position:relative;z-index:50;}
.profile-card{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,0.95);
  border-radius:999px;
  padding:4px 14px 4px 4px;
  cursor:pointer;
  box-shadow:0 3px 0 rgba(30,27,75,.25);
  transition:transform .2s, background .2s;
  max-width:180px;
  border:0;
}
.profile-card:active{transform:scale(.95)}
.profile-card:hover{background:#f1f5f9}
.profile-card .av{width:32px;height:32px;}
.pname{
  font-weight:800;font-size:13px;color:#1e1b4b;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100px;
}

/* AVATAR */
.av{position:relative;flex:none;border-radius:50%;display:inline-block;}
.av::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#fde047,#f472b6,#22d3ee,#fde047);animation:rot 3s linear infinite}
.av img,.av .ini{position:absolute;inset:2.5px;width:calc(100% - 5px);height:calc(100% - 5px);border-radius:50%;object-fit:cover;background:#fff}
.av .ini{display:grid;place-items:center;font-weight:900;color:#fff;font-size:14px;background:linear-gradient(135deg,#7c3aed,#db2777)}

.hero{text-align:center;padding:22px 20px 0}
.hero h1{font-size:clamp(36px,10vw,56px);font-weight:900;letter-spacing:-1.5px;line-height:1;text-shadow:0 4px 0 rgba(30,27,75,.35)}
.hero p{margin-top:8px;font-size:16px;font-weight:500;opacity:.93}
.say{display:flex;align-items:flex-end;justify-content:center;gap:14px;padding:18px 16px 0;position:relative;z-index:10;}

.peek{flex:none;width:130px;height:auto;overflow:visible;position:relative;z-index:2;margin-bottom:12px;filter:drop-shadow(0 5px 5px rgba(30,27,75,.35))}
.bubble{position:relative;flex:none;width:min(236px,calc(100vw - 160px));height:76px;margin-bottom:42px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:11px 14px;font-weight:800;font-size:15px;line-height:1.38;box-shadow:0 4px 0 rgba(30,27,75,.35);transform-origin:0 70%;display:flex;align-items:center;}
.bubble.pop{animation:bpop .55s cubic-bezier(.34,1.6,.64,1)}
@keyframes bpop{0%{transform:scale(.8) rotate(-3deg);opacity:0}60%{opacity:1}100%{transform:none}}
#typed{display:block;transition:opacity .35s}
#typed.fade{opacity:0}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0;transform:translateY(3px);transition:opacity .2s ease,transform .2s ease}
.ch.on{opacity:1;transform:none}
.bubble::before{content:"";position:absolute;left:-11px;bottom:16px;width:16px;height:16px;background:#fff;border:3px solid var(--ink);border-top:0;border-right:0;transform:rotate(45deg)}
.caret{display:inline-block;width:0;height:1.05em;position:relative;vertical-align:-3px}
.caret::after{content:"";position:absolute;left:1px;top:0;width:2.5px;height:100%;border-radius:2px;background:#db2777;animation:cr .9s steps(1) infinite}
@keyframes cr{50%{opacity:0}}
.pk-eyes{transform-origin:60px 54px;animation:bl 4s infinite}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.m-open{opacity:0}
.talking .m-open{animation:mo .3s steps(1) infinite}
.talking .m-shut{animation:ms .3s steps(1) infinite}
@keyframes mo{0%{opacity:1}50%{opacity:0}}
@keyframes ms{0%{opacity:0}50%{opacity:1}}
.pk-hand{transform-origin:94px 102px}
.talking .pk-hand{animation:hg .7s ease-in-out infinite}
@keyframes hg{50%{transform:rotate(4deg)}}
@media (max-width:360px){.peek{width:100px}.bubble{font-size:13px;margin-bottom:34px}}

/* === MENU CEPAT === */
.container{max-width:1000px;margin:0 auto;padding:20px;}
.quick-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:500px;margin:-10px auto 30px;padding:0 16px;}
.quick-item{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:inherit;cursor:pointer;}
.quick-icon{width:64px;height:64px;background:#fff;border-radius:50%;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border);transition:0.2s;}
.quick-item:active .quick-icon{transform:scale(0.9);}
.quick-icon iframe{width:100%;height:100%;border:none;border-radius:50%;pointer-events:none;}
.quick-label{font-size:12px;font-weight:600;text-align:center;}

/* === PRODUK === */
.section-title{font-size:20px;font-weight:800;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;border:1px solid var(--border);text-decoration:none;color:inherit}
.card-img{aspect-ratio:1;background:#f1f5f9;width:100%;display:flex;align-items:center;justify-content:center}.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:14px;display:flex;flex-direction:column;flex:1}.card-title{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-price{font-size:15px;font-weight:800;color:var(--primary);margin-top:auto}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);grid-column:1/-1}

/* === NAVIGASI 3D BAWAH === */
:root { --nav-ink:#1e1b4b; }
.nav { position:fixed; left:12px; right:12px; bottom:16px; background:#fff; border-radius:34px; padding:10px 8px 10px; display:flex; justify-content:space-around; box-shadow:0 10px 30px rgba(76,29,149,.2), inset 0 -3px 0 rgba(30,27,75,.05); z-index: 100; }
.item { position:relative; flex:1; border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; font:900 11px inherit; color:#94a3b8; padding:0; text-decoration: none; outline: none; }
.iw { position:relative; width:42px; height:42px; display:grid; place-items:center; }
.iw::before { content:""; position:absolute; inset:-2px; border-radius:50%; background:radial-gradient(circle at 50% 40%, var(--glow) 0%, transparent 70%); opacity:0; transform:scale(.5); transition:.3s; }
.icon { position:relative; width:38px; height:38px; overflow:visible; filter:grayscale(1) opacity(.5); transition:transform .35s cubic-bezier(.34,1.8,.64,1), filter .3s; }
.item.active { color:#4f46e5; }
.item.active .iw::before { opacity:.55; transform:scale(1.15); }
.item.active .icon { transform:translateY(-4px) scale(1.15); filter:drop-shadow(0 4px 3px rgba(30,27,75,.28)); }
.mascot { position:absolute; top:-30px; width:42px; height:32px; overflow:visible; opacity:0; transform:translateY(14px) scale(.7); transition:.35s cubic-bezier(.34,1.8,.64,1); pointer-events:none; }
.item.active .mascot { opacity:1; transform:none; animation:bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform:translateY(-3px) rotate(-3deg); } }
.item.active .tw { animation:tw 1.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes tw { 50% { transform:scale(.4) rotate(45deg); opacity:.5; } }
</style>
</head>
<body>

<!-- SVG DEFINITIONS -->

  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>

    <linearGradient id="gGreen"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#22c55e"/></linearGradient>

  </defs>
  <symbol id="spark" viewBox="0 0 10 10"><path d="M5 0.3 6.2 3.8 9.7 5 6.2 6.2 5 9.7 3.8 6.2 0.3 5 3.8 3.8z" fill="#fff" stroke="#1e1b4b" stroke-width=".9" stroke-linejoin="round"/></symbol>

</svg>

<!-- HEADER -->
<header class="cz-header">
  <div class="cz-bg">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
    <span class="fl" style="--x:8%;--s:26px;--d:9s;--dl:0s;--r:25deg">&lt;/&gt;</span>
    <span class="fl" style="--x:24%;--s:22px;--d:11s;--dl:2s;--r:-30deg">%</span>
    <span class="fl" style="--x:40%;--s:20px;--d:8s;--dl:4s;--r:40deg">✦</span>
    <span class="fl" style="--x:56%;--s:28px;--d:12s;--dl:1s;--r:-20deg">{ }</span>
    <span class="fl" style="--x:70%;--s:24px;--d:10s;--dl:3s;--r:30deg">🛍️</span>
    <span class="fl" style="--x:84%;--s:20px;--d:9s;--dl:5s;--r:-45deg">✦</span>
  </div>

  <div class="bar">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <defs><clipPath id="lgClip"><rect x="4" y="4" width="56" height="56" rx="18"/></clipPath></defs>
        <rect x="4" y="9" width="56" height="56" rx="18" fill="#1e1b4b"/>
        <rect x="4" y="4" width="56" height="56" rx="18" fill="url(#lgBg)" stroke="#1e1b4b" stroke-width="3"/>
        <g clip-path="url(#lgClip)"><g class="lshine"><rect x="-26" y="0" width="12" height="64" fill="#fff" opacity=".5" transform="skewX(-20)"/></g></g>
        <path d="M22 24v-3a10 10 0 0 1 20 0v3" fill="none" stroke="#1e1b4b" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M14 25h36l-3 28a4 4 0 0 1-4 3.5H21a4 4 0 0 1-4-3.5z" fill="url(#lgBag)" stroke="#1e1b4b" stroke-width="3" stroke-linejoin="round"/>
        <path d="M27 35l-6 6 6 6M37 35l6 6-6 6M34 33l-4 16" fill="none" stroke="url(#lgCode)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 17q4-8 14-9" stroke="#fff" stroke-opacity=".7" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="51" cy="14" r="9" fill="#fde047" stroke="#1e1b4b" stroke-width="2.6"/>
        <text x="51" y="18" text-anchor="middle" font-size="12" font-weight="900" fill="#1e1b4b" font-family="Inter,sans-serif">%</text>
      </svg>
    </div>
    <div class="name" id="brandName">Cazo <span class="shim">Market</span></div>

    <div class="acct">
      <!-- TOMBOL MASUK (Belum Login) -->
      <button class="login" id="loginBtn" onclick="handleLogin()">
        <span>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8", authDomain: "mybro-9ba5f.firebaseapp.com", databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com", projectId: "mybro-9ba5f", storageBucket: "mybro-9ba5f.firebasestorage.app", messagingSenderId: "820948893264", appId: "1:820948893264:web:e564509a8fdc4c56335b55" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app); const auth = getAuth(app); const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupiah = n => "Rp" + Number(n||0).toLocaleString("id-ID");

let state = { user: null, settings: {}, products: {}, showAllMenus: false };

function createIframe(code, round, interactive=false) { 
  const i = document.createElement("iframe"); 
  if(round) i.style.borderRadius="50%"; 
  i.srcdoc=`<html><head><style>body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;${interactive ? '' : 'pointer-events:none;'}background:transparent;}*{box-sizing:border-box;}</style></head><body>${code}</body></html>`; 
  return i; 
}

// --- LOGIN & LOGOUT ---
window.handleLogin = async () => { 
  try { 
    await signInWithPopup(auth, provider); 
  } catch(e){ 
    alert("Gagal login: " + e.message); 
  } 
};

window.handleLogout = async () => { 
  if(confirm("Keluar dari akun " + (state.user?.displayName || "") + "?")) {
    try { await signOut(auth); } catch(e){ alert(e.message); }
  }
};

// --- STATE AUTH ---
onAuthStateChanged(auth, user => { 
  state.user = user; 
  const loginBtn = document.getElementById('loginBtn');
  const userChip = document.getElementById('userChip');
  
  if(user) {
    loginBtn.hidden = true; 
    userChip.hidden = false;
    
    const fullName = user.displayName || "Pengguna";
    document.getElementById('pname').textContent = fullName.split(' ')[0];
    
    const ini = fullName.charAt(0).toUpperCase();
    const imgHTML = user.photoURL 
      ? `<img src="${user.photoURL}" referrerpolicy="no-referrer" alt="">` 
      : `<span class="ini">${ini}</span>`;
    document.getElementById('av').innerHTML = imgHTML;
  } else {
    loginBtn.hidden = false; 
    userChip.hidden = true;
  }
});

// --- LOAD DATA ---
onValue(ref(db, "settings/marketplace"), s => { 
  state.settings = s.val() || {}; 
  const name = state.settings.name || "Cazo Market";
  const words = name.split(' ');
  const firstWord = words[0];
  const restWords = words.slice(1).join(' ');
  
  document.getElementById('brandName').innerHTML = `${firstWord} <span class="shim">${restWords}</span>`;
  document.getElementById('heroTitle').innerHTML = `${firstWord} <span class="shim">${restWords}</span>`;
  document.getElementById('heroDesc').textContent = state.settings.description || "Marketplace Produk Digital Eksklusif.";
  
  renderQuickMenu();
});

onValue(ref(db, "products"), s => { 
  state.products = s.val() || {}; 
  renderProducts(); 
});

// --- MENU CEPAT ---
function renderQuickMenu() {
  const container = document.getElementById('quickMenu');
  const defaultMenus = [
    { label: "Katalog", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`, action: "katalog.html" },
    { label: "Cari", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>`, action: "katalog.html" },
    { label: "Jual", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>`, action: "profil.html" },
    { label: "Riwayat", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg>`, action: "riwayat.html" }
  ];
  
  const menus = (state.settings.menuItems && state.settings.menuItems.length > 0) ? state.settings.menuItems : defaultMenus;
  const displayMenus = state.showAllMenus ? menus : menus.slice(0, 4);
  
  let html = displayMenus.map((m, i) => `
    <a href="${esc(m.action)}" class="quick-item">
      <div class="quick-icon" id="menu-icon-${i}"></div>
      <span class="quick-label">${esc(m.label)}</span>
    </a>
  `).join("");

  if (menus.length > 4 && !state.showAllMenus) {
    html += `
      <a href="javascript:void(0)" onclick="document.getElementById('quickMenu').style.maxWidth='100%'; window.state.showAllMenus=true; renderQuickMenu();" class="quick-item">
        <div class="quick-icon" style="background:var(--bg-body); border:1px dashed var(--primary);">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </div>
        <span class="quick-label" style="color:var(--primary)">Semua</span>
      </a>
    `;
  }

  container.innerHTML = html;
  displayMenus.forEach((m, i) => { 
    if(m.code) document.getElementById(`menu-icon-${i}`).appendChild(createIframe(m.code, true, false)); 
  });
}

// --- PRODUK ---
function renderProducts() {
  if(!state.products) return;
  const latest = Object.entries(state.products).map(([id, p]) => ({id, ...p})).filter(p => p.status !== 'sold').sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 8);
  const grid = document.getElementById('latestGrid');
  
  grid.innerHTML = latest.length ? latest.map(p => `
    <a href="detail.html?id=${p.id}" class="card">
      <div class="card-img"><img src="${p.imageURLs?.[0] || 'https://placehold.co/400x400/f1f5f9/64748b?text=No+Image'}"></div>
      <div class="card-body">
        <div class="card-title">${esc(p.title)}</div>
        <div class="card-price">${rupiah(p.price)}</div>
      </div>
    </a>
  `).join("") : `<div class="empty-state">Belum ada produk.</div>`;
}

// --- MASKOT MENGETIK ---
(function () {
  var MESSAGES = ["Buruan beli, nanti habis nyesel loh!", "Cari produk digital? Cek menu Katalog ya.", "Punya produk? Yuk jualan di Cazo Market!"];
  var typed = document.getElementById("typed"), say = document.getElementById("say"), bubble = document.querySelector(".bubble"), caret = document.querySelector(".caret");
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function build(text) {
    typed.textContent = ""; typed.prepend(caret);
    var spans = [];
    text.split(" ").forEach(function (word, wi, arr) {
      var w = document.createElement("span"); w.className = "w";
      Array.from(word).forEach(function (c) {
        var s = document.createElement("span"); s.className = "ch"; s.textContent = c;
        w.appendChild(s); spans.push(s);
      });
      typed.appendChild(w);
      if (wi < arr.length - 1) typed.appendChild(document.createTextNode(" "));
    });
    return spans;
  }
  (async function loop() {
    for (var m = 0; ; m = (m + 1) % MESSAGES.length) {
      var spans = build(MESSAGES[m]);
      typed.classList.remove("fade"); bubble.classList.remove("pop"); void bubble.offsetWidth; bubble.classList.add("pop");
      await sleep(450); say.classList.add("talking");
      for (var i = 0; i < spans.length; i++) {
        spans[i].classList.add("on"); spans[i].after(caret);
        await sleep(/[,.!?]/.test(spans[i].textContent) ? 220 : 38);
      }
      say.classList.remove("talking"); await sleep(2400);
      typed.classList.add("fade"); await sleep(400);
    }
  })();
})();

document.body.classList.add('loaded');
</script>
