<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KodinganKita — Marketplace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><rect x='4' y='4' width='120' height='120' rx='30' fill='%230b1220'/><circle cx='64' cy='70' r='50' fill='%234f46e5' opacity='.28'/><g transform='rotate(-5 64 66)'><path d='M48 52V42Q48 26 64 26Q80 26 80 42V52' fill='none' stroke='%23a5b4fc' stroke-width='6' stroke-linecap='round'/><path d='M35 48H93L98 99Q99 106 92 106H36Q29 106 30 99Z' fill='%2334d399' stroke='%2334d399' stroke-width='2' stroke-linejoin='round'/><path d='M35 48H93L93.7 57H34.3Z' fill='%2310b981'/><circle cx='50' cy='52.5' r='3' fill='%230b1220'/><circle cx='78' cy='52.5' r='3' fill='%230b1220'/><g fill='none' stroke='%230b1220' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'><path d='M53 69L43 80L53 91'/><path d='M75 69L85 80L75 91'/><path d='M68 67L60 93'/></g></g><path transform='translate(99 33) scale(.8)' fill='%23ffe14d' d='M0-12L3.5-3.5L12 0L3.5 3.5L0 12L-3.5 3.5L-12 0L-3.5-3.5Z'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#4f46e5;--primary-hover:#4338ca;--primary-light:#eef2ff;--bg-body:#f8fafc;--bg-card:#ffffff;--text-main:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--success:#10b981;--warning:#f59e0b;--radius-sm:8px;--radius-md:14px;--radius-lg:24px;--radius-full:999px;--shadow-sm:0 1px 3px rgba(0,0,0,0.05);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}body{margin:0;font-family:var(--font);background:var(--bg-body);color:var(--text-main);padding-bottom:100px;}a{text-decoration:none;color:inherit}img{max-width:100%;display:block}button{font-family:inherit;cursor:pointer;border:none;background:none}
#splash-screen{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease}#splash-screen.hidden{opacity:0;pointer-events:none}.loading-bar{width:200px;height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:20px}.loading-bar-inner{width:50%;height:100%;background:var(--primary);border-radius:4px;animation:loadBar 1s infinite ease-in-out alternate}@keyframes loadBar{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.9);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.brand svg{width:34px;height:34px;border-radius:8px}.search-bar{flex:1;max-width:500px;position:relative;display:none}@media(min-width:640px){.search-bar{display:block}}.search-bar input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--border);border-radius:var(--radius-full);background:var(--bg-body);font-size:14px;outline:none}.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)}.btn-login{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius-full);font-weight:600;font-size:14px}.btn-login img{width:18px;height:18px}
.bottom-nav-container{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;z-index:50;pointer-events:none}.bottom-nav{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.3);box-shadow:0 10px 40px rgba(0,0,0,0.15);border-radius:var(--radius-full);display:flex;justify-content:space-around;padding:12px 24px;width:92%;max-width:450px;pointer-events:auto}.nav-item{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none}.nav-item.active{color:var(--primary);transform:translateY(-2px)}.nav-item .icon-wrap{width:24px;height:24px;display:flex;align-items:center;justify-content:center}.nav-item .icon-wrap iframe{width:100%;height:100%;border:none;pointer-events:none}.nav-item .icon-wrap svg{width:24px;height:24px}.nav-item span{font-size:10px;font-weight:700}
.container{max-width:1000px;margin:0 auto;padding:20px}.hero{text-align:center;padding:40px 20px 20px}.hero-title{font-size:32px;font-weight:800;margin:0 0 10px;letter-spacing:-1px}.hero-desc{color:var(--text-muted);font-size:15px;margin:0 auto 30px;max-width:500px}.mascot-box{width:100%;max-width:600px;height:220px;margin:0 auto 30px;background:var(--primary-light);border-radius:var(--radius-lg);overflow:hidden;display:flex;align-items:center;justify-content:center}.mascot-box iframe{width:100%;height:100%;border:none;pointer-events:none}.quick-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:400px;margin:0 auto}.quick-item{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:inherit}.quick-icon{width:64px;height:64px;background:#fff;border-radius:50%;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;overflow:hidden}.quick-icon iframe{width:100%;height:100%;border:none;border-radius:50%;pointer-events:none}.quick-label{font-size:12px;font-weight:600}
.section-title{font-size:20px;font-weight:800;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}.card{background:#fff;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;border:1px solid var(--border);text-decoration:none;color:inherit}.card-img{aspect-ratio:1;background:#f1f5f9;width:100%;display:flex;align-items:center;justify-content:center}.card-img img{width:100%;height:100%;object-fit:cover}.card-body{padding:14px;display:flex;flex-direction:column;flex:1}.card-title{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-price{font-size:15px;font-weight:800;color:var(--primary);margin-top:auto}
.loading{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}@keyframes spin{to{transform:rotate(360deg)}}.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);grid-column:1/-1}
</style>
</head>
<body>

<div id="splash-screen"><div class="loading-bar"><div class="loading-bar-inner"></div></div></div>

<header class="site">
  <a href="index.html" class="brand" id="brandLogo">KodinganKita</a>
  <div class="search-bar">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" placeholder="Cari produk..." onkeydown="if(event.key==='Enter') window.location.href='katalog.html?q='+this.value">
  </div>
  <button id="authBtn" class="btn-login" onclick="handleAuth()">Masuk</button>
</header>

<main>
  <div class="hero">
    <h1 class="hero-title" id="heroTitle">Loading...</h1>
    <p class="hero-desc" id="heroDesc">Memuat deskripsi...</p>
    <div class="mascot-box" id="mascotBox"></div>
    <div class="quick-menu" id="quickMenu"></div>
  </div>
  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 class="section-title" style="margin:0">Produk Terbaru</h2>
      <a href="katalog.html" style="font-size:14px;font-weight:600;color:var(--primary)">Lihat Semua</a>
    </div>
    <div class="grid" id="latestGrid"><div class="loading"></div></div>
  </div>
</main>

<div class="bottom-nav-container"><div class="bottom-nav" id="bottomNav"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8", authDomain: "mybro-9ba5f.firebaseapp.com", databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com", projectId: "mybro-9ba5f", storageBucket: "mybro-9ba5f.firebasestorage.app", messagingSenderId: "820948893264", appId: "1:820948893264:web:e564509a8fdc4c56335b55" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app); const auth = getAuth(app); const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

const DEFAULT_LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%"><rect x="4" y="4" width="120" height="120" rx="30" fill="#0b1220"/><circle cx="64" cy="70" r="50" fill="#4f46e5" opacity=".28"/><g transform="rotate(-5 64 66)"><path d="M48 52V42Q48 26 64 26Q80 26 80 42V52" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/><path d="M35 48H93L98 99Q99 106 92 106H36Q29 106 30 99Z" fill="#34d399" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/><path d="M35 48H93L93.7 57H34.3Z" fill="#10b981"/><circle cx="50" cy="52.5" r="3" fill="#0b1220"/><circle cx="78" cy="52.5" r="3" fill="#0b1220"/><g fill="none" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M53 69L43 80L53 91"/><path d="M75 69L85 80L75 91"/><path d="M68 67L60 93"/></g></g><path transform="translate(99 33) scale(.8)" fill="#ffe14d" d="M0-12L3.5-3.5L12 0L3.5 3.5L0 12L-3.5 3.5L-12 0L-3.5-3.5Z"/></svg>`;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupiah = n => "Rp" + Number(n||0).toLocaleString("id-ID");

let state = { user: null, settings: {}, products: {}, loaded: 0 };
function checkLoaded() { state.loaded++; if(state.loaded >= 3) { setTimeout(() => { document.getElementById('splash-screen').classList.add('hidden'); document.getElementById('splash-screen').remove(); renderPage(); }, 800); } }

function createIframe(code, round) { const i = document.createElement("iframe"); if(round) i.style.borderRadius="50%"; i.srcdoc=`<html><head><style>body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;pointer-events:none;}*{box-sizing:border-box;}</style></head><body>${code}</body></html>`; return i; }

window.handleAuth = async () => { if (state.user) { if(confirm("Keluar?")) await signOut(auth); } else { try { await signInWithPopup(auth, provider); } catch(e){ alert(e.message); } } };
onAuthStateChanged(auth, user => { state.user = user; const btn = document.getElementById('authBtn'); if(btn) btn.innerHTML = user ? `Keluar (${user.displayName.split(' ')[0]})` : 'Masuk'; });

onValue(ref(db, "settings/marketplace"), s => { state.settings = s.val() || {}; checkLoaded(); });
onValue(ref(db, "products"), s => { state.products = s.val() || {}; checkLoaded(); });
onValue(ref(db, "shops"), s => { checkLoaded(); });

function renderPage() {
  const s = state.settings;
  document.getElementById('brandLogo').innerHTML = `<div style="width:34px;height:34px;display:inline-block;vertical-align:middle;margin-right:8px;">${DEFAULT_LOGO}</div> ${esc(s.name || "KodinganKita")}`;
  document.getElementById('heroTitle').textContent = s.name || "KodinganKita";
  document.getElementById('heroDesc').textContent = s.description || "Marketplace Produk Digital Eksklusif.";

  if(s.mascot?.code) document.getElementById('mascotBox').appendChild(createIframe(s.mascot.code));

  const defaultMenus = [
    { label: "Katalog", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`, action: "katalog.html" },
    { label: "Cari", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>`, action: "katalog.html" },
    { label: "Jual", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>`, action: "profil.html" },
    { label: "Riwayat", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg>`, action: "riwayat.html" }
  ];
  const menus = (s.menuItems && s.menuItems.length > 0) ? s.menuItems : defaultMenus;
  document.getElementById('quickMenu').innerHTML = menus.slice(0,4).map((m, i) => `<a href="${esc(m.action)}" class="quick-item"><div class="quick-icon" id="menu-icon-${i}"></div><span class="quick-label">${esc(m.label)}</span></a>`).join("");
  menus.slice(0,4).forEach((m, i) => { if(m.code) document.getElementById(`menu-icon-${i}`).appendChild(createIframe(m.code, true)); });

  const defaultNavs = [
    { id: "home", label: "Beranda", href: "index.html", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>` },
    { id: "catalog", label: "Katalog", href: "katalog.html", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>` },
    { id: "history", label: "Riwayat", href: "riwayat.html", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path></svg>` },
    { id: "profile", label: "Profil", href: "profil.html", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>` }
  ];
  const navs = (s.bottomMenus && s.bottomMenus.length > 0) ? s.bottomMenus : defaultNavs;
  document.getElementById('bottomNav').innerHTML = navs.map(n => `<a href="${n.href}" class="nav-item ${n.href === 'index.html' ? 'active' : ''}"><div class="icon-wrap" id="nav-${n.id}">${n.code}</div><span>${n.label}</span></a>`).join("");
  navs.forEach(n => { if(n.code.includes('<style>')) { const w = document.getElementById(`nav-${n.id}`); if(w) { w.innerHTML=""; w.appendChild(createIframe(n.code, false)); } } });

  const latest = Object.entries(state.products).map(([id, p]) => ({id, ...p})).filter(p => p.status !== 'sold').sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 8);
  const grid = document.getElementById('latestGrid');
  grid.innerHTML = latest.length ? latest.map(p => `<a href="detail.html?id=${p.id}" class="card"><div class="card-img"><img src="${p.imageURLs?.[0] || 'https://placehold.co/400x400/f1f5f9/64748b?text=No+Image'}"></div><div class="card-body"><div class="card-title">${esc(p.title)}</div><div class="card-price">${rupiah(p.price)}</div></div></a>`).join("") : `<div class="empty-state">Belum ada produk.</div>`;
}
</script>
</body>
</html>
