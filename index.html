<style>
:root{--primary:#4f46e5;--primary-hover:#4338ca;--primary-light:#eef2ff;--bg-body:#f8fafc;--text-main:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--success:#10b981;--radius-md:14px;--radius-full:999px;--shadow-sm:0 1px 3px rgba(0,0,0,0.05);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--font);background:var(--bg-body);color:var(--text-main);padding-bottom:120px;opacity:0;transition:opacity 0.4s ease;}
body.loaded{opacity:1;}
a{text-decoration:none;color:inherit}img{max-width:100%;display:block}button{font-family:inherit;cursor:pointer;border:none;background:none}

/* === LOADING SCREEN PREMIUM === */
#page-loader{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease, visibility 0.5s;}
#page-loader.hidden{opacity:0;visibility:hidden;}
.loader-logo{width:80px;height:80px;animation:pulse 1.5s infinite;}
@keyframes pulse{0%{transform:scale(0.95);opacity:0.8}50%{transform:scale(1.05);opacity:1}100%{transform:scale(0.95);opacity:0.8}}
.loader-bar{width:160px;height:4px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:24px;}
.loader-bar-inner{width:50%;height:100%;background:var(--primary);border-radius:4px;animation:loadBar 1s infinite ease-in-out alternate;}
@keyframes loadBar{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}

header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.9);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.brand svg{width:34px;height:34px;border-radius:8px}
.search-bar{flex:1;max-width:500px;position:relative;display:none}@media(min-width:640px){.search-bar{display:block}}
.search-bar input{width:100%;padding:10px 16px 10px 40px;border:1px solid var(--border);border-radius:var(--radius-full);background:var(--bg-body);font-size:14px;outline:none}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted)}
.btn-login{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius-full);font-weight:600;font-size:14px}

.container{max-width:1000px;margin:0 auto;padding:20px}.hero{text-align:center;padding:40px 20px 20px}
.hero-title{font-size:32px;font-weight:800;margin:0 0 10px;letter-spacing:-1px}
.hero-desc{color:var(--text-muted);font-size:15px;margin:0 auto 30px;max-width:500px}
.mascot-box{width:100%;max-width:600px;height:220px;margin:0 auto 30px;background:var(--primary-light);border-radius:var(--radius-md);overflow:hidden;display:flex;align-items:center;justify-content:center}
.mascot-box iframe{width:100%;height:100%;border:none;pointer-events:none}
.quick-menu{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:400px;margin:0 auto}
.quick-item{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:inherit}
.quick-icon{width:64px;height:64px;background:#fff;border-radius:50%;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;overflow:hidden}
.quick-icon iframe{width:100%;height:100%;border:none;border-radius:50%;pointer-events:none}
.quick-label{font-size:12px;font-weight:600}

.section-title{font-size:20px;font-weight:800;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;border:1px solid var(--border);text-decoration:none;color:inherit}
.card-img{aspect-ratio:1;background:#f1f5f9;width:100%;display:flex;align-items:center;justify-content:center}.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:14px;display:flex;flex-direction:column;flex:1}.card-title{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card-price{font-size:15px;font-weight:800;color:var(--primary);margin-top:auto}
.loading-spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);grid-column:1/-1}

/* === NAVIGASI 3D (IPHONE DOCK) === */
:root { --ink:#1e1b4b; }
.nav { position:fixed; left:12px; right:12px; bottom:16px; background:#fff; border-radius:34px; padding:26px 8px 10px; display:flex; justify-content:space-around; box-shadow:0 10px 30px rgba(76,29,149,.2), inset 0 -3px 0 rgba(30,27,75,.05); z-index: 100; }
.item { position:relative; flex:1; border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; font:700 12px inherit; color:#94a3b8; padding:0; text-decoration: none; outline: none; }
.iw { position:relative; width:48px; height:48px; display:grid; place-items:center; }
.iw::before { content:""; position:absolute; inset:-2px; border-radius:50%; background:radial-gradient(circle at 50% 40%, var(--glow) 0%, transparent 70%); opacity:0; transform:scale(.5); transition:.3s; }
.icon { position:relative; width:46px; height:46px; overflow:visible; filter:grayscale(1) opacity(.5); transition:transform .35s cubic-bezier(.34,1.8,.64,1), filter .3s; }
.item.active { color:#4f46e5; }
.item.active .iw::before { opacity:.55; transform:scale(1.15); }
.item.active .icon { transform:translateY(-8px) scale(1.18); filter:drop-shadow(0 6px 5px rgba(30,27,75,.28)); }
.mascot { position:absolute; top:-40px; width:46px; height:34px; overflow:visible; opacity:0; transform:translateY(14px) scale(.7); transition:.35s cubic-bezier(.34,1.8,.64,1); pointer-events:none; }
.item.active .mascot { opacity:1; transform:none; animation:bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform:translateY(-3px) rotate(-3deg); } }
.item.active .tw { animation:tw 1.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes tw { 50% { transform:scale(.4) rotate(45deg); opacity:.5; } }

function checkLoaded() { state.loaded++; if(state.loaded >= 3) { setTimeout(() => { document.getElementById('page-loader').classList.add('hidden'); document.body.classList.add('loaded'); renderPage(); }, 400); } }
function createIframe(code, round) { const i = document.createElement("iframe"); if(round) i.style.borderRadius="50%"; i.srcdoc=`<html><head><style>body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;pointer-events:none;}*{box-sizing:border-box;}</style></head><body>${code}</body></html>`; return i; }

window.handleAuth = async () => { if (state.user) { if(confirm("Keluar?")) await signOut(auth); } else { try { await signInWithPopup(auth, provider); } catch(e){ alert(e.message); } } };
onAuthStateChanged(auth, user => { state.user = user; const btn = document.getElementById('authBtn'); if(btn) btn.innerHTML = user ? `Keluar (${user.displayName.split(' ')[0]})` : 'Masuk'; });

onValue(ref(db, "settings/marketplace"), s => { state.settings = s.val() || {}; checkLoaded(); });
onValue(ref(db, "products"), s => { state.products = s.val() || {}; checkLoaded(); });
onValue(ref(db, "shops"), s => { checkLoaded(); });

function renderPage() {
  const s = state.settings;
  document.getElementById('brandLogo').innerHTML = `<div style="width:34px;height:34px;display:inline-block;vertical-align:middle;margin-right:8px;">${DEFAULT_LOGO}</div> ${esc(s.name || "KodinganKita")}`;
  document.getElementById('heroTitle').textContent = s.name || "KodinganKita";
  document.getElementById('heroDesc').textContent = s.description || "Marketplace Produk Digital Eksklusif.";

  if(s.mascot?.code) document.getElementById('mascotBox').appendChild(createIframe(s.mascot.code));

  const defaultMenus = [
    { label: "Katalog", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`, action: "katalog.html" },
    { label: "Cari", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>`, action: "katalog.html" },
    { label: "Jual", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M12 4v16m8-8H4"/></svg>`, action: "profil.html" },
    { label: "Riwayat", code: `<svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/></svg>`, action: "riwayat.html" }
  ];
  const menus = (s.menuItems && s.menuItems.length > 0) ? s.menuItems : defaultMenus;
  document.getElementById('quickMenu').innerHTML = menus.slice(0,4).map((m, i) => `<a href="${esc(m.action)}" class="quick-item"><div class="quick-icon" id="menu-icon-${i}"></div><span class="quick-label">${esc(m.label)}</span></a>`).join("");
  menus.slice(0,4).forEach((m, i) => { if(m.code) document.getElementById(`menu-icon-${i}`).appendChild(createIframe(m.code, true)); });

  const latest = Object.entries(state.products).map(([id, p]) => ({id, ...p})).filter(p => p.status !== 'sold').sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).slice(0, 8);
  const grid = document.getElementById('latestGrid');
  grid.innerHTML = latest.length ? latest.map(p => `<a href="detail.html?id=${p.id}" class="card"><div class="card-img"><img src="${p.imageURLs?.[0] || 'https://placehold.co/400x400/f1f5f9/64748b?text=No+Image'}"></div><div class="card-body"><div class="card-title">${esc(p.title)}</div><div class="card-price">${rupiah(p.price)}</div></div></a>`).join("") : `<div class="empty-state">Belum ada produk.</div>`;
}
</script>
</body>
</html>
