<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Celoteh</title>
<style>
:root{--line:#e6ecea;--text:#111b21;--muted:#6b7b86;--acc:#12a96f;--acc2:#0a7d50;--mine:#dcf8e8;--sh:0 1px 2px rgba(16,40,30,.08);--chatbg:#f3f7f5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Segoe UI",Roboto,system-ui,-apple-system,Arial,sans-serif;color:var(--text);background:#fff;overflow:hidden;font-size:15px}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
img,video{display:block;max-width:100%}
.hidden{display:none!important}
.grow1{flex:1;min-width:0}
.muted{color:var(--muted)}
.pad{padding:12px 14px}
.pad2{padding:0 14px 10px}

/* Ikon SVG 3D: warna gradien dipasang lewat kelas CSS */
.ic{width:22px;height:22px;flex:none;fill:none;stroke:url(#gI);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;overflow:visible;filter:drop-shadow(0 1px 0 rgba(255,255,255,.9)) drop-shadow(0 2px 1.5px rgba(8,60,40,.25))}
.ic.mini{width:15px;height:15px;stroke-width:2.4}
.ic.xl{width:28px;height:28px}
.ic.big{width:36px;height:36px;stroke-width:1.7}
.ic.s{stroke:url(#gS)}
.ic.w{stroke:url(#gW)}
.ic.red{stroke:url(#gR)}
.ic.tg{stroke:url(#gS)}
.ic.tr{stroke:url(#gB)}
.ic.fill{fill:url(#gW)}
.ic.star{fill:url(#gStar);stroke:url(#gStar)}

.spinner{width:34px;height:34px;border-radius:50%;border:4px solid #d7f3e6;border-top-color:var(--acc);animation:spin .8s linear infinite}
.spinner.sm{width:16px;height:16px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}

/* Layar awal: splash & login */
.screen{position:fixed;inset:0;z-index:10;background:#fff}
#splash{display:flex;align-items:center;justify-content:center}
#login{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 35%,#effcf6 0,#fff 62%)}
.login-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;max-width:420px;width:100%}
.pipo{width:100%;height:100%;display:block}
.pipo canvas,.pipo svg{display:block;width:100%!important;height:100%!important}
.pipo-hero{width:min(300px,78vw);height:min(270px,38vh)}
.brand{font-size:44px;font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#0a7d50,#22c58b);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--muted);line-height:1.5}
.btn-google{margin-top:12px;display:flex;align-items:center;gap:12px;padding:12px 24px;border-radius:999px;background:#fff;border:1px solid #dfe7e4;box-shadow:0 4px 0 #dbe5e0,0 10px 20px rgba(0,0,0,.06);font-weight:700;transition:transform .08s,box-shadow .08s}
.btn-google:active{transform:translateY(3px);box-shadow:0 1px 0 #dbe5e0}
.gmark{font:800 20px Arial,sans-serif;color:#4285f4}
.err{color:#d93a3f;font-size:14px;min-height:18px}

/* Tata letak utama */
#app{height:100%;display:grid;grid-template-columns:68px 380px minmax(0,1fr)}
#rail{background:var(--chatbg);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
.rail-btn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}
.rail-btn.active{background:#fff;box-shadow:var(--sh)}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.side-head{height:60px;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;flex:none}
.side-head h2{flex:1;font-size:21px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(90deg,#0a7d50,#14b178);-webkit-background-clip:text;background-clip:text;color:transparent}
.side-head h2.plain{color:var(--text);background:none;-webkit-text-fill-color:initial}
.side-actions{display:flex;gap:2px}
#side-body{flex:1;display:flex;flex-direction:column;min-height:0}
.side-settings{flex:1;display:flex;flex-direction:column;min-height:0}
.searchbox{margin:6px 12px 8px;background:#f0f4f3;border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 12px;height:40px}
.searchbox input{flex:1;height:100%;font-size:14px;min-width:0}
.chips{display:flex;gap:8px;padding:0 12px 8px;overflow-x:auto}
.chip{padding:6px 13px;border-radius:999px;background:#f0f4f3;font-size:13px;white-space:nowrap;color:var(--muted);font-weight:600}
.chip.active{background:#dff7ea;color:var(--acc2);box-shadow:inset 0 -2px 0 #9fe3c2}
.chatlist{flex:1;overflow:auto}
.arch-row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;font-weight:600;color:var(--acc2)}
.arch-row b{margin-left:auto;color:var(--muted)}
.chat-item{display:flex;gap:12px;padding:10px 14px;cursor:pointer;align-items:center}
.chat-item:hover{background:#f5f8f7}
.chat-item.active{background:#e9f8f0}
.ci-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ci-top,.ci-bottom{display:flex;align-items:center;gap:6px;min-width:0}
.ci-name{flex:1;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-time{font-size:12px;color:var(--muted);flex:none}
.ci-time.unread{color:var(--acc2);font-weight:700}
.ci-prev{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-icons{display:flex;align-items:center;gap:4px;flex:none}
.badge{min-width:21px;height:21px;border-radius:11px;background:linear-gradient(#4ee6a0,#12a96f);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 0 #0a7d50}
.empty-list{padding:30px 22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty-list .pipo{width:150px;height:130px}
.av{width:48px;height:48px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 2px 4px rgba(0,0,0,.08)}
.av img{width:100%;height:100%;object-fit:cover}
.av.md{width:40px;height:40px;font-size:16px}
.av.sm{width:36px;height:36px;font-size:14px}
.av.xl{width:124px;height:124px;font-size:48px}
.gav{background:linear-gradient(145deg,#6ee7b0,#0f9f6b)}
.gav .ic{width:26px;height:26px;stroke:url(#gW)}
.avbtn{position:relative;border-radius:50%;flex:none}
.camb{position:absolute;right:0;bottom:0;width:40px;height:40px;border-radius:50%;background:linear-gradient(#5ee3a6,#14a86c);display:grid;place-items:center;box-shadow:0 3px 0 #0a7d50}
.camb .ic{width:20px;height:20px}

/* Area utama */
.main{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--chatbg);background-image:radial-gradient(rgba(18,169,111,.07) 1.2px,transparent 1.4px);background-size:22px 22px}
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:6px;background:linear-gradient(#fff,#f1faf6)}
#empty .pipo{width:min(300px,70vw);height:min(260px,36vh);margin-bottom:4px}
#empty h2{font-size:26px;font-weight:800}
#empty p{color:var(--muted)}
#chatview{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-head{height:60px;display:flex;align-items:center;gap:10px;padding:0 10px 0 12px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.head-info{flex:1;min-width:0;cursor:pointer}
.hname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub .online,.hsub .typing{color:var(--acc2);font-weight:600}
.selbar{height:56px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#eaf8f1;border-bottom:1px solid var(--line);flex:none;font-weight:700}
.chat-search{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.chat-search input{flex:1;background:#f0f4f3;border-radius:10px;height:38px;padding:0 12px}
.chat-search span{font-size:13px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:14px clamp(10px,5%,60px);display:flex;flex-direction:column;gap:2px;min-height:0}
.sep{align-self:center;background:#fff;color:var(--muted);font-size:12.5px;padding:5px 12px;border-radius:8px;box-shadow:var(--sh);margin:8px 0}
.sys{align-self:center;background:#fff8dc;color:#6b5a1f;font-size:12.5px;padding:5px 12px;border-radius:8px;margin:6px 0;box-shadow:var(--sh);text-align:center;max-width:80%}
.row{display:flex;align-items:flex-end;gap:6px;margin:1.5px 0;max-width:100%}
.row.mine{justify-content:flex-end}
.row.sel{background:rgba(18,169,111,.08);border-radius:10px}
.row.flash .bubble{animation:flash 1.2s}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(18,169,111,0)}30%{box-shadow:0 0 0 6px rgba(18,169,111,.35)}}
.chk{width:20px;height:20px;border-radius:50%;border:2px solid #9bb0a7;flex:none;margin:0 4px 6px}
.chk.on{background:var(--acc);border-color:var(--acc)}
.bubble{position:relative;max-width:min(560px,80%);padding:6px 9px 4px;border-radius:14px;background:#fff;box-shadow:0 1px 1.5px rgba(16,40,30,.12);min-width:96px}
.bubble::after{content:"";display:table;clear:both}
.row.mine .bubble{background:var(--mine);border-bottom-right-radius:4px}
.row.them .bubble{border-bottom-left-radius:4px}
.sname{font-size:13px;font-weight:700;margin-bottom:2px}
.fwd{font-size:12px;color:var(--muted);font-style:italic;display:flex;gap:4px;align-items:center;margin-bottom:3px}
.quote{border-left:4px solid var(--acc);background:rgba(18,169,111,.09);border-radius:8px;padding:5px 8px;margin-bottom:5px;cursor:pointer;font-size:13px;display:flex;flex-direction:column;min-width:0}
.quote b{color:var(--acc2);font-size:12.5px}
.quote span{color:#4a5b65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.38}
.txt code{background:#eef3f1;border-radius:4px;padding:0 4px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.txt a{color:#0a7bd3}
.deleted{font-style:italic;color:var(--muted);display:flex;gap:6px;align-items:center}
.img{max-width:300px;width:100%;max-height:340px;object-fit:cover;border-radius:10px;cursor:zoom-in}
.vid{max-width:300px;width:100%;border-radius:10px}
.file{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.035);border-radius:10px;padding:8px;min-width:230px;color:inherit;text-decoration:none}
.file small{color:var(--muted)}
.file b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.voice{display:flex;align-items:center;gap:10px;min-width:230px;padding:4px 2px;cursor:pointer}
.vplay{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#5ee3a6,#14a86c);box-shadow:0 3px 0 #0a7d50;flex:none}
.vplay .ic{stroke:url(#gW);width:20px;height:20px}
.vbar{flex:1;height:5px;background:#cfe7dc;border-radius:5px;position:relative;overflow:hidden}
.vfill{position:absolute;left:0;top:0;bottom:0;background:var(--acc);width:0}
.vtime{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.rx{display:inline-flex;gap:3px;background:#fff;border-radius:12px;padding:1px 6px;box-shadow:0 1px 2px rgba(0,0,0,.15);font-size:13px;margin:4px 0 2px}
.bmeta{float:right;margin:6px 0 0 10px;display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);line-height:1}
.tk{display:inline-flex}
.bmenu{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;opacity:0;transition:opacity .15s;box-shadow:0 1px 2px rgba(0,0,0,.15);z-index:1}
.bubble:hover .bmenu{opacity:1}
@media (hover:none){.bmenu{opacity:.9}}
.bmenu .ic{width:16px;height:16px}

/* Bilah balas, rekam, composer */
.replybar{display:flex;align-items:center;gap:10px;margin:0 10px;padding:8px 10px 8px 12px;background:#fff;border-left:4px solid var(--acc);border-radius:10px 10px 0 0;box-shadow:var(--sh);flex:none;font-size:14px}
.replybar span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70vw}
.replybar b{color:var(--acc2)}
.busy{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:13px;color:var(--acc2);background:#fff;flex:none}
#composer{flex:none;background:#fff;border-top:1px solid var(--line);display:flex;align-items:flex-end;gap:6px;padding:8px 10px}
#input{flex:1;min-width:0;resize:none;background:#fff;border:1px solid #dfe7e4;border-radius:14px;padding:10px 14px;max-height:140px;line-height:1.35;font-size:15px;outline:0}
#input:focus{border-color:#8fdcb9}
#recbar{display:none;flex:1;align-items:center;gap:10px;padding:0 6px;min-height:46px;font-weight:600}
#composer.recording #recbar{display:flex}
#composer.recording #input,#composer.recording #btn-emoji,#composer.recording #btn-attach{display:none}
.recdot{width:11px;height:11px;border-radius:50%;background:#ef4b50;animation:rec 1.2s infinite}
@keyframes rec{0%{box-shadow:0 0 0 0 rgba(239,75,80,.6)}100%{box-shadow:0 0 0 12px rgba(239,75,80,0)}}
#rectime{font-variant-numeric:tabular-nums}
.rechint{color:var(--muted);font-weight:500;font-size:13px}
.fab{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(#5ee3a6,#14a86c);box-shadow:0 4px 0 #0a7d50,0 8px 14px rgba(10,125,80,.3);transition:transform .08s,box-shadow .08s}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 #0a7d50}
.fab .ic{stroke:url(#gW);filter:drop-shadow(0 1px 1px rgba(0,0,0,.2))}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .15s}
.ib:hover{background:#eef5f2}
.ib:active{transform:scale(.94)}
.ib.sm{width:30px;height:30px}
.ib.sm .ic{width:18px;height:18px}
.back{display:none}

/* Tombol, input, dan pop-up */
.btn{padding:10px 18px;border-radius:12px;font-weight:700;background:#f0f4f3}
.btn.primary{background:linear-gradient(#5ee3a6,#14a86c);color:#fff;box-shadow:0 3px 0 #0a7d50}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #0a7d50}
.btn.danger{background:linear-gradient(#ff7a7e,#e5484d);color:#fff;box-shadow:0 3px 0 #a3141b}
.btn.link{background:none;padding:4px 6px;color:var(--acc2)}
.field{width:100%;padding:11px 14px;border:1px solid #dfe7e4;border-radius:12px;background:#fff}
.field:focus{border-color:#8fdcb9}
.flabel{font-size:13px;color:var(--acc2);font-weight:700;align-self:flex-start;margin-top:8px}
#overlay{position:fixed;inset:0;background:rgba(15,30,25,.35);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:18px;width:min(440px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden;animation:pop .18s ease-out}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line)}
.mhead h3{font-size:17px;flex:1}
.mbody{overflow:auto;flex:1;min-height:0}
.mfoot{padding:12px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.askp{padding:18px 18px 4px;line-height:1.5}
.plist{max-height:52vh;overflow:auto}
.urow{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
.urow:hover{background:#f5f8f7}
.urow small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{width:20px;height:20px;accent-color:var(--acc);flex:none}
.linkrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;color:var(--acc2);font-weight:700}
#pop{position:fixed;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;z-index:60;min-width:200px;animation:pop .12s ease-out}
.pop-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;width:100%;text-align:left;font-size:14.5px;white-space:nowrap}
.pop-item:hover{background:#f2f7f5}
.pop-item.danger{color:#d93a3f}
.pop-item .tile{width:36px;height:36px;border-radius:12px}
.reacts-row{display:flex;justify-content:space-between;padding:4px;background:#f6faf8;border-radius:999px;margin-bottom:4px}
.reacts-row button{font-size:22px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;transition:transform .1s}
.reacts-row button:hover{transform:scale(1.25)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:300px;max-height:260px;overflow:auto;padding:4px}
.emoji-grid button{font-size:22px;height:36px;border-radius:8px}
.emoji-grid button:hover{background:#eef5f2}
.tile{display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 3px 6px rgba(0,0,0,.15)}
.t-blue{background:linear-gradient(#7cc8ff,#2d7fe8)}
.t-green{background:linear-gradient(#5ee3a6,#14a86c)}
.t-violet{background:linear-gradient(#c9a1ff,#7d4fe0)}
.tile .ic{stroke:url(#gW);width:20px;height:20px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:70;display:flex;align-items:center;justify-content:center}
.lb img{max-width:94vw;max-height:88vh;border-radius:8px}
.lbtop{position:absolute;top:12px;right:12px;display:flex;gap:8px}
.lbtop .ib{background:rgba(255,255,255,.14)}
.lbtop .ic{stroke:url(#gW)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1f2d33;color:#fff;padding:10px 18px;border-radius:12px;z-index:90;box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:14px;max-width:90vw;text-align:center;animation:pop .2s ease-out}

/* Panel info (kanan) */
#info{position:absolute;top:0;right:0;bottom:0;width:360px;max-width:100%;background:#fff;border-left:1px solid var(--line);z-index:20;display:flex;flex-direction:column;box-shadow:-6px 0 18px rgba(0,0,0,.06)}
.info-body{overflow:auto;flex:1}
.info-card{display:flex;flex-direction:column;align-items:center;padding:24px 16px;gap:6px;border-bottom:8px solid var(--chatbg);text-align:center}
.info-card h2{font-size:21px;margin-top:6px}
.info-card p{color:var(--muted)}
.info-row{display:flex;align-items:center;gap:16px;padding:13px 20px;width:100%;text-align:left;font-size:15px}
.info-row:hover{background:#f5f8f7}
.info-row.danger{color:#d93a3f}
.gedit{display:flex;gap:8px;padding:12px 16px;align-items:center;border-bottom:8px solid var(--chatbg)}
.sect{padding:14px 20px 6px;color:var(--acc2);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.mem{display:flex;align-items:center;gap:12px;padding:8px 20px}
.mem small{display:block;color:var(--muted);font-size:13px}
.adm{font-size:12px;background:#dff7ea;color:var(--acc2);padding:2px 8px;border-radius:999px;font-weight:700}

/* Pengaturan */
.set-scroll{overflow:auto;flex:1;min-height:0}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 24px 16px;width:100%}
.prof .btn{margin-top:14px;width:100%}
.set-list{border-top:8px solid var(--chatbg)}
.set-foot{display:flex;flex-direction:column;align-items:center;padding:20px;color:var(--muted);font-size:13px}
.set-foot .pipo{width:140px;height:120px}

@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr)}
  #rail{display:none}
  .main{position:fixed;inset:0;z-index:15;display:none}
  #app.chat-open .main{display:flex}
  #app.chat-open .side{display:none}
  .back{display:grid}
  #info{width:100%}
}
</style>
</head>

  if (d.toDateString() === now.toDateString()) return "Hari ini";

}

  const d = new Date(ms), now = new Date(), yest = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return fmtTime(ms);
  if (d.toDateString() === yest.toDateString()) return "Kemarin";
  return d.toLocaleDateString("id-ID", { day: "2-digit", month: "2-digit", year: "2-digit" });

  const v = Math.max(0, Math.round(sec || 0));

  if (!m) return "";

let THREE = null;
async function mountPipo(host) {
  if (!host || host.dataset.mounted) return;
  host.dataset.mounted = "1";
  host.innerHTML = PIPO_SVG;
  try {
    THREE ||= await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
    const T = THREE;
    const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    host.replaceChildren(renderer.domElement);

    const scene = new T.Scene();
    const cam = new T.PerspectiveCamera(28, 1, 0.1, 100);
    cam.position.set(0, 0.6, 10.5);
    cam.lookAt(0, -0.2, 0);
    scene.add(new T.HemisphereLight(0xffffff, 0x7fb4ff, 1.35));
    const key = new T.DirectionalLight(0xffffff, 2.1); key.position.set(4, 6, 7); scene.add(key);
    const rim = new T.DirectionalLight(0x9fdcff, 1.1); rim.position.set(-6, 3, -4); scene.add(rim);

    const P = new T.Group();
    scene.add(P);
    const mat = (c, r = 0.35) => new T.MeshStandardMaterial({ color: c, roughness: r });
    const blob = (rad, m, s, p) => {
      const o = new T.Mesh(new T.SphereGeometry(rad, 48, 36), m);
      o.scale.set(...s);
      o.position.set(...p);
      return o;
    };
    const bodyM = mat(0x3b9bff, 0.32), whiteM = mat(0xffffff, 0.3), orangeM = mat(0xff9d1a, 0.45);
    const darkM = mat(0x132640, 0.25), pinkM = mat(0xff8fab, 0.5);

    P.add(blob(1.6, bodyM, [1, 0.95, 0.92], [0, 0, 0]));
    P.add(blob(1.05, whiteM, [1, 0.9, 0.42], [0, -0.35, 1.02]));
    P.add(blob(0.32, bodyM, [1, 1, 1], [0, 1.55, 0.05]));
    P.add(blob(0.22, bodyM, [1, 1, 1], [-0.34, 1.36, 0.2]));
    P.add(blob(0.22, bodyM, [1, 1, 1], [0.34, 1.36, 0.2]));

    const beak = new T.Mesh(new T.ConeGeometry(0.22, 0.5, 28), orangeM);
    beak.rotation.x = Math.PI / 2;
    beak.position.set(0, -0.2, 1.42);
    P.add(beak);

    P.add(blob(0.32, orangeM, [1.3, 0.5, 1.5], [-0.5, -1.5, 0.35]));
    P.add(blob(0.32, orangeM, [1.3, 0.5, 1.5], [0.5, -1.5, 0.35]));
    P.add(blob(0.17, pinkM, [1, 0.7, 0.5], [-0.95, -0.2, 1.12]));
    P.add(blob(0.17, pinkM, [1, 0.7, 0.5], [0.95, -0.2, 1.12]));

    const wingL = blob(0.5, bodyM, [0.42, 1, 0.62], [-1.5, -0.1, 0]);
    const wingR = blob(0.5, bodyM, [0.42, 1, 0.62], [1.5, -0.1, 0]);
    P.add(wingL, wingR);

    const eyes = [-0.55, 0.55].map(x => {
      const g = new T.Group();
      g.position.set(x, 0.3, 1.22);
      const pupil = blob(0.18, darkM, [1, 1, 0.8], [0, 0, 0.2]);
      const shine = blob(0.05, whiteM, [1, 1, 1], [0.07, 0.07, 0.36]);
      g.add(blob(0.36, whiteM, [1, 1.05, 0.7], [0, 0, 0]), pupil, shine);
      P.add(g);
      return { g, pupil, shine };
    });

    const cv = document.createElement("canvas");
    cv.width = cv.height = 128;
    const cx = cv.getContext("2d");
    const gr = cx.createRadialGradient(64, 64, 4, 64, 64, 64);
    gr.addColorStop(0, "rgba(20,70,140,.35)");
    gr.addColorStop(1, "rgba(20,70,140,0)");
    cx.fillStyle = gr;
    cx.fillRect(0, 0, 128, 128);
    const shadow = new T.Mesh(
      new T.PlaneGeometry(5, 2.2),
      new T.MeshBasicMaterial({ map: new T.CanvasTexture(cv), transparent: true, depthWrite: false })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = -2.25;
    scene.add(shadow);

    new ResizeObserver(() => {
      const w = host.clientWidth, h = host.clientHeight;
      if (w && h) {
        renderer.setSize(w, h, false);
        cam.aspect = w / h;
        cam.updateProjectionMatrix();
      }
    }).observe(host);

    const t0 = performance.now();
    let nextBlink = 2, blinkUntil = 0;
    const loop = now => {
      requestAnimationFrame(loop);
      if (!host.getClientRects().length) return;
      const t = (now - t0) / 1000;
      if (t > nextBlink) { blinkUntil = t + 0.14; nextBlink = t + 2.5 + Math.random() * 3; }
      P.position.y = Math.sin(t * 1.8) * 0.12;
      P.rotation.y += (pointer.x * 0.4 - P.rotation.y) * 0.06;
      P.rotation.x += (-pointer.y * 0.18 - P.rotation.x) * 0.06;
      wingL.rotation.z = 0.3 + Math.sin(t * 4) * 0.12;
      wingR.rotation.z = -0.3 - Math.sin(t * 4) * 0.12;
      for (const e of eyes) {
        e.pupil.position.set(pointer.x * 0.1, pointer.y * 0.08, 0.2);
        e.shine.position.set(pointer.x * 0.1 + 0.07, pointer.y * 0.08 + 0.07, 0.36);
        e.g.scale.y = t < blinkUntil ? 0.1 : 1;
      }
      renderer.render(scene, cam);
    };
    requestAnimationFrame(loop);
  } catch (err) {
    console.warn("Maskot 3D tidak tersedia, memakai SVG.", err);
    host.innerHTML = PIPO_SVG;
  }
}

/* ---------- Login & akun ---------- */
function showLogin() {
  $("#splash").classList.add("hidden");
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  mountPipo($("#login-pipo"));
}

$("#btn-google").onclick = async () => {
  $("#login-err").textContent = "";
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(e.code)) return;
    const msg = {
      "auth/popup-blocked": "Popup diblokir browser. Izinkan popup lalu coba lagi.",
      "auth/unauthorized-domain": "Domain ini belum ada di Authorized domains Firebase Auth.",
      "auth/operation-not-allowed": "Login Google belum diaktifkan di Firebase Auth."
    }[e.code] || e.message;
    $("#login-err").textContent = "Gagal masuk: " + msg;
  }
};

onAuthStateChanged(auth, async user => {
  if (!user) { S.me = null; showLogin(); return; }
  try {
    const base = {
      uid: user.uid,
      email: user.email || "",
      name: user.displayName || (user.email || "Pengguna").split("@")[0],
      photo: user.photoURL || ""
    };
    const uref = doc(db, "users", user.uid);
    const snap = await getDoc(uref);
    if (!snap.exists()) {
      await setDoc(uref, { ...base, about: "Hai, saya pakai Celoteh!", online: true, lastSeen: serverTimestamp() });
    } else {
      await updateDoc(uref, { online: true, lastSeen: serverTimestamp(), email: base.email });
    }
    S.me = base;
    loadPrefs();
    startApp();
  } catch (e) {
    toast("Gagal memuat akun: " + e.message, 5000);
  }
});

const prefsKey = () => "celoteh:" + S.me.uid;
function loadPrefs() {
  try {
    S.prefs = { pinned: [], archived: [], muted: [], cleared: {}, ...JSON.parse(localStorage.getItem(prefsKey()) || "{}") };
  } catch {
    S.prefs = { pinned: [], archived: [], muted: [], cleared: {} };
  }
}
function savePrefs() { localStorage.setItem(prefsKey(), JSON.stringify(S.prefs)); }

function startApp() {
  $("#splash").classList.add("hidden");
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  if (!S.booted) {
    S.booted = true;
    onSnapshot(query(collection(db, "users"), limit(500)), snap => {
      S.users = new Map(snap.docs.map(d => [d.id, { uid: d.id, ...d.data({ serverTimestamps: "estimate" }) }]));
      const me = S.users.get(S.me.uid);
      if (me) Object.assign(S.me, { name: me.name || S.me.name, photo: me.photo || "", about: me.about || "" });
      renderSide();
      renderHead();
      updateTicks();
      if (S.info) renderInfo();
    }, err => toast("Gagal memuat kontak: " + err.message, 5000));

    onSnapshot(query(collection(db, "chats"), where("members", "array-contains", S.me.uid)), snap => {
      S.chats = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data({ serverTimestamps: "estimate" }) }]));
      onChatsChanged();
    }, err => toast("Gagal memuat chat: " + err.message, 5000));

    mountPipo($("#empty-pipo"));
    setPresence(true);
    setInterval(tickUI, 3000);
    setInterval(() => { if (document.visibilityState === "visible") setPresence(true); }, 45000);
  }
  renderSide();
  renderHead();
}

/* ---------- Presence ---------- */
function setPresence(on) {
  if (!S.me) return;
  updateDoc(doc(db, "users", S.me.uid), { online: on, lastSeen: serverTimestamp() }).catch(() => {});
}
document.addEventListener("visibilitychange", () => {
  if (!S.me) return;
  if (document.visibilityState === "visible") {
    setPresence(true);
    if (S.activeId) { markRead(S.msgs); resetUnread(S.activeId); }
  } else {
    setPresence(false);
  }
});
addEventListener("beforeunload", () => setPresence(false));
function tickUI() {
  if (S.activeId) renderHeadSub();
  updateTicks();
}

/* ---------- Daftar chat, notifikasi, unread ---------- */
function onChatsChanged() {
  for (const c of S.chats.values()) {
    const key = c.lastMessageAt ? tsMs(c.lastMessageAt) : 0;
    const prev = S.seenLast.get(c.id);
    if (prev !== undefined && key > prev && c.lastMessage && c.lastMessage.senderId !== S.me.uid) incoming(c);
    S.seenLast.set(c.id, key);
  }
  if (S.activeId && !S.chats.has(S.activeId)) closeChat();
  resetUnread(S.activeId);
  renderSide();
  renderHead();
  if (S.info) renderInfo();
}

function resetUnread(cid) {
  const c = cid && S.chats.get(cid);
  if (!c || !c.unread?.[S.me.uid] || document.visibilityState !== "visible") return;
  updateDoc(doc(db, "chats", cid), { ["unread." + S.me.uid]: 0 }).catch(() => {});
}

let audioCtx = null;
function ping() {
  try {
    audioCtx ||= new AudioContext();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.26);
  } catch {}
}
function incoming(c) {
  if (S.prefs.muted.includes(c.id)) return;
  const info = chatInfo(c);
  const body = (c.type === "group" ? (c.lastMessage.senderName || "") + ": " : "") + briefOf(c.lastMessage);
  const hidden = document.visibilityState !== "visible";
  if (c.id !== S.activeId || hidden) ping();
  if (hidden && "Notification" in window && Notification.permission === "granted") {
    try { new Notification(info.name, { body, icon: info.photo || undefined }); } catch {}
  } else if (c.id !== S.activeId) {
    toast("💬 " + info.name + ": " + body);
  }
}

/* ---------- Membuka & menutup chat ---------- */
async function startDirect(uid) {
  const cid = ["d", ...[S.me.uid, uid].sort()].join("_");
  try {
    if (!S.chats.has(cid)) {
      await setDoc(doc(db, "chats", cid), {
        type: "direct",
        members: [S.me.uid, uid].sort(),
        createdAt: serverTimestamp(),
        lastMessage: null,
        unread: {},
        typing: {}
      });
    }
    closeModal();
    setSide("chats");
    openChat(cid);
  } catch (e) {
    toast("Gagal membuka chat: " + e.message, 5000);
  }
}

function openChat(cid) {
  if (S.recording) stopRec(true);
  S.activeId = cid;
  S.replyTo = null;
  S.editing = null;
  S.selecting = false;
  S.selected.clear();
  S.info = false;
  S.forceBottom = true;
  S.msgs = [];
  S.msgById = new Map();
  S.csearch = "";
  $("#csearch").value = "";
  $("#chat-search").classList.add("hidden");
  $("#msgs").innerHTML = "";
  setComposerText("");
  if (S.unsubMsgs) S.unsubMsgs();
  S.unsubMsgs = onSnapshot(
    query(collection(db, "chats", cid, "messages"), orderBy("createdAt", "desc"), limit(300)),
    snap => {
      if (S.activeId !== cid) return;
      S.msgs = snap.docs
        .map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }), _pending: d.metadata.hasPendingWrites }))
        .reverse();
      S.msgById = new Map(S.msgs.map(m => [m.id, m]));
      if (document.visibilityState === "visible") markRead(S.msgs);
      renderMessages();
    },
    err => toast("Gagal memuat pesan: " + err.message, 5000)
  );
  resetUnread(cid);
  renderSide();
  renderHead();
  renderInfo();
  setTimeout(() => $("#input").focus(), 60);
}

function closeChat() {
  if (S.recording) stopRec(true);
  S.activeId = null;
  S.msgs = [];
  S.msgById = new Map();
  S.info = false;
  S.selecting = false;
  S.selected.clear();
  if (S.unsubMsgs) { S.unsubMsgs(); S.unsubMsgs = null; }
  renderSide();
  renderHead();
  renderSelBar();
  renderInfo();
}

/* ---------- Pesan: tulis, tandai dibaca ---------- */
function markRead(msgs) {
  const cid = S.activeId;
  if (!cid) return;
  const todo = msgs
    .filter(m => m.senderId !== S.me.uid && m.type !== "system" && !(m.readBy || []).includes(S.me.uid) && !m._pending)
    .slice(-200);
  if (!todo.length) return;
  const b = writeBatch(db);
  for (const m of todo) b.update(doc(db, "chats", cid, "messages", m.id), { readBy: arrayUnion(S.me.uid) });
  b.commit().catch(() => {});
}

async function postMessage(cid, data, mref = doc(collection(db, "chats", cid, "messages")), members) {
  const list = members || S.chats.get(cid)?.members;
  if (!list) throw new Error("Chat tidak ditemukan");
  const clean = Object.fromEntries(Object.entries(data).filter(([, v]) => v !== undefined && v !== null));
  const b = writeBatch(db);
  b.set(mref, {
    senderId: S.me.uid,
    senderName: S.me.name,
    createdAt: serverTimestamp(),
    readBy: [S.me.uid],
    reactions: {},
    starredBy: [],
    hiddenFor: [],
    deleted: false,
    ...clean
  });
  const upd = {
    lastMessage: {
      id: mref.id,
      type: clean.type,
      text: clean.text || "",
      fileName: clean.fileName || "",
      duration: clean.duration || 0,
      senderId: S.me.uid,
      senderName: S.me.name,
      deleted: false
    },
    lastMessageAt: serverTimestamp(),
    ["typing." + S.me.uid]: 0
  };
  for (const u of list) if (u !== S.me.uid) upd["unread." + u] = increment(1);
  b.update(doc(db, "chats", cid), upd);
  await b.commit();
}

/* ---------- Render: sidebar & daftar chat ---------- */
function setSide(v) {
  S.side = v;
  renderSide(true);
}

function renderSide(force) {
  document.querySelectorAll("#rail [data-view]").forEach(b => {
    const on = b.dataset.view === S.side;
    b.classList.toggle("active", on);
    b.querySelector(".ic")?.classList.toggle("s", !on);
  });
  const settings = S.side === "settings";
  $("#sidehead").classList.toggle("hidden", settings);
  $("#side-body").classList.toggle("hidden", settings);
  $("#side-settings").classList.toggle("hidden", !settings);
  if (settings) {
    if (force || !$("#set-name")) renderSettings();
    return;
  }
  renderSideHead();
  renderChatList();
}

function renderSideHead() {
  const h = $("#sidehead");
  if (S.side === "archived") {
    h.innerHTML = `<button class="ib" data-sd="chats" title="Kembali">${ic("back", "s")}</button><h2 class="plain">Diarsipkan</h2>`;
    return;
  }
  h.innerHTML = `<button class="avbtn" data-sd="settings" title="Profil & pengaturan">${avatar(S.me.name, S.me.photo, "av sm")}</button>
    <h2>Celoteh</h2>
    <div class="side-actions">
      <button class="ib" data-sd="newchat" title="Chat baru">${ic("plus")}</button>
      <button class="ib" data-sd="sidemenu" title="Menu">${ic("more", "s")}</button>
    </div>`;
}

const activityMs = c => tsMs(c.lastMessageAt || c.createdAt);

function renderChatList() {
  const pin = S.prefs.pinned, arch = S.prefs.archived, archived = S.side === "archived";
  const q = S.query.trim().toLowerCase();
  let items = [...S.chats.values()].filter(c => arch.includes(c.id) === archived);
  if (S.filter === "unread") items = items.filter(c => (c.unread?.[S.me.uid] || 0) > 0);
  if (S.filter === "group") items = items.filter(c => c.type === "group");
  if (q) items = items.filter(c => chatInfo(c).name.toLowerCase().includes(q) || (c.lastMessage?.text || "").toLowerCase().includes(q));
  items.sort((a, b) => {
    if (!archived) {
      const pa = pin.includes(a.id), pb = pin.includes(b.id);
      if (pa !== pb) return pa ? -1 : 1;
    }
    return activityMs(b) - activityMs(a);
  });
  const archCount = arch.filter(id => S.chats.has(id)).length;
  let html = !archived && archCount && !q && S.filter === "all"
    ? `<button class="arch-row" data-sd="archived">${ic("archive", "s")}<span>Diarsipkan</span><b>${archCount}</b></button>`
    : "";
  html += items.map(itemHTML).join("");
  if (!items.length) {
    const title = q ? "Tidak ada hasil" : archived ? "Tidak ada chat diarsipkan" : "Belum ada chat";
    const sub = q ? "Coba kata kunci lain." : "Tekan + untuk mulai chat baru.";
    html += `<div class="empty-list"><div class="pipo">${PIPO_SVG}</div><b>${title}</b><span>${sub}</span></div>`;
  }
  $("#chatlist").innerHTML = html;
}

function itemHTML(c) {
  const i = chatInfo(c), unread = c.unread?.[S.me.uid] || 0, lm = c.lastMessage;
  let prefix = "";
  if (lm && lm.type !== "system") {
    prefix = lm.senderId === S.me.uid ? "Anda: " : c.type === "group" ? (lm.senderName || "") + ": " : "";
  }
  const preview = lm ? esc(prefix) + esc(briefOf(lm)) : "Belum ada pesan";
  const pinned = S.prefs.pinned.includes(c.id), muted = S.prefs.muted.includes(c.id);
  return `<div class="chat-item ${c.id === S.activeId ? "active" : ""}" data-cid="${c.id}">
    ${cav(c)}
    <div class="ci-body">
      <div class="ci-top">
        <span class="ci-name">${esc(i.name)}</span>
        <span class="ci-time ${unread ? "unread" : ""}">${lm ? fmtShort(activityMs(c)) : ""}</span>
      </div>
      <div class="ci-bottom">
        <span class="ci-prev">${preview}</span>
        <span class="ci-icons">${pinned ? ic("pin", "mini s") : ""}${muted ? ic("mute", "mini s") : ""}${unread ? `<span class="badge">${unread > 99 ? "99+" : unread}</span>` : ""}</span>
      </div>
    </div>
  </div>`;
}

/* ---------- Render: header chat ---------- */
function renderHead() {
  const c = S.chats.get(S.activeId);
  $("#app").classList.toggle("chat-open", !!c);
  $("#chatview").classList.toggle("hidden", !c);
  $("#empty").classList.toggle("hidden", !!c);
  if (!c) return;
  const i = chatInfo(c);
  $("#head-av").innerHTML = cav(c, "av md");
  $("#head-name").textContent = i.name;
  renderHeadSub();
  renderBars();
  renderSelBar();
}

function renderHeadSub() {
  const c = S.chats.get(S.activeId);
  if (!c) return;
  $("#head-sub").innerHTML = subHTML(c);
}

function subHTML(c) {
  const typers = Object.entries(c.typing || {})
    .filter(([u, t]) => u !== S.me.uid && t && Date.now() - t < 4000)
    .map(([u]) => (S.users.get(u)?.name || "Seseorang").split(" ")[0]);
  if (typers.length) {
    const text = c.type === "group" ? typers.join(", ") + " sedang mengetik…" : "sedang mengetik…";
    return `<span class="typing">${esc(text)}</span>`;
  }
  if (c.type === "group") {
    return esc(c.members.map(u => (S.users.get(u)?.name || "…").split(" ")[0]).join(", "));
  }
  const u = chatInfo(c).user;
  return isOnline(u) ? `<span class="online">online</span>` : esc(lastSeenText(u));
}

function renderBars() {
  const rb = $("#replybar");
  if (S.editing) {
    const m = S.msgById.get(S.editing);
    rb.innerHTML = `${ic("edit", "mini s")}<div class="grow1"><b>Edit pesan</b><span>${esc(briefOf(m))}</span></div><button class="ib sm" data-rb="x">${ic("close", "s")}</button>`;
    rb.classList.remove("hidden");
  } else if (S.replyTo) {
    rb.innerHTML = `${ic("reply", "mini s")}<div class="grow1"><b>${esc(S.replyTo.senderName)}</b><span>${esc(S.replyTo.text)}</span></div><button class="ib sm" data-rb="x">${ic("close", "s")}</button>`;
    rb.classList.remove("hidden");
  } else {
    rb.classList.add("hidden");
  }
}

function renderSelBar() {
  const bar = $("#selbar");
  const on = S.selecting && !!S.activeId && S.selected.size > 0;
  bar.classList.toggle("hidden", !on);
  if (!on) return;
  bar.innerHTML = `
    <button class="ib" data-sel="close" title="Batal">${ic("close", "s")}</button>
    <span>${S.selected.size} dipilih</span>
    <span class="grow1"></span>
    <button class="ib" data-sel="star" title="Bintangi">${ic("star", "star")}</button>
    <button class="ib" data-sel="fwd" title="Teruskan">${ic("forward", "s")}</button>
    <button class="ib" data-sel="del" title="Hapus untuk saya">${ic("trash", "red")}</button>`;
}

/* ---------- Render: pesan ---------- */
function visibleMsgs() {
  const cleared = S.prefs.cleared[S.activeId] || 0, q = S.csearch.toLowerCase();
  return S.msgs.filter(m =>
    !(m.hiddenFor || []).includes(S.me.uid) &&
    tsMs(m.createdAt) > cleared &&
    (!q || (m.text || "").toLowerCase().includes(q))
  );
}

function renderMessages() {
  const box = $("#msgs"), c = S.chats.get(S.activeId);
  if (!c) { box.innerHTML = ""; return; }
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  const prevTop = box.scrollTop;
  const list = visibleMsgs();
  S.stick = S.forceBottom || nearBottom;
  let html = "", lastDay = "";
  for (const m of list) {
    const ms = tsMs(m.createdAt), day = new Date(ms).toDateString();
    if (day !== lastDay) {
      html += `<div class="sep">${dayLabel(ms)}</div>`;
      lastDay = day;
    }
    html += rowHTML(m, c);
  }
  if (!list.length) {
    html = `<div class="sys">${S.csearch ? "Tidak ada pesan yang cocok" : "Belum ada pesan. Mulai percakapan 👋"}</div>`;
  }
  box.innerHTML = html;
  box.scrollTop = S.stick ? box.scrollHeight : prevTop;
  S.forceBottom = false;
  box.querySelectorAll(".img").forEach(im =>
    im.addEventListener("load", () => { if (S.stick) box.scrollTop = box.scrollHeight; }, { once: true })
  );
  $("#csearch-count").textContent = S.csearch ? list.length + " hasil" : "";
  updateTicks();
  updateVoiceUI();
}

function rowHTML(m, c) {
  if (m.type === "system") return `<div class="sys">${esc(m.text)}</div>`;
  const mine = m.senderId === S.me.uid, sel = S.selecting && S.selected.has(m.id);
  const sname = mine ? "Anda" : (S.users.get(m.senderId)?.name || m.senderName || "Pengguna");
  let inner = "";
  if (m.forwarded && !m.deleted) inner += `<div class="fwd">${ic("forward", "mini s")}Diteruskan</div>`;
  if (c.type === "group" && !mine) inner += `<div class="sname" style="color:hsl(${hue(sname)} 60% 38%)">${esc(sname)}</div>`;
  if (m.replyTo && !m.deleted) {
    inner += `<div class="quote" data-a="jump" data-mid="${esc(m.replyTo.id)}"><b>${esc(m.replyTo.senderName || "")}</b><span>${esc(m.replyTo.text || "")}</span></div>`;
  }
  inner += m.deleted
    ? `<div class="deleted">${ic("ban", "mini s")}Pesan ini telah dihapus</div>`
    : contentHTML(m);
  if (!m.deleted) {
    const counts = {};
    Object.values(m.reactions || {}).forEach(e => { counts[e] = (counts[e] || 0) + 1; });
    const keys = Object.keys(counts);
    if (keys.length) {
      inner += `<div class="rx">${keys.map(e => `<span>${e}${counts[e] > 1 ? " " + counts[e] : ""}</span>`).join("")}</div>`;
    }
  }
  const starred = (m.starredBy || []).includes(S.me.uid);
  inner += `<div class="bmeta">${m.editedAt && !m.deleted ? "<span>diedit</span>" : ""}${starred ? ic("star", "mini star") : ""}<span>${fmtTime(tsMs(m.createdAt))}</span>${mine ? `<span class="tk" data-tk="${m.id}"></span>` : ""}</div>`;
  return `<div class="row ${mine ? "mine" : "them"} ${sel ? "sel" : ""}" data-mid="${m.id}">
    ${S.selecting ? `<span class="chk ${sel ? "on" : ""}"></span>` : ""}
    <div class="bubble">
      <button class="bmenu" data-a="menu" data-mid="${m.id}" title="Menu pesan">${ic("chev", "s")}</button>
      ${inner}
    </div>
  </div>`;
}

function contentHTML(m) {
  const cap = m.text ? `<div class="txt">${fmtText(m.text)}</div>` : "";
  switch (m.type) {
    case "image":
      return `<img class="img" src="${esc(m.url)}" alt="" loading="lazy" data-a="img" data-url="${esc(m.url)}" data-name="${esc(m.fileName || "foto.jpg")}">${cap}`;
    case "video":
      return `<video class="vid" src="${esc(m.url)}" controls preload="metadata"></video>${cap}`;
    case "audio":
      return `<div class="voice" data-a="voice" data-voice="${esc(m.url)}">
        <button class="vplay" tabindex="-1">${ic("play", "w fill")}</button>
        <div class="vbar"><div class="vfill"></div></div>
        <span class="vtime">${fmtDur(m.duration)}</span>
      </div>`;
    case "file":
      return `<a class="file" href="${esc(m.url)}" target="_blank" rel="noopener" download="${esc(m.fileName || "file")}">
        ${ic("file", "big s")}
        <div style="min-width:0;flex:1"><b>${esc(m.fileName || "Dokumen")}</b><small>${fmtSize(m.size || 0)}</small></div>
        ${ic("download", "mini s")}
      </a>${cap}`;
    default:
      return `<div class="txt">${fmtText(m.text || "")}</div>`;
  }
}

function tickState(m, c) {
  if (m._pending) return "clock";
  const others = c.members.filter(u => u !== S.me.uid);
  if (others.length && others.every(u => (m.readBy || []).includes(u))) return "read";
  if (others.some(u => isOnline(S.users.get(u)))) return "delivered";
  return "sent";
}

function updateTicks() {
  const c = S.chats.get(S.activeId);
  if (!c) return;
  document.querySelectorAll("[data-tk]").forEach(el => {
    const m = S.msgById.get(el.dataset.tk);
    if (!m) return;
    const st = tickState(m, c);
    el.innerHTML = st === "clock" ? ic("clock", "mini tg")
      : st === "sent" ? ic("check", "mini tg")
      : ic("checks", "mini " + (st === "read" ? "tr" : "tg"));
  });
}

function jumpTo(mid) {

const VOICE = { audio: null, url: "" };
function toggleVoice(url) {
  if (!VOICE.audio || VOICE.url !== url) {
    VOICE.audio?.pause();
    VOICE.url = url;
    const a = new Audio(url);
    VOICE.audio = a;
    a.addEventListener("timeupdate", updateVoiceUI);
    a.addEventListener("play", updateVoiceUI);
    a.addEventListener("pause", updateVoiceUI);
    a.addEventListener("ended", () => { a.currentTime = 0; updateVoiceUI(); });
  }
  const cur = VOICE.audio;
  if (cur.paused) cur.play().catch(() => toast("Tidak bisa memutar audio"));
  else cur.pause();
}
function updateVoiceUI() {
  const a = VOICE.audio;
  document.querySelectorAll("[data-voice]").forEach(el => {
    const on = !!a && el.dataset.voice === VOICE.url;
    const playing = on && !a.paused;
    el.querySelector(".vplay").innerHTML = ic(playing ? "pause" : "play", "w fill");
    el.querySelector(".vfill").style.width = on && a.duration ? (a.currentTime / a.duration) * 100 + "%" : "0%";
  });
}

async function msgAction(act, m, v) {
  if (!m || !S.activeId) return;
  const mine = m.senderId === S.me.uid;
  try {
    switch (act) {
      case "react": {
        const cur = m.reactions?.[S.me.uid];
        await updateDoc(msgRef(m.id), { ["reactions." + S.me.uid]: cur === v ? deleteField() : v });
        break;
      }
      case "reply": setReply(m); break;
      case "copy":
        await navigator.clipboard.writeText(m.text || "");
        toast("Pesan disalin");
        break;
      case "forward": openForward([m.id]); break;
      case "edit": startEdit(m); break;
      case "star": {
        const on = (m.starredBy || []).includes(S.me.uid);
        await updateDoc(msgRef(m.id), { starredBy: on ? arrayRemove(S.me.uid) : arrayUnion(S.me.uid) });
        break;
      }
      case "select":
        S.selecting = true;
        S.selected = new Set([m.id]);
        renderSelBar();
        renderMessages();
        break;
      case "delme":
        await updateDoc(msgRef(m.id), { hiddenFor: arrayUnion(S.me.uid) });
        break;
      case "delall": {
        if (!mine) return;
        await updateDoc(msgRef(m.id), { deleted: true, text: "", url: deleteField(), fileName: deleteField() });
        if (S.chats.get(S.activeId)?.lastMessage?.id === m.id) {
          updateDoc(doc(db, "chats", S.activeId), { "lastMessage.deleted": true }).catch(() => {});
        }
        break;
      }
    }
  } catch (e) {
    toast("Gagal: " + e.message, 4000);
  }
}

function toggleSelect(mid) {
  if (S.selected.has(mid)) S.selected.delete(mid);
  else S.selected.add(mid);
  if (!S.selected.size) S.selecting = false;

  renderMessages();
}
function clearSelection() {
  S.selecting = false;

/* ---------- Rekam pesan suara ---------- */
let rec = null, recStart = 0, recUi = 0;

async function startRec() {
  if (!S.activeId) return toast("Pilih chat dulu");
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === "undefined") {
    return toast("Browser ini belum mendukung rekaman suara");
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch {
    return toast("Izin mikrofon ditolak");
  }
  const r = new MediaRecorder(stream), chunks = [];
  r.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  r.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    if (r.cancelled) return;
    const dur = Math.max(1, Math.round((Date.now() - recStart) / 1000));
    sendVoice(new Blob(chunks, { type: r.mimeType || "audio/webm" }), dur);
  };
  r.start(250);
  rec = r;
  recStart = Date.now();
  S.recording = true;
  $("#rectime").textContent = "0:00";
  setRecUI(true);
}

function stopRec(cancel) {
  if (!rec) return;
  const r = rec;
  rec = null;
  S.recording = false;
  r.cancelled = cancel;
  setRecUI(false);
  if (r.state !== "inactive") r.stop();
}

function setRecUI(on) {
  $("#composer").classList.toggle("recording", on);
  clearInterval(recUi);
  if (on) {
    recUi = setInterval(() => { $("#rectime").textContent = fmtDur((Date.now() - recStart) / 1000); }, 250);
  }
  updateSendBtn();
}

/* ---------- Kirim media ---------- */
async function uploadAndSend(cid, mref, blob, name, mime, extra) {
  setBusy("Mengirim…");
  try {
    const snap = await uploadBytes(ref(storage, `chats/${cid}/${name}`), blob, { contentType: mime });
    const url = await getDownloadURL(snap.ref);
    await postMessage(cid, { ...extra, url, mime, size: blob.size, replyTo: takeReply() }, mref);
  } catch (e) {
    toast("Gagal mengirim: " + e.message, 4000);
  } finally {
    setBusy("");
  }
}

async function sendVoice(blob, dur) {
  const cid = S.activeId;
  if (!cid) return;
  const mref = doc(collection(db, "chats", cid, "messages"));
  const mime = blob.type.split(";")[0] || "audio/webm";
  const ext = mime.includes("ogg") ? "ogg" : mime.includes("mp4") ? "m4a" : "webm";
  await uploadAndSend(cid, mref, blob, `${mref.id}.${ext}`, mime, {
    type: "audio", duration: dur, fileName: "Pesan suara", text: ""
  });
}

async function sendFile(file) {
  const cid = S.activeId;
  if (!cid || !file) return;
  if (file.size > 25 * 1024 * 1024) return toast("Ukuran maksimal 25 MB");
  const type = file.type.startsWith("image/") ? "image"
    : file.type.startsWith("video/") ? "video"
    : file.type.startsWith("audio/") ? "audio" : "file";
  const mref = doc(collection(db, "chats", cid, "messages"));
  const safe = file.name.replace(/[^\w.-]+/g, "_");
  await uploadAndSend(cid, mref, file, `${mref.id}_${safe}`, file.type || "application/octet-stream", {
    type, fileName: file.name, text: "", duration: 0
  });
}

/* ---------- Pop-up kecil (menu pesan, emoji, lampiran, menu chat) ---------- */
function showPop(kind, html, anchor, mid = "", above = true) {
  closePop();
  const p = document.createElement("div");
  p.id = "pop";
  p.dataset.kind = kind;
  p.innerHTML = html;
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect(), w = p.offsetWidth, h = p.offsetHeight;
  const x = Math.min(Math.max(8, r.right - w), innerWidth - w - 8);
  let y = above ? r.top - h - 8 : r.bottom + 8;
  if (y < 8) y = Math.min(r.bottom + 8, innerHeight - h - 8);
  if (y + h > innerHeight - 8) y = innerHeight - h - 8;
  p.style.left = x + "px";
  p.style.top = Math.max(8, y) + "px";
  p.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const ds = { ...b.dataset };
    closePop();
    popAction(kind, ds, mid);
  });
}
function closePop() { document.getElementById("pop")?.remove(); }

function popAction(kind, ds, mid) {
  if (kind === "msg") return msgAction(ds.pa, S.msgById.get(mid), ds.v);
  if (kind === "emoji") return insertAtCursor(ds.e);
  if (kind === "attach") {
    const map = { media: "#fileMedia", cam: "#fileCam", doc: "#fileDoc" };
    return $(map[ds.pt] || "#fileMedia").click();
  }
  if (kind === "chat") return chatAction(ds.ca);
  if (kind === "side") return sideAction(ds.sd);
}

/* ---------- Modal ---------- */
function modal(title, body, foot = "", setup) {
  const o = $("#overlay");
  o.innerHTML = `<div class="modal">
    <div class="mhead"><button class="ib" data-close title="Tutup">${ic("close", "s")}</button><h3>${esc(title)}</h3></div>
    <div class="mbody">${body}</div>
    ${foot ? `<div class="mfoot">${foot}</div>` : ""}
  </div>`;
  o.classList.remove("hidden");
  o.onclick = e => {
    if (e.target === o || e.target.closest("[data-close]")) closeModal();
  };
  setup?.(o.querySelector(".modal"));
}
function closeModal() {
  const o = $("#overlay");
  o.classList.add("hidden");
  o.innerHTML = "";
  o.onclick = null;
  const fn = S.modalClose;
  S.modalClose = null;
  fn?.();
}

function ask(title, text, okLabel = "Ya", danger = false) {
  return new Promise(resolve => {
    modal(title,
      `<p class="askp">${esc(text)}</p>`,
      `<button class="btn" data-ans="0">Batal</button><button class="btn ${danger ? "danger" : "primary"}" data-ans="1">${esc(okLabel)}</button>`,
      box => {
        box.addEventListener("click", e => {
          const b = e.target.closest("[data-ans]");
          if (!b) return;
          resolve(b.dataset.ans === "1");
          closeModal();
        });
        S.modalClose = () => resolve(false);
      });
  });
}

function contacts() {

    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));
}

function pickUsers(title, excluded, okLabel, withName) {
  return new Promise(resolve => {
    const picked = new Set();
    modal(title,
      `${withName ? `<div class="pad"><input id="pk-name" class="field" maxlength="60" placeholder="Nama grup"></div>` : ""}
       <div class="pad2"><input id="pk-q" class="field" placeholder="Cari kontak"></div>
       <div id="pk-list" class="plist"></div>`,
      `<button class="btn" data-close>Batal</button><button class="btn primary" id="pk-ok">${esc(okLabel)}</button>`,
      box => {
        const list = box.querySelector("#pk-list"), q = box.querySelector("#pk-q");
        const draw = () => {
          const s = q.value.trim().toLowerCase();
          const users = contacts().filter(u => !excluded.includes(u.uid) && (u.name + " " + (u.email || "")).toLowerCase().includes(s));
          list.innerHTML = users.map(u => `<label class="urow">${avatar(u.name, u.photo, "av sm")}
              <div class="grow1"><b>${esc(u.name)}</b><small>${esc(u.email || "")}</small></div>
              <input type="checkbox" class="cb" value="${esc(u.uid)}" ${picked.has(u.uid) ? "checked" : ""}></label>`).join("")
            || `<p class="pad muted">Tidak ada kontak.</p>`;
        };
        q.addEventListener("input", draw);
        list.addEventListener("change", e => {
          if (!e.target.classList.contains("cb")) return;
          if (e.target.checked) picked.add(e.target.value);
          else picked.delete(e.target.value);
        });
        box.querySelector("#pk-ok").addEventListener("click", () => {
          const name = withName ? box.querySelector("#pk-name").value.trim() : "";
          if (withName && !name) return toast("Isi nama grup dulu");
          if (!picked.size) return toast("Pilih minimal satu kontak");
          resolve({ ids: [...picked], name });
          closeModal();
        });
        draw();
        S.modalClose = () => resolve(null);
      });
  });
}

function newChatModal() {
  modal("Chat baru",
    `<div class="pad2" style="padding-top:12px"><input id="nc-q" class="field" placeholder="Cari nama atau email"></div>
     <div id="nc-list" class="plist"></div>
     <button class="linkrow" id="nc-group">${ic("users", "s")}Grup baru</button>`,
    "",
    box => {
      const list = box.querySelector("#nc-list");
      const draw = () => {
        const s = box.querySelector("#nc-q").value.trim().toLowerCase();
        const users = contacts().filter(u => (u.name + " " + (u.email || "")).toLowerCase().includes(s));
        list.innerHTML = users.map(u => `<div class="urow" data-uid="${esc(u.uid)}">
            ${avatar(u.name, u.photo, "av sm")}
            <div class="grow1"><b>${esc(u.name)}</b><small>${esc(isOnline(u) ? "online" : (u.about || u.email || ""))}</small></div>
          </div>`).join("")
          || `<p class="pad muted">Belum ada kontak lain. Minta temanmu masuk ke Celoteh dulu.</p>`;
      };
      box.querySelector("#nc-q").addEventListener("input", draw);
      list.addEventListener("click", e => {
        const r = e.target.closest("[data-uid]");
        if (r) startDirect(r.dataset.uid);
      });
      box.querySelector("#nc-group").addEventListener("click", () => {
        closeModal();
        createGroupFlow();
      });
      draw();
    });
}

async function createGroupFlow() {
  const r = await pickUsers("Grup baru", [], "Buat", true);
  if (!r) return;
  const gref = doc(collection(db, "chats"));
  const members = [S.me.uid, ...r.ids];
  try {
    await setDoc(gref, {
      type: "group", name: r.name, photo: "", members,
      admins: [S.me.uid], createdBy: S.me.uid, createdAt: serverTimestamp(),
      lastMessage: null, unread: {}, typing: {}
    });
    await postMessage(gref.id, { type: "system", text: `${S.me.name} membuat grup "${r.name}"` }, undefined, members);
    setSide("chats");
    openChat(gref.id);
  } catch (e) {
    toast("Gagal membuat grup: " + e.message, 4000);
  }
}

/* ---------- Info chat & aksi chat ---------- */
function toggleIn(arr, v) {
  const i = arr.indexOf(v);
  if (i >= 0) arr.splice(i, 1);
  else arr.push(v);
}

async function chatAction(act) {
  const c = S.chats.get(S.activeId);
  if (!c) return;
  const cid = c.id, P = S.prefs;
  if (act === "info") { S.info = !S.info; return renderInfo(); }
  if (act === "search") return openChatSearch();
  if (act === "leave") return leaveGroup();
  if (act === "clear") {
    const ok = await ask("Bersihkan chat", "Pesan di chat ini hanya disembunyikan untuk kamu.", "Bersihkan", true);
    if (!ok) return;
    P.cleared[cid] = Date.now();
    savePrefs();
    return renderMessages();
  }
  if (act === "mute") toggleIn(P.muted, cid);
  if (act === "pin") {
    if (!P.pinned.includes(cid) && P.pinned.length >= 3) return toast("Maksimal 3 chat disematkan");
    toggleIn(P.pinned, cid);
  }
  if (act === "arch") toggleIn(P.archived, cid);
  savePrefs();
  renderSide();
  renderHead();
  renderInfo();
}

function renderInfo() {
  const el = $("#info"), c = S.chats.get(S.activeId);
  if (!S.info || !c) {
    el.classList.add("hidden");
    el.innerHTML = "";
    return;
  }
  if (el.contains(document.activeElement)) return;
  el.classList.remove("hidden");
  const i = chatInfo(c), P = S.prefs, id = c.id;
  const isGroup = c.type === "group";
  const isAdmin = (c.admins || []).includes(S.me.uid);
  const muted = P.muted.includes(id), pinned = P.pinned.includes(id), arch = P.archived.includes(id);
  const members = c.members.map(u => S.users.get(u) || { uid: u, name: "Pengguna" });
  el.innerHTML = `
    <header class="chat-head">
      <button class="ib" data-close-info title="Tutup">${ic("close", "s")}</button>
      <h3 style="font-size:17px">${isGroup ? "Info grup" : "Info kontak"}</h3>
    </header>
    <div class="info-body">
      <div class="info-card">
        ${cav(c, "av xl")}
        <h2>${esc(i.name)}</h2>
        <p>${isGroup ? c.members.length + " anggota" : esc(i.user?.email || "")}</p>
        ${!isGroup && i.user?.about ? `<p>${esc(i.user.about)}</p>` : ""}
      </div>
      ${isGroup && isAdmin ? `<div class="gedit"><input id="gname" class="field" maxlength="60" value="${esc(i.name)}"><button class="btn primary" data-i="gname">Simpan</button></div>` : ""}
      <button class="info-row" data-i="mute">${ic("mute", "s")}${muted ? "Aktifkan notifikasi" : "Bisukan notifikasi"}</button>
      <button class="info-row" data-i="pin">${ic("pin", "s")}${pinned ? "Lepas sematan" : "Sematkan chat"}</button>
      <button class="info-row" data-i="arch">${ic("archive", "s")}${arch ? "Keluarkan dari arsip" : "Arsipkan chat"}</button>
      <button class="info-row" data-i="clear">${ic("trash", "red")}Bersihkan chat</button>
      ${isGroup ? `<button class="info-row danger" data-i="leave">${ic("logout", "red")}Keluar dari grup</button>` : ""}
      ${isGroup ? `
        <div class="sect"><span>${c.members.length} anggota</span>${isAdmin ? `<button class="btn link" data-i="addm">+ Tambah</button>` : ""}</div>
        ${members.map(m => `<div class="mem">${avatar(m.name, m.photo, "av sm")}
            <div class="grow1"><b>${esc(m.name)}${m.uid === S.me.uid ? " (Anda)" : ""}</b><small>${esc(isOnline(m) ? "online" : lastSeenText(m))}</small></div>
            ${(c.admins || []).includes(m.uid) ? `<span class="adm">Admin</span>` : ""}
          </div>`).join("")}` : ""}
    </div>`;
  el.onclick = e => {
    const b = e.target.closest("[data-i],[data-close-info]");
    if (!b) return;
    if (b.dataset.closeInfo !== undefined) { S.info = false; return renderInfo(); }
    const a = b.dataset.i;
    if (a === "gname") return renameGroup();
    if (a === "addm") return addMembers();
    chatAction(a);
  };
}

async function renameGroup() {
  const c = S.chats.get(S.activeId), name = $("#gname")?.value.trim();
  if (!c || !name) return;
  try {
    await updateDoc(doc(db, "chats", c.id), { name });
    postMessage(c.id, { type: "system", text: `${S.me.name} mengganti nama grup menjadi "${name}"` }).catch(() => {});
    toast("Nama grup diperbarui");
  } catch (e) {
    toast("Gagal: " + e.message, 4000);
  }
}

async function addMembers() {
  const c = S.chats.get(S.activeId);
  if (!c) return;
  const r = await pickUsers("Tambah anggota", c.members, "Tambah", false);
  if (!r || !r.ids.length) return;
  try {
    await updateDoc(doc(db, "chats", c.id), { members: arrayUnion(...r.ids) });
    const names = r.ids.map(id => S.users.get(id)?.name || "Pengguna").join(", ");
    await postMessage(c.id, { type: "system", text: `${S.me.name} menambahkan ${names}` });
  } catch (e) {
    toast("Gagal: " + e.message, 4000);
  }
}

async function leaveGroup() {
  const c = S.chats.get(S.activeId);
  if (!c) return;
  const ok = await ask("Keluar grup", `Keluar dari grup "${chatInfo(c).name}"?`, "Keluar", true);
  if (!ok) return;
  const rest = c.members.filter(u => u !== S.me.uid);
  let admins = (c.admins || []).filter(u => u !== S.me.uid);
  if (!admins.length && rest.length) admins = [rest[0]];
  try {
    await postMessage(c.id, { type: "system", text: `${S.me.name} keluar dari grup` });
    await updateDoc(doc(db, "chats", c.id), { members: rest, admins });
  } catch (e) {
    toast("Gagal keluar: " + e.message, 4000);
    return;
  }
  closeChat();
}

/* ---------- Pengaturan & aksi sidebar ---------- */
function renderSettings() {
  const u = S.users.get(S.me.uid) || S.me;
  $("#side-settings").innerHTML = `
    <header class="side-head"><button class="ib" data-sd="chats" title="Kembali">${ic("back", "s")}</button><h2 class="plain">Pengaturan</h2></header>
    <div class="set-scroll">
      <div class="prof">
        <button class="avbtn" data-sd="avatar" title="Ganti foto profil">${avatar(u.name, u.photo, "av xl")}<span class="camb">${ic("camera", "w")}</span></button>
        <label class="flabel">Nama</label>
        <input id="set-name" class="field" maxlength="40" value="${esc(u.name || "")}">
        <label class="flabel">Info</label>
        <input id="set-about" class="field" maxlength="120" value="${esc(u.about || "")}">
        <label class="flabel">Email</label>
        <input class="field" value="${esc(u.email || S.me.email || "")}" disabled>
        <button class="btn primary" data-sd="save">Simpan profil</button>
      </div>
      <div class="set-list">
        <button class="info-row" data-sd="notif">${ic("bell")}Aktifkan notifikasi desktop</button>
        <button class="info-row" data-sd="archived">${ic("archive")}Chat diarsipkan</button>
        <button class="info-row danger" data-sd="logout">${ic("logout", "red")}Keluar</button>
      </div>
      <div class="set-foot"><div class="pipo">${PIPO_SVG}</div><p>Celoteh · versi web</p></div>
    </div>`;
}

async function saveProfile() {
  const name = $("#set-name").value.trim(), about = $("#set-about").value.trim();
  if (!name) return toast("Nama tidak boleh kosong");
  try {
    await updateDoc(doc(db, "users", S.me.uid), { name, about });
    toast("Profil disimpan");
  } catch (e) {
    toast("Gagal menyimpan: " + e.message, 4000);
  }
}

async function changeAvatar(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) return toast("Foto maksimal 5 MB");
  toast("Mengunggah foto profil…", 4000);
  try {
    const snap = await uploadBytes(ref(storage, `avatars/${S.me.uid}/profile`), file, { contentType: file.type });
    const url = await getDownloadURL(snap.ref);
    await updateDoc(doc(db, "users", S.me.uid), { photo: url });
    toast("Foto profil diperbarui");
  } catch (e) {
    toast("Gagal mengunggah: " + e.message, 4000);
  }
}

async function toggleNotif() {
  if (!("Notification" in window)) return toast("Browser tidak mendukung notifikasi");
  if (Notification.permission === "granted") return toast("Notifikasi sudah aktif");
  const p = await Notification.requestPermission();
  toast(p === "granted" ? "Notifikasi diaktifkan" : "Notifikasi tidak diizinkan");
}

async function logout() {
  const ok = await ask("Keluar", "Keluar dari Celoteh di perangkat ini?", "Keluar", true);
  if (!ok) return;
  setPresence(false);
  await signOut(auth);
  location.reload();
}

function sideAction(v) {
  if (v === "settings") return setSide("settings");
  if (v === "chats") return setSide("chats");
  if (v === "archived") return setSide("archived");
  if (v === "newchat") return newChatModal();
  if (v === "newgroup") return createGroupFlow();
  if (v === "save") return saveProfile();
  if (v === "avatar") return $("#fileAvatar").click();
  if (v === "notif") return toggleNotif();
  if (v === "logout") return logout();
}

/* ---------- Pemasangan event ---------- */
$("#side").addEventListener("click", e => {
  const ci = e.target.closest("[data-cid]");
  if (ci) return openChat(ci.dataset.cid);
  const b = e.target.closest("[data-sd]");
  if (!b) return;
  if (b.dataset.sd === "sidemenu") return openSideMenu(b);
  sideAction(b.dataset.sd);
});
document.querySelectorAll("#rail [data-view]").forEach(b => b.addEventListener("click", () => setSide(b.dataset.view)));
document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
  S.filter = ch.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("active", x === ch));
  renderChatList();
}));
$("#q").addEventListener("input", e => { S.query = e.target.value; renderChatList(); });

$("#btn-back").onclick = () => closeChat();
$("#btn-info").onclick = () => chatAction("info");
$("#btn-search").onclick = () => openChatSearch();
$("#btn-cmenu").onclick = e => openChatMenu(e.currentTarget);
$("#csearch-close").onclick = () => closeChatSearch();
$("#csearch").addEventListener("input", e => { S.csearch = e.target.value; renderMessages(); });

$("#replybar").addEventListener("click", e => {
  if (!e.target.closest("[data-rb]")) return;
  cancelPending();
});

$("#msgs").addEventListener("click", e => {
  const a = e.target.closest("[data-a]");
  if (a) {
    const act = a.dataset.a;
    if (act === "menu") { e.stopPropagation(); return openMsgMenu(S.msgById.get(a.dataset.mid), a); }
    if (act === "img") return lightbox(a.dataset.url, a.dataset.name);
    if (act === "voice") return toggleVoice(a.dataset.voice);
    if (act === "jump") return jumpTo(a.dataset.mid);
  }
  const row = e.target.closest(".row");
  if (S.selecting && row) toggleSelect(row.dataset.mid);
});

$("#selbar").addEventListener("click", async e => {
  const b = e.target.closest("[data-sel]");
  if (!b || !S.activeId) return;
  const act = b.dataset.sel, ids = [...S.selected];
  const msgs = ids.map(id => S.msgById.get(id)).filter(Boolean);
  if (act === "close") return clearSelection();
  if (act === "fwd") return openForward(ids);
  if (act === "star") {
    await Promise.all(msgs.map(m => updateDoc(msgRef(m.id), { starredBy: arrayUnion(S.me.uid) }))).catch(() => {});
    toast("Pesan dibintangi");
    return clearSelection();
  }
  if (act === "del") {
    const ok = await ask("Hapus pesan", `Hapus ${ids.length} pesan untuk kamu? Pesan tetap ada untuk yang lain.`, "Hapus", true);
    if (!ok) return;
    await Promise.all(msgs.map(m => updateDoc(msgRef(m.id), { hiddenFor: arrayUnion(S.me.uid) }))).catch(() => {});
    clearSelection();
  }
});

const input = $("#input");
input.addEventListener("input", () => { autosize(); updateSendBtn(); pingTyping(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    submit();
  }
});

$("#btn-send").onclick = () => {
  if (S.recording) return stopRec(false);
  if ($("#input").value.trim() || S.editing) return submit();
  startRec();
};
$("#rec-cancel").onclick = () => stopRec(true);

$("#btn-emoji").onclick = e => showPop("emoji",
  `<div class="emoji-grid">${EMOJIS.map(x => `<button data-e="${x}">${x}</button>`).join("")}</div>`,
  e.currentTarget, "", true);

$("#btn-attach").onclick = e => showPop("attach",
  `<button class="pop-item" data-pt="media"><span class="tile t-blue">${ic("image", "w")}</span>Foto &amp; video</button>
   <button class="pop-item" data-pt="cam"><span class="tile t-green">${ic("camera", "w")}</span>Kamera</button>
   <button class="pop-item" data-pt="doc"><span class="tile t-violet">${ic("file", "w")}</span>Dokumen</button>`,
  e.currentTarget, "", true);

["fileMedia", "fileDoc", "fileCam"].forEach(id => {
  $("#" + id).addEventListener("change", e => {
    [...e.target.files].slice(0, 10).forEach(f => sendFile(f));
    e.target.value = "";
  });
});
$("#fileAvatar").addEventListener("change", e => {
  changeAvatar(e.target.files[0]);
  e.target.value = "";
});

document.addEventListener("mousedown", e => {
  if (!e.target.closest("#pop")) closePop();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.getElementById("pop")) return closePop();
  if (!$("#lightbox").classList.contains("hidden")) return $("#lightbox").classList.add("hidden");
  if (!$("#overlay").classList.contains("hidden")) return closeModal();
  if (S.selecting) return clearSelection();
  if (!$("#chat-search").classList.contains("hidden")) return closeChatSearch();
  if (S.editing || S.replyTo) return cancelPending();
  if (S.info) { S.info = false; renderInfo(); }
});
</script>
</body>
</html>
