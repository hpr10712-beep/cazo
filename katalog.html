<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog — Cazo Market</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><rect x='4' y='4' width='120' height='120' rx='30' fill='%230b1220'/><circle cx='64' cy='70' r='50' fill='%234f46e5' opacity='.28'/><g transform='rotate(-5 64 66)'><path d='M48 52V42Q48 26 64 26Q80 26 80 42V52' fill='none' stroke='%23a5b4fc' stroke-width='6' stroke-linecap='round'/><path d='M35 48H93L98 99Q99 106 92 106H36Q29 106 30 99Z' fill='%2334d399' stroke='%2334d399' stroke-width='2' stroke-linejoin='round'/><path d='M35 48H93L93.7 57H34.3Z' fill='%2310b981'/><circle cx='50' cy='52.5' r='3' fill='%230b1220'/><circle cx='78' cy='52.5' r='3' fill='%230b1220'/><g fill='none' stroke='%230b1220' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'><path d='M53 69L43 80L53 91'/><path d='M75 69L85 80L75 91'/><path d='M68 67L60 93'/></g></g></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#4f46e5;--bg-body:#f8fafc;--text-main:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--font:'Inter',system-ui,sans-serif;--c1:#4c1d95;--c2:#7c3aed;--c3:#db2777;--c4:#2563eb;--ink:#1e1b4b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:var(--bg-body);color:var(--text-main);padding-bottom:120px;overflow-x:hidden}
a{text-decoration:none;color:inherit}img{max-width:100%;display:block}
button,input,select{font-family:inherit}button{cursor:pointer;border:none;background:none;color:inherit}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-3px) rotate(-3deg)}}

#page-loader{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity .5s,visibility .5s}
#page-loader.hidden{opacity:0;visibility:hidden}
.ld{display:grid;justify-items:center;gap:12px;font-weight:900;font-size:20px;color:var(--primary)}
.ld svg{width:84px;height:64px;animation:bob 1.4s ease-in-out infinite}
.ld i{width:140px;height:6px;border-radius:9px;background:#e0e7ff;position:relative;overflow:hidden}
.ld i::after{content:"";position:absolute;inset:0;width:40%;border-radius:9px;background:var(--primary);animation:ldb 1s ease-in-out infinite alternate}
@keyframes ldb{to{transform:translateX(150%)}}

/* HEADER (statis, ringan) */
.cz-header{position:relative;color:#fff;isolation:isolate;background:linear-gradient(120deg,var(--c1),var(--c2),var(--c3),var(--c4));overflow:hidden;border-radius:0 0 30px 30px;margin-bottom:20px}
.cz-bg{position:absolute;inset:0;overflow:hidden;z-index:-1}
.cz-bg::before{content:"";position:absolute;inset:0;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.3) 2.5px,transparent 2.5px),linear-gradient(90deg,rgba(255,255,255,.3) 2.5px,transparent 2.5px);background-size:34px 34px}
.blob{position:absolute;border-radius:50%;opacity:.5}
.b1{width:220px;height:220px;background:radial-gradient(circle,#f472b6,transparent 70%);left:-60px;top:-50px}
.b2{width:260px;height:260px;background:radial-gradient(circle,#22d3ee,transparent 70%);right:-80px;top:20px}
.b3{width:180px;height:180px;background:radial-gradient(circle,#fde047,transparent 70%);left:40%;bottom:-70px}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:56px;overflow:hidden;pointer-events:none;z-index:3}
.wave svg{position:absolute;left:0;bottom:0;width:200%;height:100%}.w2{opacity:.5}
.bar{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;z-index:20}
.logo{width:38px;height:38px;flex:none}.logo svg{width:100%;height:100%;display:block;overflow:visible}
.name{font-weight:900;font-size:19px;letter-spacing:-.3px;line-height:1.05;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.shim{background:linear-gradient(90deg,var(--c2),var(--c3),var(--c4));-webkit-background-clip:text;background-clip:text;color:transparent}
.brandpill{display:flex;align-items:center;gap:9px;flex:0 1 auto;min-width:0;margin-right:auto;overflow:hidden;padding:4px 18px 4px 4px;border-radius:999px;background:rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(30,27,75,.25);transition:transform .2s}
.brandpill:active{transform:scale(.96)}
@media(max-width:380px){.brandpill{padding-right:12px}.name{font-size:16px}}
.back{display:inline-flex;align-items:center;gap:7px;background:#fff;color:#1f2937;font-weight:800;font-size:14px;padding:8px 16px 8px 10px;border-radius:999px;box-shadow:0 3px 0 rgba(30,27,75,.25);border:2.5px solid #f9a8d4;transition:transform .2s}
.back:active{transform:scale(.95)}.back svg{width:20px;height:20px}
.hero{text-align:center;padding:14px 20px 0;position:relative;z-index:12}
.hero h1{margin:0;font-size:clamp(34px,9.5vw,54px);font-weight:900;letter-spacing:-1.5px;line-height:1;text-shadow:0 4px 0 rgba(30,27,75,.35)}
.hero h1 .shim{background:none;color:#fde047}
.hero p{margin:8px auto 0;max-width:420px;font-size:15.5px;font-weight:500;opacity:.94}

/* MASKOT */
.stage{position:relative;height:335px;max-width:560px;margin:4px auto 0;z-index:10;display:flex;justify-content:center}
.bubble{position:absolute;top:0;left:50%;translate:-50% 0;width:min(320px,calc(100vw - 40px));min-height:58px;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 14px;font-weight:800;font-size:14.5px;line-height:1.35;text-align:center;box-shadow:0 4px 0 rgba(30,27,75,.35);display:flex;align-items:center;justify-content:center;z-index:30}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:16px;height:16px;margin-left:-8px;background:#fff;border:3px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg)}
.bubble.pop{animation:bpop .4s cubic-bezier(.34,1.6,.64,1)}
@keyframes bpop{0%{transform:scale(.85);opacity:0}100%{transform:none}}
.caret{display:inline-block;width:2.5px;height:1.05em;margin-left:2px;vertical-align:-3px;border-radius:2px;background:#db2777;animation:cr .9s steps(1) infinite}
@keyframes cr{50%{opacity:0}}
.world{position:absolute;left:50%;bottom:8px;width:200px;height:232px;margin-left:-100px;perspective:800px}
.plat{position:absolute;left:50%;top:78px;width:200px;height:200px;margin-left:-100px;transform:rotateX(78deg);pointer-events:none}
.plat i{position:absolute;border-radius:50%}
.plat .p1{inset:0;background:radial-gradient(circle,rgba(255,255,255,.5),rgba(255,255,255,.1) 60%,transparent 71%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5)}
.plat .p2{inset:16px;border:3px dashed rgba(255,255,255,.75)}
.shd{position:absolute;left:50%;top:172px;width:120px;height:22px;margin-left:-60px;border-radius:50%;background:radial-gradient(ellipse,rgba(30,27,75,.5),transparent 70%);pointer-events:none}
.hop{position:absolute;left:25px;top:8px;width:150px;height:175px;cursor:pointer;transform-style:preserve-3d;animation:hop 2.6s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-8px)}}
.sq{position:absolute;inset:0;transform-style:preserve-3d}
.sq.poke{animation:squish .45s ease}
@keyframes squish{30%{transform:scale(1.14,.8)}60%{transform:scale(.92,1.1)}}
.m3{position:absolute;inset:0;transform-style:preserve-3d;animation:turn 7s ease-in-out infinite}
@keyframes turn{0%,100%{transform:rotateX(4deg) rotateY(-24deg)}50%{transform:rotateX(4deg) rotateY(24deg)}}
.ly{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;display:block}
.eb{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.mo-th{transform-box:fill-box;transform-origin:50% 0}
.talk .mo-th{animation:yap .24s ease-in-out infinite alternate}
@keyframes yap{to{transform:scaleY(1.5)}}
.al{transform-origin:44px 164px;animation:armL 2.6s ease-in-out infinite}
.ar{transform-origin:196px 164px;animation:wave 1.6s ease-in-out infinite}
.talk .ar{animation-duration:.8s}
@keyframes armL{50%{transform:rotate(6deg)}}
@keyframes wave{0%,100%{transform:rotate(-45deg)}50%{transform:rotate(-80deg)}}
/* ekspresi */
#mface .v{display:none}
#mface[data-mood=happy] .e-open,#mface[data-mood=wink] .e-open,#mface[data-mood=surprised] .e-open{display:none}
#mface[data-mood=happy] .e-happy,#mface[data-mood=wink] .e-wink,#mface[data-mood=surprised] .e-wide{display:inline}
#mface[data-mood=surprised] .mo-smile,#mface[data-mood=think] .mo-smile{display:none}
#mface[data-mood=surprised] .mo-o,#mface[data-mood=think] .mo-flat{display:inline}
.pup{transition:transform .25s}
#mface[data-mood=think] .pup{transform:translate(6px,-5px)}
.brow{transition:transform .3s cubic-bezier(.34,1.5,.64,1);transform-origin:120px 120px}
#mface[data-mood=surprised] .brow{transform:translateY(-9px)}
#mface[data-mood=happy] .brow{transform:translateY(-4px)}
#mface[data-mood=think] .brow{transform:rotate(-6deg) translateY(-3px)}

/* NAV */
.nav{position:fixed;left:12px;right:12px;bottom:16px;background:#fff;border-radius:34px;padding:10px 8px;display:flex;justify-content:space-around;box-shadow:0 10px 30px rgba(76,29,149,.2),inset 0 -3px 0 rgba(30,27,75,.05);z-index:100}
.item{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:11px;color:#94a3b8}
.iw{position:relative;width:42px;height:42px;display:grid;place-items:center}
.iw::before{content:"";position:absolute;inset:-2px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--glow) 0%,transparent 70%);opacity:0;transform:scale(.5);transition:.3s}
.icon{position:relative;width:38px;height:38px;overflow:visible;filter:grayscale(1) opacity(.5);transition:transform .35s cubic-bezier(.34,1.8,.64,1),filter .3s}
.item.active{color:#4f46e5}
.item.active .iw::before{opacity:.55;transform:scale(1.15)}
.item.active .icon{transform:translateY(-4px) scale(1.15);filter:drop-shadow(0 4px 3px rgba(30,27,75,.28))}
.mascot{position:absolute;top:-30px;width:42px;height:32px;overflow:visible;opacity:0;transform:translateY(14px) scale(.7);transition:.35s cubic-bezier(.34,1.8,.64,1);pointer-events:none}
.item.active .mascot{opacity:1;transform:none;animation:bob 1.8s ease-in-out infinite}
.item.active .tw{animation:tw 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{50%{transform:scale(.4) rotate(45deg);opacity:.5}}

/* KATALOG */
.rw{max-width:980px;margin:0 auto;padding:6px 16px 0}
.sh{text-align:center;margin:6px 0 20px}
.sh h2{margin:0;font-size:23px;font-weight:900;letter-spacing:-.5px;color:var(--ink)}
.sh p{margin:6px 0 0;font-size:14px;color:var(--text-muted);font-weight:500}
.ctrl{margin-bottom:22px;padding:16px;background:#fff;border:1.5px solid #e0e7ff;border-radius:26px;box-shadow:0 5px 0 #e0e7ff,0 18px 26px -18px rgba(124,58,237,.45)}
.srch{position:relative;display:block}
.srch svg{position:absolute;left:16px;top:50%;translate:0 -50%;width:20px;height:20px;color:var(--c2)}
.srch input{width:100%;padding:14px 16px 14px 46px;border:2px solid #e0e7ff;border-radius:16px;font-size:14.5px;font-weight:600;color:var(--ink);background:#f8fafc;outline:none;transition:border-color .2s,background .2s}
.srch input:focus{border-color:var(--c2);background:#fff}
.lbl{display:flex;align-items:center;gap:10px;margin:20px 2px 12px;font-size:11.5px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted)}
.lbl::after{content:"";flex:1;height:1.5px;background:#eef2ff}
.chips{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:9px 16px;border-radius:99px;background:#fff;border:1.5px solid #e0e7ff;box-shadow:0 3px 0 #e0e7ff;font-weight:800;font-size:12.5px;color:var(--ink)}
.chips button.on{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--c2),var(--c3));box-shadow:0 3px 0 rgba(30,27,75,.3)}
.chips em{font-style:normal;opacity:.7;margin-left:6px}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 22px}
.cnt{padding:7px 14px;border-radius:99px;background:#eef2ff;color:#3730a3;font-weight:900;font-size:12.5px}
.tools select{padding:9px 12px;border-radius:12px;border:1.5px solid #e0e7ff;background:#fff;font-weight:700;font-size:12.5px;color:var(--ink);outline:none}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 14px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 20px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pc{position:relative;display:flex;perspective:900px;animation:cin .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
@keyframes cin{from{opacity:0;transform:translateY(20px) scale(.95)}}
.pc::after{content:"";position:absolute;left:10%;right:10%;bottom:-13px;height:14px;border-radius:50%;background:radial-gradient(ellipse,rgba(76,29,149,.38),transparent 70%);pointer-events:none}
.cd{--bx:3deg;--by:0deg;position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding:9px 9px 12px;border:3px solid transparent;border-radius:24px;background:linear-gradient(165deg,#fff 40%,#f1e9ff) padding-box,linear-gradient(135deg,var(--c2),var(--c3),var(--c4)) border-box;box-shadow:0 12px 20px -12px rgba(76,29,149,.6);transform-style:preserve-3d;transform:rotateX(calc(var(--bx) + var(--rx,0deg))) rotateY(calc(var(--by) + var(--ry,0deg)));transition:transform .18s ease-out,box-shadow .2s}
.cd::before,.cd::after{content:"";position:absolute;inset:-3px;border-radius:24px}
.cd::before{background:linear-gradient(135deg,#6d28d9,#be185d);transform:translateZ(-9px)}
.cd::after{background:#3b0f7a;transform:translateZ(-18px)}
@media(max-width:639px){.pc:nth-child(odd) .cd{--by:6deg}.pc:nth-child(even) .cd{--by:-6deg}}
@media(min-width:640px) and (max-width:899px){.pc:nth-child(3n+1) .cd{--by:7deg}.pc:nth-child(3n) .cd{--by:-7deg}}
@media(min-width:900px){.pc:nth-child(4n+1) .cd{--by:8deg}.pc:nth-child(4n+2) .cd{--by:3deg}.pc:nth-child(4n+3) .cd{--by:-3deg}.pc:nth-child(4n) .cd{--by:-8deg}}
@media(hover:hover){.pc:hover .cd{--bx:0deg;--by:0deg;transform:translateZ(26px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));box-shadow:0 24px 30px -12px rgba(76,29,149,.7)}.pc:hover .gl{opacity:1}.pc:hover .im::after{opacity:.85}}
.cd:active{transform:translateZ(-12px) rotateX(var(--bx)) rotateY(var(--by))}
.gl{position:absolute;inset:0;border-radius:21px;background:radial-gradient(circle at var(--gx,30%) var(--gy,0%),rgba(255,255,255,.7),transparent 55%);opacity:.3;transition:opacity .2s;pointer-events:none;transform:translateZ(2px)}
.im{position:relative;flex:none;aspect-ratio:1;border-radius:17px;overflow:hidden;background:#ede9fe;border:2.5px solid #fff;box-shadow:0 0 0 1.5px rgba(124,58,237,.4),0 12px 12px -8px rgba(30,27,75,.55);transform:translateZ(26px)}
.im img{width:100%;height:100%;object-fit:cover}
.im::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--gx,30%) var(--gy,0%),rgba(255,255,255,.55),transparent 55%);opacity:.25;transition:opacity .2s;pointer-events:none}
.tg{position:absolute;left:6px;bottom:6px;display:flex;gap:4px;flex-wrap:wrap;z-index:1}
.tg span{padding:3px 9px;border-radius:99px;font-size:10px;font-weight:900;color:#fff;background:linear-gradient(120deg,var(--c2),var(--c4));box-shadow:0 2px 0 rgba(30,27,75,.3)}
.tg .rs{background:#f59e0b}
.ct{align-self:flex-start;max-width:100%;margin:3px 2px 0;padding:3px 10px;border-radius:99px;background:#ede9fe;color:#5b21b6;font-size:10px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:translateZ(16px)}
.cd h3{margin:0 2px;font-size:14px;font-weight:800;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;transform:translateZ(12px)}
.shop{display:flex;align-items:center;gap:7px;margin:0 2px;font-size:11.5px;font-weight:700;color:var(--text-muted);transform:translateZ(10px)}
.shop span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--c2),var(--c3));color:#fff;font:900 10px/20px var(--font);text-align:center;font-style:normal}
.pr{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:4px;transform:translateZ(28px)}
.pr b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:900;color:#fff;padding:6px 12px;border-radius:99px;background:linear-gradient(120deg,var(--c2),var(--c3),var(--c4));box-shadow:0 3px 0 rgba(30,27,75,.35),0 10px 12px -6px rgba(30,27,75,.5)}
.go{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#fde047,#f59e0b);border:2.5px solid var(--ink);box-shadow:0 3px 0 rgba(30,27,75,.4)}
.go svg{width:16px;height:16px;color:var(--ink)}
/* maskot toko bergelantungan di tiap produk */
.hang{position:absolute;right:16px;top:-14px;width:44px;height:82px;pointer-events:none;transform-origin:22px 0;transform:translateZ(42px) rotate(-9deg);animation:swing 3.4s ease-in-out infinite alternate;animation-delay:calc(var(--i,0)*-.55s);animation-play-state:paused}
.pc.vis .hang{animation-play-state:running}
@keyframes swing{to{transform:translateZ(42px) rotate(9deg)}}
.hang::before{content:"";position:absolute;left:17px;top:-4px;width:10px;height:10px;border-radius:50%;background:#fde047;border:2px solid var(--ink)}
.hang i{position:absolute;left:21px;top:2px;width:2px;height:46px;border-radius:2px;background:linear-gradient(#c4b5fd,#7c3aed)}
.hang svg{position:absolute;left:0;top:46px;width:44px;height:34px;overflow:visible;filter:drop-shadow(0 4px 3px rgba(30,27,75,.4))}
.sk{aspect-ratio:3/4;border-radius:24px;background:linear-gradient(100deg,#ede9fe 30%,#f5f3ff 50%,#ede9fe 70%);background-size:200% 100%;animation:skm 1.2s linear infinite}
@keyframes skm{to{background-position:-200% 0}}
.empty{grid-column:1/-1;text-align:center;padding:36px 20px;color:var(--text-muted);font-weight:700}
.empty svg{width:90px;height:68px;display:block;margin:0 auto 10px}
@media (prefers-reduced-motion:reduce){.m3{animation:none!important;transform:rotateX(4deg) rotateY(-16deg)!important}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="page-loader"><div class="ld"><svg><use href="#mascotG"/></svg><b>Cazo Market</b><i></i></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient>
    <linearGradient id="lgBag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient>
    <linearGradient id="lgCode" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
    <radialGradient id="mShade" cx=".32" cy=".25" r=".95"><stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#7c2d12" stop-opacity=".38"/></radialGradient>

  let r = S.all.filter(p => (S.cat === "all" || p.category === S.cat) && (!S.lim || p.productType === "limited_html") &&
    (!q || [p.title, p.category, p.hashtags, shopOf(p)].some(x => String(x || "").toLowerCase().includes(q))));
  r.sort(S.sort === "low" ? (a, b) => a.price - b.price : S.sort === "high" ? (a, b) => b.price - a.price : (a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  return r;
};

function card(p, i) {
  const rs = p.status === "reserved", shop = shopOf(p), ttl = p.title || "Produk";
  const tags = (p.productType === "limited_html" ? "<span>Limited</span>" : "") + (rs ? '<span class="rs">Dipesan</span>' : "");
  return `<div class="pc" style="--i:${Math.min(i, 12)}" data-id="${esc(p.id)}"><a class="cd" href="detail.html?id=${esc(p.id)}" aria-label="${esc(ttl)}">
    <i class="gl"></i>
    <div class="hang" aria-hidden="true"><i></i><svg viewBox="0 0 44 34"><use href="#mascot3"/></svg></div>
    <div class="im"><img src="${esc(imgOf(p))}" alt="" loading="lazy" onerror="this.onerror=null;this.src='${PH}'">${tags ? `<div class="tg">${tags}</div>` : ""}</div>
    <span class="ct">${esc(p.category || "Digital")}</span>
    <h3>${esc(ttl)}</h3>
    ${shop ? `<div class="shop"><i class="av">${esc(shop.charAt(0).toUpperCase())}</i><span>${esc(shop)}</span></div>` : ""}
    <div class="pr"><b>${rupiah(p.price)}</b><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></div></a></div>`;
}

function render() {
  const cats = [...new Set(S.all.map(p => p.category).filter(Boolean))].sort();
  const hasLim = S.all.some(p => p.productType === "limited_html");
  const chip = (k, l, n, on) => `<button class="${on ? "on" : ""}" data-k="${esc(k)}">${esc(l)}<em>${n}</em></button>`;
  $("chips").innerHTML = chip("all", "Semua", S.all.length, S.cat === "all" && !S.lim) +
    (hasLim ? chip("__lim", "Limited", S.all.filter(p => p.productType === "limited_html").length, S.lim) : "") +
    cats.map(c => chip(c, c, S.all.filter(p => p.category === c).length, S.cat === c && !S.lim)).join("");
  const rows = view();
  $("count").textContent = rows.length + " produk";
  $("grid").innerHTML = rows.length ? rows.map(card).join("") : `<div class="empty"><svg><use href="#mascot"/></svg><p>${S.all.length ? "Tidak ada produk yang cocok." : "Belum ada produk tersedia."}</p></div>`;
  watch();
  return rows.length;
}

onValue(ref(db, "products"), s => {
  const v = s.val() || {};
  S.all = Object.entries(v).map(([id, p]) => ({ id, ...p, price: Number(p.price) || 0 })).filter(p => p.status === "available" || p.status === "reserved");
  const first = !S.loaded; S.loaded = true; render();
  $("page-loader").classList.add("hidden");
  if (first) S.all.length ? say(`Halo! Aku Cazo. Ada ${S.all.length} produk di katalog, yuk lihat-lihat!`, "happy", 6000) : say("Katalog masih kosong. Cek lagi nanti ya!", "surprised", 6000);
}, e => { S.loaded = true; $("grid").innerHTML = `<div class="empty"><p>Gagal memuat produk: ${esc(e.message)}</p></div>`; $("page-loader").classList.add("hidden"); say("Aduh, produknya gagal dimuat.", "surprised"); });
get(ref(db, "shops")).then(s => { S.shops = s.val() || {}; if (S.loaded) render(); }).catch(() => {});
setTimeout(() => $("page-loader").classList.add("hidden"), 6000);

/* ---------- interaksi ---------- */
$("chips").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const k = b.dataset.k; S.lim = k === "__lim"; S.cat = S.lim || k === "all" ? "all" : k;
  const n = render();
  if (!n) say("Hmm, belum ada produk di sini.", "surprised");
  else say(S.lim ? `Ini ${n} produk Limited berisi kode HTML.` : S.cat === "all" ? `Menampilkan semua: ${n} produk.` : `Kategori ${S.cat} punya ${n} produk.`, "happy");
};
let qt;
$("q").oninput = e => {
  S.q = e.target.value; clearTimeout(qt); if (S.q.trim()) mood("think", 2000);
  qt = setTimeout(() => {
    const n = render();
    if (!S.q.trim()) say("Pencarian dibersihkan.", "idle");
    else if (!n) say(`Tidak ketemu produk untuk "${cut(S.q, 24)}". Coba kata lain?`, "surprised");
    else say(`Ketemu ${n} produk untuk "${cut(S.q, 24)}".`, "happy");
  }, 450);
};
$("sort").onchange = e => {
  S.sort = e.target.value; render();
  say(S.sort === "low" ? "Diurutkan dari harga termurah." : S.sort === "high" ? "Diurutkan dari harga termahal." : "Diurutkan dari yang terbaru.", "wink");
};

/* kartu 3D: miring mengikuti mouse (layar sentuh tetap ringan, tanpa efek miring) */
const grid = $("grid");
grid.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const pc = e.target.closest(".pc"); if (!pc) return;
  const c = pc.firstElementChild, r = pc.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
  c.style.setProperty("--rx", ((.5 - y) * 16).toFixed(1) + "deg"); c.style.setProperty("--ry", ((x - .5) * 18).toFixed(1) + "deg");
  c.style.setProperty("--gx", (x * 100).toFixed(0) + "%"); c.style.setProperty("--gy", (y * 100).toFixed(0) + "%");
});
grid.addEventListener("pointerout", e => {
  const pc = e.target.closest(".pc"); if (!pc || pc.contains(e.relatedTarget)) return;
  pc.firstElementChild.style.setProperty("--rx", "0deg"); pc.firstElementChild.style.setProperty("--ry", "0deg");
});
let hv = "";
grid.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse") return;
  const pc = e.target.closest(".pc"); if (!pc || pc.dataset.id === hv) return;
  hv = pc.dataset.id; const p = S.all.find(x => x.id === hv); if (!p) return;
  const sh = shopOf(p); say(`${cut(p.title || "Produk")} — ${rupiah(p.price)}${sh ? " dari " + sh : ""}`, "wink", 3000);
});
</script>
</body>
</html>
