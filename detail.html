<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Detail — KodinganKita</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><rect x='4' y='4' width='120' height='120' rx='30' fill='%230b1220'/><circle cx='64' cy='70' r='50' fill='%234f46e5' opacity='.28'/><g transform='rotate(-5 64 66)'><path d='M48 52V42Q48 26 64 26Q80 26 80 42V52' fill='none' stroke='%23a5b4fc' stroke-width='6' stroke-linecap='round'/><path d='M35 48H93L98 99Q99 106 92 106H36Q29 106 30 99Z' fill='%2334d399' stroke='%2334d399' stroke-width='2' stroke-linejoin='round'/><path d='M35 48H93L93.7 57H34.3Z' fill='%2310b981'/><circle cx='50' cy='52.5' r='3' fill='%230b1220'/><circle cx='78' cy='52.5' r='3' fill='%230b1220'/><g fill='none' stroke='%230b1220' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'><path d='M53 69L43 80L53 91'/><path d='M75 69L85 80L75 91'/><path d='M68 67L60 93'/></g></g><path transform='translate(99 33) scale(.8)' fill='%23ffe14d' d='M0-12L3.5-3.5L12 0L3.5 3.5L0 12L-3.5 3.5L-12 0L-3.5-3.5Z'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#4f46e5;--primary-hover:#4338ca;--primary-light:#eef2ff;--bg-body:#f8fafc;--bg-card:#ffffff;--text-main:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--success:#10b981;--warning:#f59e0b;--radius-sm:8px;--radius-md:14px;--radius-lg:24px;--radius-full:999px;--shadow-sm:0 1px 3px rgba(0,0,0,0.05);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}body{margin:0;font-family:var(--font);background:var(--bg-body);color:var(--text-main);padding-bottom:100px;}a{text-decoration:none;color:inherit}img{max-width:100%;display:block}button{font-family:inherit;cursor:pointer;border:none;background:none}
#splash-screen{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease}#splash-screen.hidden{opacity:0;pointer-events:none}.loading-bar{width:200px;height:4px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:20px}.loading-bar-inner{width:50%;height:100%;background:var(--primary);border-radius:4px;animation:loadBar 1s infinite ease-in-out alternate}@keyframes loadBar{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.9);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.brand svg{width:34px;height:34px;border-radius:8px}.btn-login{background:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius-full);font-weight:600;font-size:14px}
.bottom-nav-container{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;z-index:50;pointer-events:none}.bottom-nav{background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.3);box-shadow:0 10px 40px rgba(0,0,0,0.15);border-radius:var(--radius-full);display:flex;justify-content:space-around;padding:12px 24px;width:92%;max-width:450px;pointer-events:auto}.nav-item{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none}.nav-item.active{color:var(--primary);transform:translateY(-2px)}.nav-item .icon-wrap{width:24px;height:24px;display:flex;align-items:center;justify-content:center}.nav-item .icon-wrap iframe{width:100%;height:100%;border:none;pointer-events:none}.nav-item .icon-wrap svg{width:24px;height:24px}.nav-item span{font-size:10px;font-weight:700}
.container{max-width:1000px;margin:0 auto;padding:20px}
/* DETAIL UI */
.detail-img{width:100%;max-height:400px;background:#fff;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border);margin-bottom:24px}.detail-img img{max-width:100%;max-height:400px;object-fit:contain}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}.detail-title{font-size:24px;font-weight:800;margin:0;line-height:1.3}.btn-icon{width:40px;height:40px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);cursor:pointer;flex-shrink:0}
.price-box{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.meta-info{display:flex;gap:16px;font-size:13px;color:var(--text-muted);margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.hashtags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.hashtag{background:var(--primary-light);color:var(--primary);padding:4px 12px;border-radius:var(--radius-full);font-size:12px;font-weight:600}
.desc-title{font-size:16px;font-weight:700;margin:0 0 12px}.desc-text{font-size:14px;line-height:1.7;color:var(--text-main);white-space:pre-wrap;margin-bottom:30px}
.qris-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;text-align:center;margin-bottom:24px}.qris-box img{width:100%;max-width:280px;margin:0 auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
.timer{font-size:36px;font-weight:800;color:var(--danger);font-variant-numeric:tabular-nums;text-align:center;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:var(--radius-md);font-weight:700;font-size:15px;transition:0.2s;width:100%;cursor:pointer;text-decoration:none}.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,0.3)}.btn-outline{background:#fff;color:var(--text-main);border:1px solid var(--border)}.btn-disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(5px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}.modal-box{background:#fff;border-radius:24px;width:100%;max-width:400px;padding:30px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.2)}.modal-icon{width:60px;height:60px;background:var(--primary-light);color:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}.modal-title{font-size:20px;font-weight:800;margin:0 0 10px}.modal-desc{font-size:14px;color:var(--text-muted);margin-bottom:24px}.close-btn{position:absolute;top:16px;right:16px;width:32px;height:32px;background:var(--bg-body);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.loading{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 24px;border-radius:var(--radius-full);font-size:14px;z-index:2000;animation:slideDown 0.3s;display:none}@keyframes slideDown{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
</style>
</head>
<body>
<div id="splash-screen" style="display:none;"></div>
<header class="site">
  <a href="index.html" class="brand" id="brandLogo">KodinganKita</a>
  <button id="authBtn" class="btn-login" onclick="handleAuth()">Masuk</button>
</header>

<main class="container" id="app">
  <div class="loading"></div>
</main>

<div class="bottom-nav-container"><div class="bottom-nav" id="bottomNav"></div></div>
<div id="modal-root"></div>
<div id="toast-container" class="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, onValue, set, push, runTransaction, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8", authDomain: "mybro-9ba5f.firebaseapp.com", databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com", projectId: "mybro-9ba5f", storageBucket: "mybro-9ba5f.firebasestorage.app", messagingSenderId: "820948893264", appId: "1:820948893264:web:e564509a8fdc4c56335b55" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app); const auth = getAuth(app); const provider = new GoogleAuthProvider();
const DEFAULT_LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%"><rect x="4" y="4" width="120" height="120" rx="30" fill="#0b1220"/><circle cx="64" cy="70" r="50" fill="#4f46e5" opacity=".28"/><g transform="rotate(-5 64 66)"><path d="M48 52V42Q48 26 64 26Q80 26 80 42V52" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round"/><path d="M35 48H93L98 99Q99 106 92 106H36Q29 106 30 99Z" fill="#34d399" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/><path d="M35 48H93L93.7 57H34.3Z" fill="#10b981"/><circle cx="50" cy="52.5" r="3" fill="#0b1220"/><circle cx="78" cy="52.5" r="3" fill="#0b1220"/><g fill="none" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M53 69L43 80L53 91"/><path d="M75 69L85 80L75 91"/><path d="M68 67L60 93"/></g></g><path transform="translate(99 33) scale(.8)" fill="#ffe14d" d="M0-12L3.5-3.5L12 0L3.5 3.5L0 12L-3.5 3.5L-12 0L-3.5-3.5Z"/></svg>`;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rupiah = n => "Rp" + Number(n||0).toLocaleString("id-ID");
const QRIS_IMG = "https://i.ibb.co.com/FLF6Wz07/IMG-20261012-160202.jpg";

let state = { user: null, products: {}, settings: {}, loaded: 0, orderTimer: null };
const productId = new URLSearchParams(window.location.search).get('id');

function checkLoaded() { state.loaded++; if(state.loaded >= 2) { const sp = document.getElementById('splash-screen'); if(sp) sp.remove(); initPage(); } }
function createIframe(code, round) { const i = document.createElement("iframe"); if(round) i.style.borderRadius="50%"; i.srcdoc=`<html><head><style>body{margin:0;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;pointer-events:none;}*{box-sizing:border-box;}</style></head><body>${code}</body></html>`; return i; }
window.toast = (msg) => { const t = document.querySelector('.toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(()=>t.style.display='none', 3000); };

window.handleAuth = async () => { if (state.user) { if(confirm("Keluar?")) await signOut(auth); } else { try { await signInWithPopup(auth, provider); } catch(e){ alert(e.message); } } };
onAuthStateChanged(auth, user => { state.user = user; const btn = document.getElementById('authBtn'); if(btn) btn.innerHTML = user ? `Keluar (${user.displayName.split(' ')[0]})` : 'Masuk'; });

onValue(ref(db, "settings/marketplace"), s => { state.settings = s.val() || {}; checkLoaded(); });
onValue(ref(db, "products"), s => { state.products = s.val() || {}; checkLoaded(); });

function initPage() {
  document.getElementById('brandLogo').innerHTML = `<div style="width:34px;height:34px;display:inline-block;vertical-align:middle;margin-right:8px;">${DEFAULT_LOGO}</div> ${esc(state.settings.name || "KodinganKita")}`;
  
  const defaultNavs = [
    { id: "home", label: "Beranda", href: "index.html", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>` },
    { id: "catalog", label: "Katalog", href: "katalog.html", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>` },
    { id: "history", label: "Riwayat", href: "riwayat.html", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"></path></svg>` },
    { id: "profile", label: "Profil", href: "profil.html", code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>` }
  ];
  const navs = (state.settings.bottomMenus && state.settings.bottomMenus.length > 0) ? state.settings.bottomMenus : defaultNavs;
  document.getElementById('bottomNav').innerHTML = navs.map(n => `<a href="${n.href}" class="nav-item"><div class="icon-wrap" id="nav-${n.id}">${n.code}</div><span>${n.label}</span></a>`).join("");
  navs.forEach(n => { if(n.code.includes('<style>')) { const w = document.getElementById(`nav-${n.id}`); if(w){w.innerHTML="";w.appendChild(createIframe(n.code,false));} } });

  renderProduct();
}

function renderProduct() {
  const p = state.products[productId];
  if(!p) return document.getElementById('app').innerHTML = `<div class="empty-state">Produk tidak ditemukan.</div>`;
  
  const isAvail = p.status !== 'sold' && p.status !== 'reserved';
  const isLimited = p.productType === 'limited_html';

  document.getElementById('app').innerHTML = `
    <a href="katalog.html" style="display:inline-block;margin-bottom:16px;font-size:14px;font-weight:600;color:var(--text-muted)">&larr; Kembali</a>
    <div class="detail-img"><img src="${p.imageURLs?.[0] || 'https://placehold.co/800x450/f1f5f9/64748b?text=No+Image'}"></div>
    <div class="detail-header">
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;margin-bottom:4px">${esc(p.category)}</div>
        <h1 class="detail-title">${esc(p.title)}</h1>
      </div>
      <button class="btn-icon" onclick="navigator.clipboard.writeText(window.location.href); toast('Link disalin!')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
      </button>
    </div>
    <div class="price-box">${rupiah(p.price)}</div>
    ${isLimited ? `
      <div class="meta-info"><span style="color:${isAvail ? 'var(--success)' : 'var(--danger)'}; font-weight:700;">${isAvail ? 'Tersedia (Sisa 1)' : 'Sudah Terjual'}</span></div>
      ${p.hashtags ? `<div class="hashtags">${p.hashtags.split(',').map(h => `<span class="hashtag">#${esc(h.trim())}</span>`).join('')}</div>` : ''}
    ` : `
      <div class="meta-info"><span>Total Terjual: <b>${p.totalSold || 0}</b></span><span>Rating: <b>${p.ratingAvg ? p.ratingAvg.toFixed(1) : '0.0'}</b></span></div>
    `}
    <h3 class="desc-title">Deskripsi Lengkap</h3>
    <div class="desc-text">${esc(p.description || "Tidak ada deskripsi.")}</div>
    ${isLimited && p.demoURL ? `<a href="${p.demoURL}" target="_blank" class="btn btn-outline" style="margin-bottom:12px">Lihat Proyek (Live Preview)</a>` : ''}
    ${!isAvail ? `<button class="btn btn-disabled" disabled>Maaf, Produk Sudah Terjual</button>` : `<button class="btn btn-primary" onclick="buyFlow('${p.id}')">Beli Sekarang</button>`}
  `;
}

window.buyFlow = async (pid) => {
  if(!state.user) {
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)document.getElementById('modal-root').innerHTML=''">
        <div class="modal-box">
          <button class="close-btn" onclick="document.getElementById('modal-root').innerHTML=''">&times;</button>
          <div class="modal-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg></div>
          <h3 class="modal-title">Harap Masuk</h3>
          <p class="modal-desc">Silakan masuk dengan Google untuk melanjutkan.</p>
          <button class="btn btn-primary" onclick="handleAuth(); document.getElementById('modal-root').innerHTML='';" style="margin-bottom:10px"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" style="width:18px"> Masuk Google</button>
          <button class="btn btn-outline" onclick="document.getElementById('modal-root').innerHTML=''">Batal</button>
        </div>
      </div>`;
    return;
  }

  try {
    const orderRef = push(ref(db, 'orders'));
    const orderId = orderRef.key;
    const now = Date.now();
    const expiresAt = now + (3 * 60 * 1000); 

    const result = await runTransaction(ref(db, `products/${pid}`), (p) => {
      if (!p) return null;
      if (p.status === 'sold' || p.status === 'reserved') return null;
      return { ...p, status: 'reserved', availability: 'reserved', reservedBy: state.user.uid, reservedUntil: expiresAt, reservationOrderId: orderId };
    });

    if (!result.committed) return toast("Maaf, produk baru saja diambil orang lain.");

    const commRate = state.settings.commissionRate || 0.10;
    const price = Number(state.products[pid].price);
    await set(orderRef, {
      buyerId: state.user.uid, buyerName: state.user.displayName, sellerId: state.products[pid].sellerId || 'admin', productId: pid,
      productTitleSnapshot: state.products[pid].title, priceSnapshot: price, commissionSnapshot: price * commRate, sellerAmountSnapshot: price - (price * commRate),
      paymentStatus: 'pending', orderStatus: 'reserved', createdAt: now, expiresAt: expiresAt
    });

    renderPayment(orderId, price, expiresAt);
  } catch(e) { toast("Gagal membuat pesanan: " + e.message); }
};

function renderPayment(orderId, price, expiresAt) {
  document.getElementById('app').innerHTML = `
    <div style="max-width:480px;margin:0 auto;text-align:center;padding-top:20px">
      <h2 style="margin-bottom:20px">Selesaikan Pembayaran</h2>
      <div class="timer" id="timerDisplay">03:00</div>
      <div class="qris-box">
        <img src="${QRIS_IMG}">
        <p style="font-size:13px;color:var(--text-muted);margin-top:16px">Total: <b style="color:var(--primary);font-size:18px">${rupiah(price)}</b></p>
      </div>
      <button class="btn btn-primary" style="margin-bottom:12px" onclick="confirmPayment('${orderId}', '${productId}', this)">Saya Sudah Bayar</button>
      <button class="btn btn-outline" onclick="cancelOrder('${orderId}', '${productId}')">Batalkan Pesanan</button>
    </div>
  `;

  if(state.orderTimer) clearInterval(state.orderTimer);
  const tick = () => {
    const r = expiresAt - Date.now();
    if(r <= 0) { clearInterval(state.orderTimer); expireOrder(orderId, productId); return; }
    const m = Math.floor(r / 60000), s = Math.floor((r % 60000) / 1000);
    const el = document.getElementById("timerDisplay");
    if(el) el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  };
  tick();
  state.orderTimer = setInterval(tick, 1000);
}

window.confirmPayment = async (orderId, pid, btn) => {
  if(!confirm("Pastikan Anda sudah mentransfer dana. Lanjutkan?")) return;
  btn.textContent = "Memproses..."; btn.disabled = true;
  await update(ref(db, `orders/${orderId}`), { paymentStatus: 'awaiting_verification' });
  clearInterval(state.orderTimer);
  alert("Konfirmasi terkirim. Menunggu verifikasi Admin.");
  window.location.href = "riwayat.html";
};

window.cancelOrder = async (orderId, pid) => {
  if(!confirm("Batalkan pesanan ini?")) return;
  await runTransaction(ref(db, `products/${pid}`), (p) => {
    if(!p || p.reservationOrderId !== orderId) return p;
    return { ...p, status: 'available', availability: 'available', reservedBy: null, reservationOrderId: null };
  });
  await update(ref(db, `orders/${orderId}`), { paymentStatus: 'cancelled', orderStatus: 'cancelled' });
  clearInterval(state.orderTimer);
  window.location.href = "katalog.html";
};

async function expireOrder(orderId, pid) {
  await runTransaction(ref(db, `products/${pid}`), (p) => {
    if(!p || p.reservationOrderId !== orderId) return p;
    return { ...p, status: 'available', availability: 'available', reservedBy: null, reservationOrderId: null };
  });
  await update(ref(db, `orders/${orderId}`), { paymentStatus: 'expired', orderStatus: 'expired' });
  clearInterval(state.orderTimer);
  toast("Waktu habis. Pesanan dibatalkan.");
  renderProduct(); 
}
</script>
</body>
</html>
