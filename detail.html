<style>
:root{--primary:#4f46e5;--primary-hover:#4338ca;--primary-light:#eef2ff;--bg-body:#f8fafc;--text-main:#0f172a;--text-muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--success:#10b981;--radius-sm:8px;--radius-md:14px;--radius-lg:24px;--radius-full:999px;--shadow-sm:0 1px 3px rgba(0,0,0,0.05);--shadow-md:0 4px 12px rgba(0,0,0,0.08);--font:'Inter',system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:var(--font);background:var(--bg-body);color:var(--text-main);padding-bottom:120px;opacity:0;transition:opacity 0.4s ease;}
body.loaded{opacity:1;}
a{text-decoration:none;color:inherit}img{max-width:100%;display:block}button{font-family:inherit;cursor:pointer;border:none;background:none}

/* LOADING TRANSITION */
#page-loader{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease, visibility 0.5s;}
#page-loader.hidden{opacity:0;visibility:hidden;}
.loader-logo{width:80px;height:80px;animation:pulse 1.5s infinite;}
@keyframes pulse{0%{transform:scale(0.95);opacity:0.8}50%{transform:scale(1.05);opacity:1}100%{transform:scale(0.95);opacity:0.8}}
.loader-bar{width:160px;height:4px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:24px;}
.loader-bar-inner{width:50%;height:100%;background:var(--primary);border-radius:4px;animation:loadBar 1s infinite ease-in-out alternate;}
@keyframes loadBar{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}

header.site{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.9);backdrop-filter:blur(15px);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.brand svg{width:34px;height:34px;border-radius:8px}
.btn-login{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);padding:8px 16px;border-radius:var(--radius-full);font-weight:600;font-size:14px}

.container{max-width:1000px;margin:0 auto;padding:20px}
.detail-img{width:100%;max-height:450px;background:#fff;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border);margin-bottom:24px}
.detail-img img{max-width:100%;max-height:450px;object-fit:contain}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.detail-title{font-size:24px;font-weight:800;margin:0;line-height:1.3}
.btn-icon{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);cursor:pointer;flex-shrink:0;box-shadow:var(--shadow-sm);transition:0.2s}
.btn-icon:active{background:var(--bg-body)}
.price-box{font-size:28px;font-weight:800;color:var(--primary);margin-bottom:20px}
.meta-info{display:flex;gap:16px;font-size:13px;color:var(--text-muted);margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.hashtags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}.hashtag{background:var(--primary-light);color:var(--primary);padding:4px 12px;border-radius:var(--radius-full);font-size:12px;font-weight:600}
.desc-title{font-size:16px;font-weight:700;margin:0 0 12px}.desc-text{font-size:14px;line-height:1.7;color:var(--text-main);white-space:pre-wrap;margin-bottom:30px}

/* PAYMENT UI */
.timer{font-size:36px;font-weight:800;color:var(--danger);font-variant-numeric:tabular-nums;text-align:center;margin-bottom:20px}
.qris-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;text-align:center;margin-bottom:24px}
.qris-box img{width:100%;max-width:280px;margin:0 auto;border-radius:var(--radius-sm);border:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:var(--radius-md);font-weight:700;font-size:15px;transition:0.2s;width:100%;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,0.3)}
.btn-outline{background:#fff;color:var(--text-main);border:1px solid var(--border)}
.btn-disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}

/* MODAL LOGIN */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(5px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:24px;width:100%;max-width:400px;padding:30px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.2);position:relative}
.modal-icon{width:60px;height:60px;background:var(--primary-light);color:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.modal-title{font-size:20px;font-weight:800;margin:0 0 10px}.modal-desc{font-size:14px;color:var(--text-muted);margin-bottom:24px}
.close-btn{position:absolute;top:16px;right:16px;width:32px;height:32px;background:var(--bg-body);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;color:var(--text-muted)}

.loading-spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted);grid-column:1/-1}

/* === NAVIGASI 3D (IPHONE DOCK) === */
:root { --ink:#1e1b4b; }
.nav { position:fixed; left:12px; right:12px; bottom:16px; background:#fff; border-radius:34px; padding:26px 8px 10px; display:flex; justify-content:space-around; box-shadow:0 10px 30px rgba(76,29,149,.2), inset 0 -3px 0 rgba(30,27,75,.05); z-index: 100; }
.item { position:relative; flex:1; border:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; font:700 12px inherit; color:#94a3b8; padding:0; text-decoration: none; outline: none; }
.iw { position:relative; width:48px; height:48px; display:grid; place-items:center; }
.iw::before { content:""; position:absolute; inset:-2px; border-radius:50%; background:radial-gradient(circle at 50% 40%, var(--glow) 0%, transparent 70%); opacity:0; transform:scale(.5); transition:.3s; }
.icon { position:relative; width:46px; height:46px; overflow:visible; filter:grayscale(1) opacity(.5); transition:transform .35s cubic-bezier(.34,1.8,.64,1), filter .3s; }
.item.active { color:#4f46e5; }
.item.active .iw::before { opacity:.55; transform:scale(1.15); }
.item.active .icon { transform:translateY(-8px) scale(1.18); filter:drop-shadow(0 6px 5px rgba(30,27,75,.28)); }
.mascot { position:absolute; top:-40px; width:46px; height:34px; overflow:visible; opacity:0; transform:translateY(14px) scale(.7); transition:.35s cubic-bezier(.34,1.8,.64,1); pointer-events:none; }
.item.active .mascot { opacity:1; transform:none; animation:bob 1.8s ease-in-out infinite; }
@keyframes bob { 50% { transform:translateY(-3px) rotate(-3deg); } }
.item.active .tw { animation:tw 1.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
@keyframes tw { 50% { transform:scale(.4) rotate(45deg); opacity:.5; } }
</style>

function checkLoaded() { state.loaded++; if(state.loaded >= 2) { setTimeout(() => { document.getElementById('page-loader').classList.add('hidden'); document.body.classList.add('loaded'); initPage(); }, 400); } }
window.handleAuth = async () => { if (state.user) { if(confirm("Keluar?")) await signOut(auth); } else { try { await signInWithPopup(auth, provider); } catch(e){ alert(e.message); } } };
onAuthStateChanged(auth, user => { state.user = user; const btn = document.getElementById('authBtn'); if(btn) btn.innerHTML = user ? `Keluar (${user.displayName.split(' ')[0]})` : 'Masuk'; });
onValue(ref(db, "settings/marketplace"), s => { state.settings = s.val() || {}; checkLoaded(); });
onValue(ref(db, "products"), s => { state.products = s.val() || {}; checkLoaded(); });

function initPage() {
  document.getElementById('brandLogo').innerHTML = `<div style="width:34px;height:34px;display:inline-block;vertical-align:middle;margin-right:8px;">${DEFAULT_LOGO}</div> ${esc(state.settings.name || "KodinganKita")}`;
  renderProduct();
}

function renderProduct() {
  const p = state.products[productId];
  if(!p) return document.getElementById('app').innerHTML = `<div class="empty-state">Produk tidak ditemukan.</div>`;
  
  const isAvail = p.status !== 'sold' && p.status !== 'reserved';
  const isLimited = p.productType === 'limited_html';

  document.getElementById('app').innerHTML = `
    <a href="katalog.html" style="display:inline-block;margin-bottom:16px;font-size:14px;font-weight:600;color:var(--text-muted)">&larr; Kembali</a>
    
    <div class="detail-img">
      <img src="${p.imageURLs?.[0] || 'https://placehold.co/800x450/f1f5f9/64748b?text=No+Image'}">
    </div>
    
    <div class="detail-header">
      <div>
        <div style="font-size:12px;font-weight:700;color:var(--primary);text-transform:uppercase;margin-bottom:4px">${esc(p.category)}</div>
        <h1 class="detail-title">${esc(p.title)}</h1>
      </div>
      <button class="btn-icon" onclick="navigator.clipboard.writeText(window.location.href).then(()=>alert('Link disalin!'))" title="Salin Link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
      </button>
    </div>

    <div class="price-box">${rupiah(p.price)}</div>

    ${isLimited ? `
      <div class="meta-info">
        <span style="color:${isAvail ? 'var(--success)' : 'var(--danger)'}; font-weight:700;">
          ${isAvail ? 'Tersedia (Sisa 1)' : 'Sudah Terjual'}
        </span>
      </div>
      ${p.hashtags ? `<div class="hashtags">${p.hashtags.split(',').map(h => `<span class="hashtag">#${esc(h.trim())}</span>`).join('')}</div>` : ''}
    ` : `
      <div class="meta-info">
        <span>Total Terjual: <b>${p.totalSold || 0}</b></span>
        <span>Rating: <b>${p.ratingAvg ? p.ratingAvg.toFixed(1) : '0.0'}</b></span>
      </div>
    `}

    <h3 class="desc-title">Deskripsi Lengkap</h3>
    <div class="desc-text">${esc(p.description || "Tidak ada deskripsi.")}</div>

    ${isLimited && p.demoURL ? `
      <a href="${p.demoURL}" target="_blank" class="btn btn-outline" style="margin-bottom:12px">
        Lihat Proyek (Live Preview)
      </a>
    ` : ''}

    ${!isAvail 
      ? `<button class="btn btn-disabled" disabled>Maaf, Produk Sudah Terjual</button>`
      : `<button class="btn btn-primary" onclick="buyFlow('${p.id}')">Beli Sekarang</button>`
    }
  `;
}

window.buyFlow = async (pid) => {
  if(!state.user) {
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this)document.getElementById('modal-root').innerHTML=''">
        <div class="modal-box">
          <button class="close-btn" onclick="document.getElementById('modal-root').innerHTML=''">&times;</button>
          <div class="modal-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg></div>
          <h3 class="modal-title">Harap Masuk</h3>
          <p class="modal-desc">Silakan masuk dengan Google untuk melanjutkan.</p>
          <button class="btn btn-primary" onclick="handleAuth(); document.getElementById('modal-root').innerHTML='';" style="margin-bottom:10px"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" style="width:18px"> Masuk Google</button>
          <button class="btn btn-outline" onclick="document.getElementById('modal-root').innerHTML=''">Batal</button>
        </div>
      </div>`;
    return;
  }

  try {
    const orderRef = push(ref(db, 'orders'));
    const orderId = orderRef.key;
    const now = Date.now();
    const expiresAt = now + (3 * 60 * 1000); 

    // Kunci Produk
    const result = await runTransaction(ref(db, `products/${pid}`), (p) => {
      if (!p) return null;
      if (p.status === 'sold' || p.status === 'reserved') return null;
      return { ...p, status: 'reserved', availability: 'reserved', reservedBy: state.user.uid, reservedUntil: expiresAt, reservationOrderId: orderId };
    });

    if (!result.committed) return alert("Maaf, produk baru saja diambil orang lain.");

    const commRate = state.settings.commissionRate || 0.10;
    const price = Number(state.products[pid].price);
    await set(orderRef, {
      buyerId: state.user.uid, buyerName: state.user.displayName, sellerId: state.products[pid].sellerId || 'admin', productId: pid,
      productTitleSnapshot: state.products[pid].title, priceSnapshot: price, commissionSnapshot: price * commRate, sellerAmountSnapshot: price - (price * commRate),
      paymentStatus: 'pending', orderStatus: 'reserved', createdAt: now, expiresAt: expiresAt
    });

    renderPayment(orderId, price, expiresAt);
  } catch(e) { alert("Gagal membuat pesanan: " + e.message); }
};

function renderPayment(orderId, price, expiresAt) {
  document.getElementById('app').innerHTML = `
    <div style="max-width:480px;margin:0 auto;text-align:center;padding-top:20px">
      <h2 style="margin-bottom:20px">Selesaikan Pembayaran</h2>
      <div class="timer" id="timerDisplay">03:00</div>
      <div class="qris-box">
        <img src="${QRIS_IMG}">
        <p style="font-size:13px;color:var(--text-muted);margin-top:16px">Total: <b style="color:var(--primary);font-size:18px">${rupiah(price)}</b></p>
      </div>
      <button class="btn btn-primary" style="margin-bottom:12px" onclick="confirmPayment('${orderId}', '${productId}', this)">Saya Sudah Bayar</button>
      <button class="btn btn-outline" onclick="cancelOrder('${orderId}', '${productId}')">Batalkan Pesanan</button>
    </div>
  `;

  if(state.orderTimer) clearInterval(state.orderTimer);
  const tick = () => {
    const r = expiresAt - Date.now();
    if(r <= 0) { clearInterval(state.orderTimer); expireOrder(orderId, productId); return; }
    const m = Math.floor(r / 60000), s = Math.floor((r % 60000) / 1000);
    const el = document.getElementById("timerDisplay");
    if(el) el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  };
  tick();
  state.orderTimer = setInterval(tick, 1000);
}

window.confirmPayment = async (orderId, pid, btn) => {
  if(!confirm("Pastikan Anda sudah mentransfer dana. Lanjutkan?")) return;
  btn.textContent = "Memproses..."; btn.disabled = true;
  await update(ref(db, `orders/${orderId}`), { paymentStatus: 'awaiting_verification' });
  clearInterval(state.orderTimer);
  alert("Konfirmasi terkirim. Menunggu verifikasi Admin.");
  document.getElementById('page-loader').classList.remove('hidden');
  setTimeout(() => { window.location.href = "riwayat.html"; }, 300);
};

window.cancelOrder = async (orderId, pid) => {
  if(!confirm("Batalkan pesanan ini?")) return;
  await runTransaction(ref(db, `products/${pid}`), (p) => {
    if(!p || p.reservationOrderId !== orderId) return p;
    return { ...p, status: 'available', availability: 'available', reservedBy: null, reservationOrderId: null };
  });
  await update(ref(db, `orders/${orderId}`), { paymentStatus: 'cancelled', orderStatus: 'cancelled' });
  clearInterval(state.orderTimer);
  document.getElementById('page-loader').classList.remove('hidden');
  setTimeout(() => { window.location.href = "katalog.html"; }, 300);
};

async function expireOrder(orderId, pid) {
  await runTransaction(ref(db, `products/${pid}`), (p) => {
    if(!p || p.reservationOrderId !== orderId) return p;
    return { ...p, status: 'available', availability: 'available', reservedBy: null, reservationOrderId: null };
  });
  await update(ref(db, `orders/${orderId}`), { paymentStatus: 'expired', orderStatus: 'expired' });
  clearInterval(state.orderTimer);
  alert("Waktu habis. Pesanan dibatalkan.");
  renderProduct(); 
}
</script>
</body>
</html>
